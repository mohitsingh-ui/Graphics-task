<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #faf9f6;
  --line: #e7e4dd;
  --line-strong: #d6d1c6;
  --text: #1f1d1a;
  --text-2: #5c5750;
  --text-3: #8b857b;
  --accent: #a56312;
  --accent-ink: #7f4a0b;
  --accent-soft: #f7ecdc;
  --ok: #2f7d4f; --ok-soft: #e3f3e8;
  --warn: #9a6400; --warn-soft: #fdf1d6;
  --bad: #b3362b; --bad-soft: #fbe6e3;
  --info: #2d5f9a; --info-soft: #e5eef9;
  --muted-soft: #eeece7;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(31,29,26,.05), 0 1px 1px rgba(31,29,26,.03);
  --shadow-lg: 0 12px 32px rgba(31,29,26,.14);
  --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; } h4 { font-size: 13px; }
p { margin: 0 0 8px; }
small, .small { font-size: 12px; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.hidden { display: none !important; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pre { white-space: pre-wrap; word-break: break-word; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font: 500 13px var(--font); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border-color: #e9c3be; }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--muted-soft); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.btn.lg { height: 44px; padding: 0 20px; font-size: 14px; }
.btn.icon { width: 36px; padding: 0; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- form controls ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.field .hint { font-size: 12px; color: var(--text-3); }
.req::after { content: ' *'; color: var(--bad); }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=time], input[type=url], input[type=search], select, textarea {
  width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface);
  color: var(--text); font: 400 14px var(--font); }
textarea { height: auto; min-height: 92px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); }
.field .err { font-size: 12px; color: var(--bad); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; height: 34px; padding: 0 12px; font: 500 12.5px var(--font); color: var(--text-2); cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent-ink); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-b { padding: 16px; }
.card-b.tight { padding: 4px 0; }
.section-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; margin-bottom: 8px; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-align: left; cursor: pointer; font-family: var(--font); color: var(--text); }
.kpi:hover { border-color: var(--line-strong); }
.kpi .k-label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .k-val { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.kpi.alert .k-val { color: var(--bad); }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--muted-soft); color: var(--text-2); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.badge.plain::before { display: none; }
.s-new-requirement, .s-under-review { background: var(--info-soft); color: var(--info); }
.s-ready-for-assignment { background: #efe9f8; color: #5b3f8f; }
.s-assigned { background: var(--muted-soft); color: var(--text-2); }
.s-in-progress { background: var(--accent-soft); color: var(--accent-ink); }
.s-submitted-for-approval, .s-resubmitted-for-approval, .s-awaiting-approval { background: var(--warn-soft); color: var(--warn); }
.s-changes-requested { background: var(--bad-soft); color: var(--bad); }
.s-approved, .s-completed { background: var(--ok-soft); color: var(--ok); }
.s-on-hold, .s-cancelled, .s-superseded, .s-draft { background: var(--muted-soft); color: var(--text-3); }
.p-urgent { background: var(--bad-soft); color: var(--bad); }
.p-high { background: var(--warn-soft); color: var(--warn); }
.p-medium { background: var(--info-soft); color: var(--info); }
.p-low { background: var(--muted-soft); color: var(--text-3); }
.overdue-flag { color: var(--bad); font-weight: 500; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--text); }
table.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }

/* ---------- lists ---------- */
.list-item { display: flex; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.list-item:last-child { border-bottom: 0; }
.list-item:hover { background: var(--surface-2); }
.list-item .li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-sub { font-size: 12px; color: var(--text-3); }

/* ---------- progress ---------- */
.prog { height: 6px; background: var(--muted-soft); border-radius: 999px; overflow: hidden; min-width: 60px; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.prog.ok > i { background: var(--ok); }

/* ---------- empty / loading ---------- */
.empty { text-align: center; padding: 34px 18px; color: var(--text-3); }
.empty svg { width: 30px; height: 30px; color: var(--line-strong); margin-bottom: 6px; }
.empty b { display: block; color: var(--text-2); font-weight: 500; margin-bottom: 2px; }
.skel { background: linear-gradient(90deg, var(--muted-soft), #f6f4ef, var(--muted-soft)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 6px; }
@keyframes sk { to { background-position: -200% 0; } }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-page { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px; color: var(--text-3); }

/* ---------- alerts ---------- */
.alert { padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid; }
.alert.info { background: var(--info-soft); border-color: #cbdcf2; color: #224a78; }
.alert.warn { background: var(--warn-soft); border-color: #f0dcae; color: #7a4f00; }
.alert.bad { background: var(--bad-soft); border-color: #f2c9c4; color: #8d2a21; }
.alert.ok { background: var(--ok-soft); border-color: #c7e6d1; color: #22603c; }

/* ---------- modal / toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(31,29,26,.38); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 95; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 560px; box-shadow: var(--shadow-lg); }
.modal.wide { max-width: 980px; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 12px 12px; }
.toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: calc(100vw - 36px); }
.toast { background: #2a2723; color: #fff; padding: 11px 15px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-lg); max-width: 380px; }
.toast.bad { background: var(--bad); }

/* ---------- media ---------- */
.thumb { width: 56px; height: 56px; border-radius: 8px; background: var(--muted-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; color: var(--text-3); font-size: 10px; font-weight: 600; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.preview-box { background: repeating-conic-gradient(#f1efea 0% 25%, #fbfaf7 0% 50%) 50% / 18px 18px; border: 1px solid var(--line); border-radius: var(--radius); min-height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.preview-box img { max-width: 100%; max-height: 70vh; display: block; }
.lightbox { position: fixed; inset: 0; background: rgba(15,14,12,.92); z-index: 90; display: flex; flex-direction: column; }
.lightbox .lb-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; gap: 8px; }
.lightbox .lb-bar .btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; }
.lightbox .lb-stage { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 10px; }
.lightbox .lb-stage img { transform-origin: top center; max-width: none; }

/* ---------- dropzone ---------- */
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--text-2); background: var(--surface-2); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 26px; height: 26px; color: var(--text-3); margin-bottom: 4px; }
.file-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); font-size: 13px; }
.file-row .prog { flex: 0 0 90px; }

/* ---------- timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 14px 22px; font-size: 13px; }
.timeline li::before { content: ''; position: absolute; left: 5px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.timeline li::after { content: ''; position: absolute; left: 8px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline .t-meta { font-size: 11.5px; color: var(--text-3); }
.timeline .t-note { margin-top: 3px; padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; white-space: pre-wrap; }

/* ---------- key/value ---------- */
dl.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--text-3); }
dl.kv dd { margin: 0; word-break: break-word; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; font: 500 13px var(--font); color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; background: var(--muted-soft); padding: 1px 6px; border-radius: 999px; margin-left: 4px; }

.bar-row { display: grid; grid-template-columns: 140px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; padding: 4px 0; }
.bar-row .bar { height: 8px; background: var(--muted-soft); border-radius: 4px; overflow: hidden; }
.bar-row .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar-row .bar > i.hot { background: var(--bad); }

@media (max-width: 760px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  dl.kv { grid-template-columns: 1fr; gap: 2px; }
  dl.kv dd { margin-bottom: 8px; }
  .modal-back { padding: 0; align-items: stretch; }
  .modal { border-radius: 0; min-height: 100%; }
  .bar-row { grid-template-columns: 100px 1fr 34px; }
}
.reward-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); text-decoration: none; }
.reward-pill svg { width: 15px; height: 15px; }
.reward-list { list-style: none; margin: 0; padding: 0; }
.reward-list li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.reward-list li:first-child { border-top: 0; padding-top: 0; }
.reward-badge { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.reward-badge svg { width: 18px; height: 18px; }
.pts { color: var(--ok); font-weight: 700; font-size: 13px; }
.lboard { list-style: none; margin: 0; padding: 0; }
.lboard li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; }
.lboard li.me { background: var(--accent-soft); }
.lboard .rank { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-2); }
.lboard li:first-child .rank { background: var(--accent); color: #fff; }
.lboard svg { width: 15px; height: 15px; color: var(--accent); vertical-align: -2px; }
.badge-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badge-pick input { position: absolute; opacity: 0; }
.badge-pick span { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 13px; }
.badge-pick span svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.badge-pick small { margin-left: auto; color: var(--text-3); }
.badge-pick input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.badge-pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.bulkbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; z-index: 2; }
.ver > .pick, .bulkbar input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--ok); flex: none; margin-top: 2px; cursor: pointer; }
.lightbox.gal { background: rgba(14,13,11,.97); }
.gal .lb-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.gal .lb-count { font-size: 12.5px; color: rgba(255,255,255,.65); white-space: nowrap; }
.gal .lb-zl { min-width: 44px; text-align: center; font-size: 12px; }
.gal .lb-main { flex: 1; position: relative; display: flex; min-height: 0; }
.gal .lb-stage { flex: 1; padding: 10px 68px; align-items: flex-start; justify-content: flex-start; }
.gal .lb-stage img { margin: auto; }
.gal .lb-msg { margin: auto; color: #ddd; font-size: 14px; text-align: center; max-width: 420px; }
.gal .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; cursor: pointer; }
.gal .lb-nav:hover { background: rgba(255,255,255,.24); }
.gal .lb-nav svg { width: 26px; height: 26px; }
.gal .lb-nav.prev { left: 12px; } .gal .lb-nav.next { right: 12px; }
.gal .lb-actions { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #1b1a17; border-top: 1px solid rgba(255,255,255,.12); color: #eee; }
.gal .lb-info { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; color: rgba(255,255,255,.75); }
.gal .lb-chip { flex: none; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.12); color: #fff; }
.gal .lb-chip.approved, .gal .lb-chip.final-approved { background: #1f6b3e; } .gal .lb-chip.changes-requested { background: #8d2a21; }
.gal .lb-chip.awaiting-approval, .gal .lb-chip.waiting-for-your-review { background: #8a5a12; }
.gal .lb-btns .btn { height: 38px; padding: 0 18px; }
.gal .lb-actions .btn.danger:not(.solid) { background: transparent; color: #ffb4ab; border-color: rgba(255,180,171,.5); }
.gal .lb-fb { display: flex; gap: 10px; align-items: flex-end; width: 100%; }
.gal .lb-fb textarea { flex: 1; min-height: 44px; background: #fff; color: #1f1d1a; }
@media (max-width: 640px) {
  .gal .lb-stage { padding: 6px 8px; }
  .gal .lb-nav { width: 38px; height: 38px; background: rgba(0,0,0,.45); }
  .gal .lb-nav.prev { left: 4px; } .gal .lb-nav.next { right: 4px; }
  .gal .hide-sm, .gal [data-z], .gal .lb-zl { display: none; }
  .gal .lb-bar { padding: 8px 10px; }
  .gal .lb-title { flex-direction: column; gap: 0; }
  .gal .lb-title b { max-width: calc(100vw - 120px); font-size: 14px; }
  .gal .lb-actions { flex-wrap: wrap; }
  .gal .lb-btns { width: 100%; } .gal .lb-btns .btn { flex: 1; }
  .gal .lb-fb { flex-direction: column; align-items: stretch; }
}
.seg-choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg-choice input { position: absolute; opacity: 0; }
.seg-choice span { display: flex; flex-direction: column; gap: 2px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 13px; height: 100%; }
.seg-choice small { color: var(--text-3); font-size: 11.5px; }
.seg-choice input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.seg-choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

/** Call a server function. Resolves with data, rejects with {code, message}. */
function api(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(function (r) {
        if (!r) return reject({ code: 'EMPTY', message: 'No response from server.' });
        if (r.ok) resolve(r.data); else reject(r.error || { message: 'Request failed.' });
      })
      .withFailureHandler(function (e) {
        reject({ code: 'NETWORK', message: (e && e.message) ? 'Connection problem: ' + e.message : 'Connection problem. Check your internet and try again.' });
      });
    runner[name].apply(runner, args);
  });
}

/** HTML-escape. Every dynamic value goes through this before it touches innerHTML. */
function h(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {

}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(v) {
  if (!v) return '—';
  var d = /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + 'T00:00:00') : new Date(v);
  if (isNaN(d)) return h(v);
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtDateTime(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d)) return h(v);
  return fmtDate(v) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

function ago(v) {
  if (!v) return '';
  var s = (Date.now() - new Date(v).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return fmtDate(v);

/** "17:30" → "5:30 PM" */
function fmtTime(t) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(t || '');

function fileSize(n) { n = Number(n || 0); return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

    '<div class="modal-b">' + (opts.body || '') + '</div>' +
    (opts.actions && opts.actions.length ? '<div class="modal-f"></div>' : '') + '</div>';
  document.body.appendChild(back);
  var el = $('.modal', back);
  function close() { back.remove(); document.removeEventListener('keydown', onKey); if (opts.onClose) opts.onClose(); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  $('[data-x]', back).onclick = close;
  back.addEventListener('mousedown', function (e) { if (e.target === back && !opts.sticky) close(); });
  var foot = $('.modal-f', back);
  (opts.actions || []).forEach(function (a) {
    var b = document.createElement('button');
    b.className = 'btn ' + (a.cls || '');
    b.textContent = a.label;
    b.onclick = function () {
      if (!a.onClick) return close();

      if (r && r.then) {
        var txt = b.textContent; b.disabled = true; b.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span> ' + h(txt);
        r.then(function () { b.disabled = false; b.textContent = txt; }, function () { b.disabled = false; b.textContent = txt; });
      }

  });

  var first = $('input:not([readonly]):not([type=hidden]), select, textarea', el);
  if (first) setTimeout(function () { if (!el.contains(document.activeElement)) first.focus(); }, 30);

/* ---------- file helpers ---------- */
function downloadBase64(name, mime, b64) {
  var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
  for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([arr], { type: mime || 'application/octet-stream' }));
  var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function downloadText(name, text, mime) {
  var url = URL.createObjectURL(new Blob([text], { type: mime || 'text/csv;charset=utf-8' }));
  var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

function readChunk(file, start, end) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { var s = String(r.result); resolve(s.slice(s.indexOf(',') + 1)); };
    r.onerror = function () { reject({ message: 'Could not read the file from your device.' }); };
    r.readAsDataURL(file.slice(start, end));
  });
}

/**
 * Upload a File into Drive.
 * Fast path: bytes go straight from the browser to the Drive upload session the
 * server opened (one request, no base64). If that's blocked, it falls back to
 * 4 MB chunks through the server, continuing from where Drive stopped.
 * ctx is passed to api_startUpload (kind, ticket/taskId, metadata).
 * onProgress(fraction 0..1). Resolves with the final server result.
 */
var UPLOAD_DIRECT = true;
function uploadFile(file, ctx, onProgress) {
  var c = Object.assign({}, ctx, { fileName: file.name, size: file.size, mimeType: file.type, origin: UPLOAD_DIRECT ? location.origin : '' });
  var shown = 0;
  function prog(p) { p = Math.max(0.01, Math.min(0.99, p)); if (onProgress && p - shown >= 0.01) { shown = p; onProgress(p); } }
  return api('api_startUpload', c).then(function (start) {
    prog(0.02);
    function viaServer(offset) {
      var chunk = start.chunkBytes;
      function next() {
        var end = Math.min(offset + chunk, file.size);
        return readChunk(file, offset, end).then(function (b64) { return sendWithRetry(b64, 0); }).then(function (res) {
          offset = end;
          prog(offset / file.size);
          if (res.done) return res;
          return next();
        });
      }
      function sendWithRetry(b64, attempt) {
        return api('api_uploadChunk', start.uploadId, offset, b64).catch(function (e) {
          if (e.code === 'NETWORK' && attempt < 2) return new Promise(function (r) { setTimeout(r, 1500 * (attempt + 1)); }).then(function () { return sendWithRetry(b64, attempt + 1); });
          throw e;
        });
      }
      return next();
    }
    function finish() {
      return api('api_finishUpload', start.uploadId).then(function (res) {
        return res.done ? res : viaServer(res.received || 0);
      });
    }
    if (!start.direct) return viaServer(0);
    return putDirect(start.direct, file, function (p) { prog(0.02 + p * 0.95); })
      .then(finish, function () { UPLOAD_DIRECT = false; return finish(); });
  }).then(function (res) { if (onProgress) onProgress(1); return res; });
}

/** One PUT of the whole file to a Drive upload session, with progress. */
function putDirect(url, file, onProgress) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open('PUT', url, true);
    x.upload.onprogress = function (e) { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = function () { (x.status === 200 || x.status === 201) ? resolve() : reject({ status: x.status }); };
    x.onerror = x.onabort = x.ontimeout = function () { reject({ status: 0 }); };
    x.send(file);
  });
}

/** Runs fn over items with at most n at a time. Resolves when all have settled. */
function runPool(items, n, fn) {
  var i = 0;
  function worker() {
    if (i >= items.length) return Promise.resolve();
    var item = items[i], idx = i++;
    return Promise.resolve().then(function () { return fn(item, idx); }).catch(function () {}).then(worker);
  }
  var ws = [];
  for (var k = 0; k < Math.min(n, items.length); k++) ws.push(worker());
  return Promise.all(ws);
}

/* ---------- lightbox with zoom ---------- */
function lightbox(src, title, extraBtns) {
  var lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = '<div class="lb-bar"><div class="ellipsis">' + h(title || '') + '</div><div class="row">' +
    '<button class="btn sm" data-z="-">' + icon('zoomOut') + '</button><span data-zl style="min-width:44px;text-align:center;font-size:12px">Fit</span>' +
    '<button class="btn sm" data-z="+">' + icon('zoomIn') + '</button><button class="btn sm" data-z="fit">Fit</button><button class="btn sm" data-z="1">100%</button>' +
    (extraBtns || '') + '<button class="btn sm" data-close aria-label="Close">' + icon('x') + '</button></div></div>' +
    '<div class="lb-stage"><img alt=""></div>';
  document.body.appendChild(lb);
  var img = $('img', lb), stage = $('.lb-stage', lb), label = $('[data-zl]', lb), z = 0;
  img.src = src;
  function fit() {
    var nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
    z = Math.min(1, (stage.clientWidth - 20) / nw, (stage.clientHeight - 20) / nh);
    apply();
  }
  function apply() { img.style.width = (img.naturalWidth * z) + 'px'; label.textContent = Math.round(z * 100) + '%'; }
  img.onload = fit;
  $all('[data-z]', lb).forEach(function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-z');
      if (v === '+') z = Math.min(8, z * 1.25); else if (v === '-') z = Math.max(0.05, z / 1.25); else if (v === '1') z = 1; else return fit();
      apply();
    };
  });
  function close() { lb.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  $('[data-close]', lb).onclick = close;
  return lb;
}

/**
 * Full-screen gallery: arrows / swipe / ← → keys move between creatives.
 * The decision bar sits BELOW the image (never over it).
 * items: [{ title, sub, status, load() → Promise<{dataUrl|message}>, download?() → Promise<{fileName,mimeType,base64}>, canDecide? }]
 * opts: { start, decide(item, decision, comment) → Promise, onClose(changed) }
 */
function gallery(items, opts) {
  opts = opts || {};
  var i = Math.max(0, Math.min(items.length - 1, opts.start || 0)), z = 0, fitZ = 0, changed = false, mode = '', cache = {};
  var lb = document.createElement('div');
  lb.className = 'lightbox gal';
  lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true');
  lb.innerHTML = '<div class="lb-bar"><div class="lb-title"><b class="ellipsis" data-t></b><span class="lb-count" data-c></span></div><div class="row">' +
    '<button class="btn sm" data-z="-" aria-label="Zoom out">' + icon('zoomOut') + '</button><span data-zl class="lb-zl">Fit</span>' +
    '<button class="btn sm" data-z="+" aria-label="Zoom in">' + icon('zoomIn') + '</button><button class="btn sm" data-z="fit">Fit</button><button class="btn sm hide-sm" data-z="1">100%</button>' +
    '<button class="btn sm" data-dl>' + icon('download') + '<span class="hide-sm"> Download</span></button>' +
    '<button class="btn sm" data-close aria-label="Close">' + icon('x') + '</button></div></div>' +
    '<div class="lb-main"><div class="lb-stage"><img alt=""><div class="lb-msg hidden"></div></div>' +
    '<button class="lb-nav prev" data-prev aria-label="Previous creative">' + icon('chevL') + '</button>' +
    '<button class="lb-nav next" data-next aria-label="Next creative">' + icon('chevR') + '</button></div>' +
    '<div class="lb-actions" data-a></div>';
  document.body.appendChild(lb);
  var img = $('img', lb), stage = $('.lb-stage', lb), msg = $('.lb-msg', lb), label = $('[data-zl]', lb);

  function fit() {
    var nw = img.naturalWidth || 1, nh = img.naturalHeight || 1, cs = getComputedStyle(stage);
    var w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var hh = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    fitZ = z = Math.min(1, (w - 4) / nw, (hh - 4) / nh);
    apply();
  }
  function apply() { img.style.width = (img.naturalWidth * z) + 'px'; label.textContent = Math.round(z * 100) + '%'; }
  img.onload = function () { img.classList.remove('hidden'); fit(); };
  $all('[data-z]', lb).forEach(function (b) {
    b.onclick = function () {
      var v = b.getAttribute('data-z');
      if (v === '+') z = Math.min(8, z * 1.25); else if (v === '-') z = Math.max(0.05, z / 1.25); else if (v === '1') z = 1; else return fit();
      apply();
    };
  });
  function load(k) {
    if (!items[k]) return null;
    if (!cache[k]) cache[k] = items[k].load().catch(function (e) { delete cache[k]; throw e; });
    return cache[k];
  }
  function show(n) {
    i = (n + items.length) % items.length;
    mode = '';
    var it = items[i];
    $('[data-t]', lb).textContent = it.title || '';
    $('[data-c]', lb).textContent = items.length > 1 ? (i + 1) + ' / ' + items.length : '';
    $('[data-prev]', lb).classList.toggle('hidden', items.length < 2);
    $('[data-next]', lb).classList.toggle('hidden', items.length < 2);
    $('[data-dl]', lb).classList.toggle('hidden', !it.download);
    img.classList.add('hidden'); img.removeAttribute('src');
    msg.textContent = 'Loading…'; msg.classList.remove('hidden');
    var mine = i;
    load(i).then(function (p) {
      if (mine !== i || !document.body.contains(lb)) return;
      if (p && p.dataUrl) { msg.classList.add('hidden'); img.src = p.dataUrl; }
      else msg.textContent = (p && p.message) || 'No preview for this file type. Use Download to open it.';
    }).catch(function (e) { if (mine === i) msg.textContent = errMsg(e); });
    if (items.length > 1) { try { load((i + 1) % items.length); } catch (e) { /* preload is best effort */ } }
    drawActions();
  }
  function drawActions() {
    var it = items[i], a = $('[data-a]', lb);
    if (!it.status && !it.canDecide && !it.sub) { a.classList.add('hidden'); return; }
    a.classList.remove('hidden');
    var info = '<div class="lb-info">' + (it.status ? '<span class="lb-chip ' + slug(it.status) + '">' + h(it.status) + '</span>' : '') +
      (it.sub ? '<span class="ellipsis">' + h(it.sub) + '</span>' : '') + '</div>';
    if (!it.canDecide) { a.innerHTML = info; return; }
    if (mode === 'changes' || mode === 'rejected') {
      var rej = mode === 'rejected';
      a.innerHTML = '<div class="lb-fb"><textarea id="lbFb" rows="2" maxlength="4000" placeholder="' + (rej ? 'Why is it rejected? e.g. Wrong product, off-brand' : 'What should change? e.g. Make the price bigger, use the 1L jar') + '"></textarea>' +
        '<div class="row"><button class="btn sm" data-cancel>Cancel</button><button class="btn sm danger solid" data-send>' + (rej ? 'Reject creative' : 'Send feedback') + '</button></div></div>';
      $('#lbFb', a).focus();
      $('[data-cancel]', a).onclick = function () { mode = ''; drawActions(); };
      $('[data-send]', a).onclick = function () {
        var c = $('#lbFb', a).value.trim();
        if (c.length < 5) return toast(rej ? 'Say why it’s rejected.' : 'Tell the designer what to change.', true);
        decide(mode, c, this);
      };
      return;
    }
    a.innerHTML = info + '<div class="row lb-btns">' + (opts.noReject ? '' : '<button class="btn ghost lb-rej" data-rej>Reject</button>') +
      '<button class="btn danger" data-chg>Request changes</button><button class="btn ok solid" data-okk>' + icon('check') + ' Approve</button></div>';
    $('[data-chg]', a).onclick = function () { mode = 'changes'; drawActions(); };
    if ($('[data-rej]', a)) $('[data-rej]', a).onclick = function () { mode = 'rejected'; drawActions(); };
    $('[data-okk]', a).onclick = function () { decide('approved', '', this); };
  }
  function decide(decision, comment, btn) {
    var it = items[i];
    $all('[data-a] button', lb).forEach(function (b) { b.disabled = true; });
    opts.decide(it, decision, comment).then(function () {
      changed = true; it.canDecide = false; it.status = decision === 'approved' ? 'Approved' : decision === 'rejected' ? 'Rejected' : 'Changes requested';
      toast(decision === 'approved' ? 'Approved' : decision === 'rejected' ? 'Rejected' : 'Feedback sent');
      // Move on to the next creative still waiting for a decision.
      for (var k = 1; k < items.length; k++) { var j = (i + k) % items.length; if (items[j].canDecide) return show(j); }
      mode = ''; drawActions();
    }).catch(function (e) { toast(errMsg(e), true); $all('[data-a] button', lb).forEach(function (b) { b.disabled = false; }); });
  }
  $('[data-prev]', lb).onclick = function () { show(i - 1); };
  $('[data-next]', lb).onclick = function () { show(i + 1); };
  $('[data-dl]', lb).onclick = function () {
    var b = this; b.disabled = true;
    items[i].download().then(function (f) { downloadBase64(f.fileName, f.mimeType, f.base64); })
      .catch(function (e) { toast(errMsg(e), true); }).then(function () { b.disabled = false; });
  };
  var tx = null, ty = null;
  stage.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (z <= fitZ + 0.001 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && items.length > 1) show(dx < 0 ? i + 1 : i - 1);
  });
  function close() {
    lb.remove(); document.removeEventListener('keydown', onKey); window.removeEventListener('resize', fit);
    if (opts.onClose) opts.onClose(changed);
  }
  function onKey(e) {
    if (e.key === 'Escape') { if (mode) { mode = ''; return drawActions(); } return close(); }
    if (/^(TEXTAREA|INPUT|SELECT)$/.test((e.target || {}).tagName)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); show(i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', fit);
  $('[data-close]', lb).onclick = close;
  show(i);
  return lb;
}

/** Image element for a preview response from the server. */
function previewHtml(p, alt) {
  if (!p) return '<div class="empty">No preview</div>';
  if (p.dataUrl) return '<img src="' + h(p.dataUrl) + '" alt="' + h(alt || 'Creative preview') + '">';
  return '<div class="empty">' + icon('file') + '<b>' + h(p.message || 'No preview available') + '</b></div>';
}

/* AppCore.js — app bootstrap, role-based navigation, routing, notifications. */

var APP = { boot: null, route: 'overview', role: null, viewToken: 0, pre: {} };

/** Uses data that arrived with the page (once), otherwise calls the server. */
function apiPre(name) {
  var r = APP.pre[name];
  if (r) {
    delete APP.pre[name];
    return r.ok ? Promise.resolve(r.data) : Promise.reject(r.error || { message: 'Request failed.' });
  }

}

/* ---------- instant screens ----------
 * Read calls are remembered for 10 minutes. Re-opening a screen shows the
 * remembered data at once and fetches fresh data in the background; if it
 * changed, the screen quietly redraws. Any change you make (a "write" call)
 * clears the memory, so you never see stale data after an edit. */
var READ_APIS = { api_leaderDashboard: 1, api_designerDashboard: 1, api_listTasks: 1, api_getTask: 1, api_listApprovals: 1, api_listRewards: 1,
  api_getReports: 1, api_listTeam: 1, api_listCampaigns: 1, api_getCampaign: 1, api_listCompletedRequests: 1, api_getSettings: 1, api_listBatchLinks: 1,
  api_listThemes: 1, api_listTaskShares: 1, api_folderOptions: 1 };
// Calls that neither read a screen nor change anything.
var PASS_APIS = { api_getThumbs: 1, api_getAsset: 1, api_getNotifications: 1, api_downloadApprovedZip: 1, api_exportCsv: 1, api_bootstrap: 1 };
var VIEW_CACHE = {}, RAW_API = api;
api = function (name) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (!READ_APIS[name]) { if (!PASS_APIS[name]) VIEW_CACHE = {}; return RAW_API.apply(null, arguments); }
  var key = name + '|' + JSON.stringify(args), c = VIEW_CACHE[key], now = Date.now();
  function fresh() {
    return RAW_API.apply(null, [name].concat(args)).then(function (d) {
      var j = JSON.stringify(d), was = VIEW_CACHE[key];
      VIEW_CACHE[key] = { t: Date.now(), json: j };
      return { d: d, changed: !!was && was.json !== j };
    });
  }
  if (c && now - c.t < 600000) {
    if (now - c.t > 2500 && !c.pending) {
      var route = APP.route; c.pending = true;
      fresh().then(function (r) {
        var busy = document.querySelector('.modal-back, .lightbox') || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName);
        if (r.changed && APP.route === route && !busy) render(route, true);
      }).catch(function () { /* keep showing what we have */ }).then(function () { c.pending = false; });
    }
    return Promise.resolve(JSON.parse(c.json));
  }
  return fresh().then(function (r) { return r.d; });
};

    setInterval(loadNotifications, 90000);
  }).catch(function (e) {
    $('#view').innerHTML = '<div class="card" style="max-width:520px;margin:40px auto"><div class="card-b"><h2>Can’t open the portal</h2><p class="muted" style="margin-top:6px">' + h(errMsg(e)) + '</p></div></div>';
  });
}

function closeMenu() { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }

function buildNav() {
  $('#nav').innerHTML = NAV[APP.role === 'leader' ? 'leader' : 'designer'].map(function (n) {
    return '<a href="#" data-r="' + n.r + '">' + icon(n.icon) + '<span>' + h(n.label) + '</span><span class="cnt hidden" data-cnt="' + n.r + '"></span></a>';
  }).join('');
  $all('#nav a').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go(a.getAttribute('data-r')); }; });
}

function navCount(route, n) {
  var el = $('[data-cnt="' + route + '"]');
  if (!el) return;
  el.textContent = n; el.classList.toggle('hidden', !n);
}

/** Navigate to an in-app route like "task/GFX-2026-0001". */
function go(route, replace) {
  route = String(route || 'overview').replace(/^#/, '');
  try {
    if (replace) google.script.history.replace({ r: route }, { p: 'app', r: route });
    else google.script.history.push({ r: route }, { p: 'app', r: route });
  } catch (e) { /* ignore */ }
  render(route);
}

function render(route, soft) {
  APP.route = route;
  closeMenu();
  var parts = route.split('/');
  var name = parts[0], arg = parts.slice(1).join('/');
  var allowed = NAV[APP.role === 'leader' ? 'leader' : 'designer'].map(function (n) { return n.r; }).concat(['task']);
  if (allowed.indexOf(name) === -1 || !VIEWS[name]) name = 'overview';
  $all('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-r') === (name === 'task' ? 'tasks' : name)); });
  var token = ++APP.viewToken;
  var el = $('#view');
  if (soft) {
    // Background refresh: redraw in place, keep the scroll position, no spinner.
    var y = window.scrollY;
    VIEWS[name](arg, el, token);
    setTimeout(function () { window.scrollTo(0, y); }, 0);
    return;
  }
  el.innerHTML = '<div class="loading-page"><span class="spinner"></span> Loading…</div>';
  window.scrollTo(0, 0);
  el.classList.remove('view-in'); void el.offsetWidth; el.classList.add('view-in');
  VIEWS[name](arg, el, token);
}

/** True if the user navigated away while a request was in flight. */
function stale(token) { return token !== APP.viewToken; }

function setCrumb(text) { $('#crumb').textContent = text; }

function viewError(el, e) {
  el.innerHTML = '<div class="card" style="max-width:560px;margin:30px auto"><div class="card-b"><h2>Couldn’t load this page</h2><p class="muted" style="margin-top:6px">' + h(errMsg(e)) +
    '</p><div class="row" style="margin-top:12px"><button class="btn" onclick="render(APP.route)">Try again</button><button class="btn ghost" onclick="go(\'overview\')">Back to overview</button></div></div></div>';
}

/* ---------- notifications ---------- */

function loadNotifications() {
  return apiPre('api_getNotifications').then(function (n) {
    APP.notifs = n;
    var b = $('#bellBtn');
    var d = $('.dotc', b);
    if (n.unread) { if (!d) { d = document.createElement('span'); d.className = 'dotc'; b.appendChild(d); } d.textContent = n.unread > 9 ? '9+' : n.unread; }
    else if (d) d.remove();
    if (!$('#notifPop').classList.contains('hidden')) renderNotifications();
  }).catch(function () { /* silent */ });
}

function toggleNotifications() {
  var pop = $('#notifPop');
  pop.classList.toggle('hidden');
  if (!pop.classList.contains('hidden')) renderNotifications();
}

function renderNotifications() {
  var n = APP.notifs || { items: [], unread: 0 };
  var pop = $('#notifPop');
  pop.innerHTML = '<div class="card-h"><h3>Notifications</h3>' + (n.unread ? '<button class="btn ghost sm" id="readAll">Mark all read</button>' : '') + '</div>' +
    (n.items.length ? n.items.map(function (x) {
      return '<div class="notif' + (x.readAt ? '' : ' unread') + '" data-id="' + h(x.notificationId) + '" data-route="' + h(x.route) + '">' +
        '<div style="font-weight:500">' + h(x.title) + '</div><div class="muted small pre" style="max-height:3.2em;overflow:hidden">' + h(x.body) + '</div>' +
        '<div class="faint small">' + ago(x.createdAt) + '</div></div>';
    }).join('') : '<div class="empty">' + icon('bell') + '<b>You’re all caught up</b></div>');
  if ($('#readAll')) $('#readAll').onclick = function () { api('api_markNotificationsRead', 'all').then(loadNotifications); };
  $all('.notif', pop).forEach(function (el) {
    el.onclick = function () {
      api('api_markNotificationsRead', [el.getAttribute('data-id')]).then(loadNotifications);
      pop.classList.add('hidden');
      if (el.getAttribute('data-route')) go(el.getAttribute('data-route'));
    };
  });
}

/* ---------- shared bits ---------- */

function kpiCard(label, value, route, opts) {
  opts = opts || {};
  var tag = route ? 'button' : 'div';
  return '<' + tag + ' class="kpi' + (opts.alert && value ? ' alert' : '') + '"' + (route ? ' data-go="' + h(route) + '"' : ' style="cursor:default"') + '>' +
    '<div class="k-label"><span class="dot" style="background:' + (opts.color || 'var(--line-strong)') + '"></span>' + h(label) + '</div>' +
    '<div class="k-val">' + h(value === null || value === undefined ? '—' : value) + '</div>' + (opts.sub ? '<div class="faint small">' + h(opts.sub) + '</div>' : '') + '</' + tag + '>';
}

/** Wire every [data-go] inside el to navigation. */
function wireGo(el) {
  $all('[data-go]', el).forEach(function (x) {
    x.addEventListener('click', function (e) { if (e.target.closest('a[href^="http"]')) return; e.preventDefault(); go(x.getAttribute('data-go')); });
  });
}

/** "Waiting on Quality" chip for tasks on hold because of someone else. */
function holdChip(t) {
  if (!t || !t.hold) return '';
  return ' <span class="hold-chip" title="' + h(t.hold.reason) + '">' + icon('clock').replace('<svg', '<svg style="width:12px;height:12px"') + ' ' +
    (t.hold.party === 'internal' ? 'On hold' : 'Waiting on ' + h(t.hold.dept || (t.hold.party === 'requester' ? 'requester' : 'other dept'))) + '</span>';
}

function dueLabel(t) {
  if (t.hold) return '<span class="faint" title="Deadline paused while on hold">Paused</span>';
  if (!t.dueDate) return '<span class="faint">No date</span>';
  var tm = t.dueTime ? ', ' + fmtTime(t.dueTime) : '';
  if (t.overdue) return '<span class="overdue-flag">' + icon('alert').replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"') + ' ' + fmtDate(t.dueDate) + tm + '</span>';
  if (t.dueDate === todayIso()) return '<span style="color:var(--warn);font-weight:500">Today' + tm + '</span>';
  return fmtDate(t.dueDate) + tm;
}

function emptyState(title, sub, ic) {
  return '<div class="empty">' + icon(ic || 'inbox') + '<b>' + h(title) + '</b>' + (sub ? '<span>' + h(sub) + '</span>' : '') + '</div>';
}
</script>

<script>
/* AppViews.js — dashboards, requirements queue, task board, approvals. */

/* ================= OVERVIEW ================= */
VIEWS.overview = function (arg, el, token) {
  if (APP.role === 'leader') return leaderOverview(el, token);
  return designerOverview(el, token, arg);
};

function leaderOverview(el, token) {
  setCrumb('Overview');
  apiPre('api_leaderDashboard').then(function (d) {
    if (stale(token)) return;
    navCount('requirements', d.kpis.newRequirements);
    navCount('approvals', d.pendingApprovals.length);
    var k = d.kpis;
    el.innerHTML =
      '<div class="page-h"><div><h1>Good ' + greeting() + ', ' + h(APP.boot.user.name.split(' ')[0]) + '</h1><p>Here’s where the graphics team stands today.</p></div>' +
      '<div class="row wrap">' + newReqButton() + '<button class="btn" data-assign-new>' + icon('users') + ' Assign a task</button><button class="btn primary" data-go="requirements">' + icon('inbox') + ' Review requirements</button></div></div>' +
      '<div class="kpis">' +
      kpiCard('New requirements', k.newRequirements, 'tasks/status=' + encodeURIComponent('New Requirement'), { color: 'var(--info)' }) +
      kpiCard('Unassigned', k.unassigned, 'tasks/status=unassigned', { color: '#5b3f8f' }) +
      kpiCard('In progress', k.inProgress, 'tasks/status=' + encodeURIComponent('In Progress'), { color: 'var(--accent)' }) +
      kpiCard('Awaiting approval', k.awaitingApproval, 'approvals', { color: 'var(--warn)' }) +
      kpiCard('Revisions required', k.revisions, 'tasks/status=' + encodeURIComponent('Changes Requested'), { color: 'var(--bad)' }) +
      kpiCard('Completed', k.completed, 'tasks/status=Completed', { color: 'var(--ok)', sub: k.completedThisMonth + ' this month' }) +
      kpiCard('Overdue', k.overdue, 'tasks/status=overdue', { alert: true, color: 'var(--bad)' }) +
      kpiCard('On hold', (k.onHoldOthers || 0) + (k.onHoldInternal || 0), 'tasks/status=' + encodeURIComponent('On Hold'), { color: '#8a5a12', sub: (k.onHoldOthers || 0) + ' waiting on other teams' }) +
      '</div>' +
      '<div class="two-col" style="margin-top:18px"><div class="stack">' +
      listCard('Incoming requirements', d.incoming, 'Nothing new. Requirements raised through the form land here.', 'requirements', true) +
      listCard('Ready to assign', d.needsAssignment, 'No tasks are waiting for a designer.', 'tasks/status=' + encodeURIComponent('Ready for Assignment'), true) +
      listCard('Overdue', d.overdue, 'Nothing is overdue. Nice.', 'tasks/status=overdue', false) +
      '</div><div class="stack">' +
      approvalsMini(d.pendingApprovals) +
      workloadCard(d.workload, d.workloadThreshold) +
      activityCard(d.activity) +
      '</div></div>';
    wireGo(el);
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
}

function greeting() { var h = new Date().getHours(); return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'; }

function listCard(title, rows, emptyText, moreRoute, showRequester) {
  return '<div class="card"><div class="card-h"><h3>' + h(title) + (rows.length ? ' <span class="faint">(' + rows.length + ')</span>' : '') + '</h3>' +
    (moreRoute ? '<a href="#" class="small" data-go="' + h(moreRoute) + '">View all</a>' : '') + '</div><div class="card-b tight">' +
    (rows.length ? rows.map(function (t) {
      return '<div class="list-item" data-go="task/' + h(t.taskId) + '"><div class="li-main"><div class="li-title">' + h(t.title) + '</div>' +
        '<div class="li-sub">' + h(t.taskId) + (showRequester && t.requesterName ? ' · ' + h(t.requesterName) + ' · ' + h(t.department) : '') +
        (t.assigneeName ? ' · ' + h(t.assigneeName) : '') + '</div></div>' +
        '<div class="row" style="flex:none">' + priorityBadge(t.priority) + '<span class="small">' + dueLabel(t) + '</span></div></div>';
    }).join('') : emptyState(emptyText)) + '</div></div>';
}

function approvalsMini(rows) {
  return '<div class="card"><div class="card-h"><h3>Pending approvals</h3><a href="#" class="small" data-go="approvals">Open approvals</a></div><div class="card-b tight">' +
    (rows.length ? rows.map(function (r) {
      return '<div class="list-item" data-go="task/' + h(r.taskId) + '"><div class="li-main"><div class="li-title">' + h(r.deliverableTitle) + ' <span class="faint">V' + h(r.versionNo) + '</span></div>' +
        '<div class="li-sub">' + h(r.taskId) + ' · ' + h(r.uploadedByName) + ' · sent ' + ago(r.createdAt) + '</div></div>' + statusBadge('Awaiting Approval') + '</div>';
    }).join('') : emptyState('No creatives waiting for review.', '', 'check')) + '</div></div>';
}

function workloadCard(rows, threshold) {
  var max = Math.max(threshold, rows.reduce(function (m, r) { return Math.max(m, r.active); }, 0), 1);
  return '<div class="card"><div class="card-h"><h3>Designer workload</h3><span class="faint small">Alert at ' + threshold + '+ active</span></div><div class="card-b">' +
    (rows.length ? rows.map(function (r) {
      return '<div class="bar-row" title="' + h(r.active + ' active, ' + r.overdue + ' overdue, ' + r.awaiting + ' awaiting approval') + '">' +
        '<span class="ellipsis">' + h(r.name) + (r.overloaded ? ' <span style="color:var(--bad)">●</span>' : '') + '</span>' +
        '<span class="bar"><i class="' + (r.overloaded ? 'hot' : '') + '" style="width:' + Math.round(r.active / max * 100) + '%"></i></span>' +
        '<span class="small" style="text-align:right">' + r.active + (r.overdue ? ' <span class="overdue-flag">·' + r.overdue + '</span>' : '') + '</span></div>';
    }).join('') : emptyState('Add designers in Team Management.', '', 'users')) + '</div></div>';
}

function activityCard(rows) {
  return '<div class="card"><div class="card-h"><h3>Recent activity</h3></div><div class="card-b" style="max-height:420px;overflow-y:auto">' +
    (rows.length ? '<ul class="timeline">' + rows.map(function (a) {
      return '<li><a href="#" data-go="task/' + h(a.taskId) + '"><b>' + h(a.taskId) + '</b></a> · ' + activityText(a) +
        '<div class="t-meta">' + h(a.actor) + ' · ' + ago(a.createdAt) + '</div></li>';
    }).join('') + '</ul>' : emptyState('No activity yet.')) + '</div></div>';
}

/** Human sentence for an activity row. */
function activityText(a) {
  switch (a.action) {
    case 'created': return 'raised this' + (a.note ? ' — ' + h(a.note) : '');
    case 'status': return 'moved from ' + h(a.fromValue) + ' to <b>' + h(a.toValue) + '</b>' + (a.note && a.note !== 'Updated automatically' ? ' — ' + h(a.note) : '');
    case 'assigned': return 'assigned to <b>' + h(a.toValue || '') + '</b>' + (a.fromValue ? ' (was ' + h(a.fromValue) + ')' : '');
    case 'assignment': return h(a.toValue || 'assigned') + ' this task' + (a.note ? ' · ' + h(a.note) : '');
    case 'progress': return 'updated progress ' + h(a.fromValue) + ' → <b>' + h(a.toValue) + '</b>';
    case 'upload': return 'uploaded <b>' + h(a.toValue) + '</b>';
    case 'submitted': return 'sent <b>' + h(a.toValue) + '</b> for approval';
    case 'approved': return '<span style="color:var(--ok)">approved</span> <b>' + h(a.toValue) + '</b>';
    case 'changes_requested': return '<span style="color:var(--bad)">requested changes</span> on <b>' + h(a.toValue) + '</b>';
    case 'rejected': return '<span style="color:var(--bad)"><b>rejected</b></span> <b>' + h(a.toValue) + '</b>';
    case 'final_folder': return 'shared the final files <b>Drive folder</b>';
    case 'comment': return 'commented';
    case 'updated': return 'updated ' + h(a.toValue);
    case 'reference_added': return 'added reference ' + h(a.toValue);
    case 'link_created': return 'created a review link';
    case 'link_revoked': return 'revoked review links';
    case 'reward': return 'gave a reward: ' + h(a.toValue);
    case 'final_link': return a.toValue === 'added' ? 'shared the final files link' : 'removed the final files link';
    case 'overdue': return '<span class="overdue-flag">became overdue</span>';
    case 'hold': return 'put this <b>on hold</b> — waiting on ' + h(a.toValue);
    case 'resume': return '<b>resumed</b> the task';
    case 'reopened': return '<b>reopened</b> the task for changes';
    case 'shared': return 'shared this task with a link';
    case 'shared_info': return '<b>sent details</b> through the shared link';
    case 'change_request': return '<b>asked for changes</b> on the finished request';
    default: return h(a.action);
  }
}

/* ================= DESIGNER DASHBOARD ================= */
var DESIGNER_TABS = [
  { id: 'all', label: 'All my tasks', f: function () { return true; } },
  { id: 'todo', label: 'To do', f: function (t) { return t.status === 'Assigned'; } },
  { id: 'progress', label: 'In progress', f: function (t) { return t.status === 'In Progress'; } },
  { id: 'awaiting', label: 'Awaiting approval', f: function (t) { return t.status === 'Submitted for Approval' || t.status === 'Resubmitted for Approval'; } },
  { id: 'revisions', label: 'Revisions required', f: function (t) { return t.status === 'Changes Requested'; } },
  { id: 'done', label: 'Completed', f: function (t) { return t.status === 'Completed' || t.status === 'Approved'; } }
];

function designerOverview(el, token, tab) {
  setCrumb('My dashboard');
  apiPre('api_designerDashboard').then(function (d) {
    if (stale(token)) return;
    var k = d.kpis, s = d.stats;
    navCount('tasks', k.changesRequested);
    el.innerHTML =
      '<div class="page-h"><div><h1>Hi ' + h(APP.boot.user.name.split(' ')[0]) + '</h1><p>Your tasks and deadlines.</p></div></div>' +
      '<div class="kpis">' +
      kpiCard('My active tasks', k.active, null, { color: 'var(--accent)' }) +
      kpiCard('Due today', k.dueToday, null, { alert: true, color: 'var(--warn)' }) +
      kpiCard('Due in next 7 days', k.upcoming, null, { color: 'var(--info)' }) +
      kpiCard('Awaiting my submission', k.awaitingSubmission, null, { color: '#5b3f8f' }) +
      kpiCard('Changes requested', k.changesRequested, null, { alert: true, color: 'var(--bad)' }) +
      kpiCard('Approved this month', k.approvedThisMonth, null, { color: 'var(--ok)' }) +
      '</div>' +
      '<div class="card" style="margin-top:14px"><div class="card-b row wrap" style="gap:24px;font-size:13px">' +
      '<span><span class="faint">Completed (all time)</span> <b>' + s.completedTotal + '</b></span>' +
      '<span><span class="faint">Avg. completion</span> <b>' + (s.avgCompletionDays === null ? '—' : s.avgCompletionDays + ' days') + '</b></span>' +
      '<span><span class="faint">Approval rate</span> <b>' + (s.approvalRate === null ? '—' : s.approvalRate + '%') + '</b></span>' +
      '<span><span class="faint">Overdue now</span> <b' + (s.overdue ? ' class="overdue-flag"' : '') + '>' + s.overdue + '</b></span>' +
      '<a href="#" data-go="rewards" class="reward-pill">' + icon('award') + ' <b>' + (s.points || 0) + '</b> points' + (s.pointsMonth ? ' · ' + s.pointsMonth + ' this month' : '') + '</a></div></div>' +
      '<div class="card" style="margin-top:14px"><div class="tabs" id="dtabs" style="padding:0 8px">' +
      DESIGNER_TABS.map(function (t) { return '<button data-tab="' + t.id + '">' + h(t.label) + '<span class="count">' + d.tasks.filter(t.f).length + '</span></button>'; }).join('') +
      '</div><div id="dlist"></div></div>';
    function show(id) {
      var tab = DESIGNER_TABS.filter(function (t) { return t.id === id; })[0] || DESIGNER_TABS[0];
      $all('#dtabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab.id); });
      var rows = d.tasks.filter(tab.f);
      $('#dlist').innerHTML = rows.length ? '<div class="cards-grid">' + rows.map(designerCard).join('') + '</div>' :
        emptyState(tab.id === 'all' ? 'No tasks assigned to you yet.' : 'Nothing here right now.', tab.id === 'all' ? 'Your team leader will assign work to you.' : '', 'tasks');
      wireGo($('#dlist'));
    }
    $all('#dtabs button').forEach(function (b) { b.onclick = function () { show(b.getAttribute('data-tab')); }; });
    show(tab === 'revisions' ? 'revisions' : (k.changesRequested ? 'revisions' : 'all'));
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
}

function designerCard(t) {
  return '<div class="tcard" data-go="task/' + h(t.taskId) + '">' +
    '<div class="row between"><span class="mono faint">' + h(t.taskId) + '</span>' + priorityBadge(t.priority) + '</div>' +
    '<div class="tc-title">' + h(t.title) + '</div>' + (Number(t.bonusPoints) ? '<span class="badge bonus-badge" style="align-self:flex-start">' + icon('award') + ' +' + h(t.bonusPoints) + ' bonus pts on completion</span>' : '') +
    '<div class="tc-meta">' + (t.campaign ? h(t.campaign) + ' · ' : '') + h(t.deliverablesApproved) + '/' + h(t.deliverablesRequired) + ' creatives approved</div>' +
    '<div class="row between"><span>' + statusBadge(t.status) + holdChip(t) + '</span><span class="small">Due ' + dueLabel(t) + '</span></div>' +
    '<div class="row"><div class="grow">' + progressBar(t.progress, t.status === 'Completed') + '</div><span class="faint small">' + h(t.progress) + '%</span></div></div>';
}

/* ================= REQUIREMENTS (leader) ================= */
function reqTabs(on) {
  return '<div class="tabs" style="margin-bottom:14px"><button data-go="requirements" class="' + (on === 'in' ? 'on' : '') + '">Incoming</button>' +
    '<button data-go="requirements/completed" class="' + (on === 'done' ? 'on' : '') + '">Completed</button></div>';
}

VIEWS.requirements = function (arg, el, token) {
  if (arg === 'completed') return completedRequests(el, token);
  setCrumb('Incoming requirements');
  api('api_listTasks', { status: 'unassigned' }).then(function (rows) {
    if (stale(token)) return;
    rows.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
    navCount('requirements', rows.filter(function (r) { return r.status === 'New Requirement'; }).length);
    var publicUrl = APP.boot.publicUrl;
    el.innerHTML = '<div class="page-h"><div><h1>Incoming requirements</h1><p>Everything raised through the request form that still needs a designer.</p></div>' +
      '<div class="row wrap">' + (publicUrl ? '<button class="btn" id="copyForm">' + icon('link') + ' Copy request-form link</button>' : '') + newReqButton(true) + '</div></div>' +
      reqTabs('in') + '<div class="card"><div class="table-wrap">' + (rows.length ? '<table class="t"><thead><tr><th>Requirement</th><th>Requested by</th><th>Type</th><th>Qty</th><th>Wanted by</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(function (t) {
        return '<tr class="click" data-go="task/' + h(t.taskId) + '"><td><div style="font-weight:500">' + h(t.title) + '</div><div class="faint small">' + h(t.requirementId) + ' · ' + h(t.taskId) + ' · ' + ago(t.createdAt) + '</div></td>' +
          '<td>' + h(t.requesterName) + '<div class="faint small">' + h(t.department) + '</div></td><td>' + h(t.creativeType) + '</td><td>' + h(t.deliverablesRequired) + '</td>' +
          '<td>' + dueLabel(t) + '</td><td>' + priorityBadge(t.priority) + '</td><td>' + statusBadge(t.status) + holdChip(t) + '</td>' +
          '<td><button class="btn sm primary" data-go="task/' + h(t.taskId) + '">Review & assign</button></td></tr>';
      }).join('') + '</tbody></table>' : emptyState('No requirements waiting.', 'New requests from the form will show up here.')) + '</div></div>';
    wireGo(el);
    if ($('#copyForm')) $('#copyForm').onclick = function () { copyText(publicUrl); };
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
};

var DONE_FILTER = { q: '', from: '', to: '' };

/** Finished requests: what was delivered, Drive folder link, zip download. */
function completedRequests(el, token) {
  setCrumb('Completed requirements');

/** Opens the request form as the signed-in leader (prefilled, in a new tab). */
/** Leader: give a designer a task directly — no request form needed. */
function directTaskModal(preset) {
  preset = preset || {};
  var team = [];
  Promise.all([api('api_listTeam'), api('api_listCampaigns')]).then(function (res) {
    var d = res[0], camps = res[1].filter(function (c) { return c.active || c.campaignId === preset.campaignId; });
    team = d.users.filter(function (u) { return u.active; });
    var addTo = '<div class="field"><label for="dtTo">Add to</label><select id="dtTo">' +
      (preset.requirementId ? '<option value="req:' + h(preset.requirementId) + '" selected>This request — ' + h(preset.requirementId + ' · ' + (preset.requirementTitle || '')) + '</option>' : '') +
      '<option value="">Its own new request</option>' +
      camps.map(function (c) { return '<option value="cmp:' + h(c.campaignId) + '"' + (c.campaignId === preset.campaignId && !preset.requirementId ? ' selected' : '') + '>Campaign: ' + h(c.name) + '</option>'; }).join('') +
      '</select><span class="hint">Everything in a campaign or request shares one Drive folder and one link.</span></div>';
    modal({
      title: 'Assign a task', wide: true,
      body: addTo + '<div class="field"><label class="req" for="dtT">What’s the task?</label><input type="text" id="dtT" maxlength="150" placeholder="e.g. Instagram story for Monday’s ghee launch"></div>' +
        '<div class="field"><label for="dtB">Details</label><textarea id="dtB" rows="3" maxlength="8000" placeholder="Sizes, copy, references…"></textarea></div>' +
        '<div class="grid-2"><div class="field"><label class="req" for="dtA">Designer</label><select id="dtA"><option value="">Choose…</option>' + team.map(function (u) {
          return '<option value="' + h(u.email) + '">' + h(u.name) + (u.designation ? ' · ' + h(u.designation) : '') + ' — ' + u.activeTasks + ' active</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="dtC">Category</label><input type="text" id="dtC" list="dtCL" maxlength="80" placeholder="e.g. Meta ads"><datalist id="dtCL">' +
          (APP.boot.categories || []).map(function (c) { return '<option value="' + h(c) + '">'; }).join('') + '</datalist></div></div>' +
        '<div id="dtFolder"></div>' +
        '<div class="grid-3"><div class="field"><label class="req" for="dtD">Due date</label><input type="date" id="dtD" min="' + todayIso() + '"></div>' +
        '<div class="field"><label for="dtTm">Time</label><input type="time" id="dtTm" step="900"></div>' +
        '<div class="field"><label for="dtQ">No. of creatives</label><input type="number" id="dtQ" min="1" max="50" value="1"></div></div>' +
        bonusField('dtBp', preset.bonusPoints || '') +
        '<div class="field"><label for="dtP">Priority</label><select id="dtP">' + APP.boot.priorities.map(function (p) { return '<option' + (p === 'Medium' ? ' selected' : '') + '>' + h(p) + '</option>'; }).join('') + '</select></div>' +
        '<div class="alert bad hidden" data-form-error></div>',
      actions: [{ label: 'Cancel' }, { label: 'Assign task', cls: 'primary', onClick: function (close, m) {
        var to = $('#dtTo', m).value;
        var fp = $('#dtF', m) ? $('#dtF', m).value.trim() : '';
        var input = { title: $('#dtT', m).value.trim(), brief: $('#dtB', m).value.trim(), assigneeEmail: $('#dtA', m).value, category: $('#dtC', m).value.trim(),
          dueDate: $('#dtD', m).value, dueTime: $('#dtTm', m).value, quantity: $('#dtQ', m).value, priority: $('#dtP', m).value, bonusPoints: $('#dtBp', m).value,
          requirementId: to.indexOf('req:') === 0 ? to.slice(4) : '', campaignId: to.indexOf('cmp:') === 0 ? to.slice(4) : '', folderPath: fp };
        if (!input.category && fp) input.category = fp.split('/').pop().trim();
        if (!input.title) return fieldErrors(m, 'Give the task a title.');
        if (!input.assigneeEmail) return fieldErrors(m, 'Choose a designer.');
        if (!input.dueDate) return fieldErrors(m, 'Pick a due date.');
        return api('api_createDirectTask', input).then(function (r) { close(); toast('Task ' + r.taskId + ' assigned'); loadNotifications(); go('task/' + r.taskId); })
          .catch(function (e) { fieldErrors(m, errMsg(e)); });
      } }]
    });
    function loadFolders() {
      var v = $('#dtTo').value, scope = v.indexOf(':') > 0 ? v.split(':')[1] : '';
      var keep = $('#dtF') ? $('#dtF').value : (preset.folderPath || '');
      api('api_folderOptions', scope).then(function (fo) {
        if (!$('#dtFolder')) return;
        $('#dtFolder').innerHTML = folderField('dtF', keep, fo.root, fo.options);
      }).catch(function () {});
    }
    $('#dtTo').onchange = loadFolders;
    loadFolders();
  }).catch(function (e) { toast(errMsg(e), true); });
}
