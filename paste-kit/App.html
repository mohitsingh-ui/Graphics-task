function copyText(text) {
  function fallback() {
    modal({ title: 'Copy link', body: '<input type="text" readonly value="' + h(text) + '" id="cpy">', actions: [{ label: 'Done' }] });
    setTimeout(function () { var i = $('#cpy'); if (i) { i.select(); } }, 50);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Link copied'); }, fallback);
  else fallback();
}

/* ================= TASKS ================= */
var TASK_UI = { view: 'table', sort: 'dueDate', dir: 1, filters: {} };

VIEWS.tasks = function (arg, el, token) {
  if (APP.role !== 'leader') return designerOverview(el, token);
  setCrumb('Tasks');
  // Deep links like tasks/status=Completed
  if (arg && arg.indexOf('status=') === 0) TASK_UI.filters = { status: decodeURIComponent(arg.slice(7)) };
  else if (!arg) TASK_UI.filters = TASK_UI.filters || {};
  el.innerHTML = '<div class="page-h"><div><h1>Task board</h1><p>Every graphics task, filter by status, priority, campaign or deadline.</p></div>' +
    '<div class="row wrap">' + (APP.role === 'leader' ? '<button class="btn primary" data-assign-new>' + icon('plus') + ' Assign a task</button>' : '') +
    '<div class="seg" id="viewSeg"><button data-v="table">' + icon('list') + ' Table</button><button data-v="board">' + icon('board') + ' Board</button></div></div></div>' +
    '<div class="card"><div class="filters" id="filters"></div><div id="taskOut"><div class="loading-page"><span class="spinner"></span></div></div></div>';
  $all('#viewSeg button').forEach(function (b) {
    b.innerHTML = b.innerHTML; b.classList.toggle('on', b.getAttribute('data-v') === TASK_UI.view);
    b.onclick = function () { TASK_UI.view = b.getAttribute('data-v'); $all('#viewSeg button').forEach(function (x) { x.classList.toggle('on', x === b); }); drawTasks(); };
  });
  Promise.all([api('api_listTasks', {}), api('api_listTeam')]).then(function (res) {
    if (stale(token)) return;
    TASK_UI.all = res[0];
    TASK_UI.team = res[1].users.filter(function (u) { return u.active; }).map(function (u) { return { email: u.email, name: u.name }; });
    var seen = {};
    TASK_UI.sel = {};
    TASK_UI.campaigns = res[0].reduce(function (a, t) { return a.concat([t.campaignName, t.campaign]); }, []).filter(function (c) { if (!c || seen[c]) return false; seen[c] = 1; return true; }).sort();
    drawFilters();
    drawTasks();
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
};

function drawFilters() {
  var f = TASK_UI.filters;
  var statuses = [['', 'All statuses'], ['open', 'All open'], ['unassigned', 'Unassigned'], ['overdue', 'Overdue']].concat(APP.boot.statuses.map(function (s) { return [s, s]; }));
  $('#filters').innerHTML =
    '<input type="search" id="fq" placeholder="Search title, ID, campaign, requester…" value="' + h(f.q || '') + '">' +
    sel('fs', statuses, f.status) +
    sel('fp', [['', 'Any priority']].concat(APP.boot.priorities.map(function (p) { return [p, p]; })), f.priority) +
    sel('fa', [['', 'Any designer'], ['__none', 'Unassigned']].concat((TASK_UI.team || []).map(function (u) { return [u.email, u.name]; })), f.assignee) +
    sel('fc', [['', 'Any campaign'], ['__none', 'Not in a campaign']].concat((TASK_UI.campaigns || []).map(function (c) { return [c, c]; })), f.campaign) +
    '<label class="small faint">Due</label><input type="date" id="fdf" value="' + h(f.dueFrom || '') + '"><span class="faint">–</span><input type="date" id="fdt" value="' + h(f.dueTo || '') + '">' +
    '<button class="btn ghost sm" id="fclear">Clear</button>';
  function sel(id, opts, val) {
    return '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + h(o[0]) + '"' + (o[0] === (val || '') ? ' selected' : '') + '>' + h(o[1]) + '</option>'; }).join('') + '</select>';
  }
  var update = function () {
    TASK_UI.filters = { q: $('#fq').value, status: $('#fs').value, priority: $('#fp').value, assignee: $('#fa').value, campaign: $('#fc').value, dueFrom: $('#fdf').value, dueTo: $('#fdt').value };
    drawTasks();
  };
  ['fs', 'fp', 'fa', 'fc', 'fdf', 'fdt'].forEach(function (id) { $('#' + id).onchange = update; });
  var timer; $('#fq').oninput = function () { clearTimeout(timer); timer = setTimeout(update, 200); };
  $('#fclear').onclick = function () { TASK_UI.filters = {}; drawFilters(); drawTasks(); };
}

function filterTasks(rows) {
  var f = TASK_UI.filters, q = String(f.q || '').toLowerCase().trim(), today = todayIso();
  var CLOSED = ['Completed', 'Cancelled'], PRE = ['New Requirement', 'Under Review', 'Ready for Assignment'];
  return rows.filter(function (t) {
    if (f.status === 'open' && CLOSED.indexOf(t.status) !== -1) return false;
    if (f.status === 'unassigned' && PRE.indexOf(t.status) === -1) return false;
    if (f.status === 'overdue' && !t.overdue) return false;
    if (f.status && ['open', 'unassigned', 'overdue'].indexOf(f.status) === -1 && t.status !== f.status) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (f.assignee === '__none' && t.assigneeEmail) return false;
    if (f.assignee && f.assignee !== '__none' && t.assigneeEmail !== f.assignee) return false;
    if (f.campaign === '__none' && t.campaignId) return false;
    if (f.campaign && f.campaign !== '__none' && t.campaign !== f.campaign && t.campaignName !== f.campaign) return false;
    if (f.dueFrom && (!t.dueDate || t.dueDate < f.dueFrom)) return false;
    if (f.dueTo && (!t.dueDate || t.dueDate > f.dueTo)) return false;
    if (q && [t.taskId, t.requirementId, t.title, t.campaign, t.campaignName, t.product, t.requesterName, t.department, t.assigneeName].join(' ').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

var PRIORITY_RANK = { Urgent: 0, High: 1, Medium: 2, Low: 3 };

function drawTasks() {
  var rows = filterTasks(TASK_UI.all || []);
  var out = $('#taskOut');
  if (!out) return;
  if (TASK_UI.view === 'board') {
    var cols = [
      ['Incoming', ['New Requirement', 'Under Review', 'Ready for Assignment']],
      ['Assigned', ['Assigned']], ['In progress', ['In Progress']],
      ['In review', ['Submitted for Approval', 'Resubmitted for Approval']], ['Changes requested', ['Changes Requested']],
      ['Done', ['Approved', 'Completed']], ['On hold / cancelled', ['On Hold', 'Cancelled']]
    ];
    out.innerHTML = '<div class="board" style="padding:14px">' + cols.map(function (c) {
      var list = rows.filter(function (t) { return c[1].indexOf(t.status) !== -1; });
      return '<div class="col"><div class="col-h"><span>' + h(c[0]) + '</span><span>' + list.length + '</span></div>' +
        list.map(function (t) {
          return '<div class="tcard" data-go="task/' + h(t.taskId) + '"><div class="row between"><span class="mono faint">' + h(t.taskId) + '</span>' + priorityBadge(t.priority) + '</div>' +
            '<div class="tc-title">' + h(t.title) + '</div><div class="tc-meta">' + (t.assigneeName ? h(t.assigneeName) : '<i>Unassigned</i>') + ' · due ' + dueLabel(t) + '</div>' +
            (c[1].length > 1 ? statusBadge(t.status) : '') + '</div>';
        }).join('') + '</div>';
    }).join('') + '</div>';
  } else {
    var key = TASK_UI.sort, dir = TASK_UI.dir;
    rows.sort(function (a, b) {
      var x = a[key], y = b[key];
      if (key === 'priority') { x = PRIORITY_RANK[x]; y = PRIORITY_RANK[y]; }
      if (key === 'dueDate') { x = x ? x + (a.dueTime || '99') : ''; y = y ? y + (b.dueTime || '99') : ''; }
      if (key === 'progress') { x = Number(x); y = Number(y); }
      if (x === y) return 0;
      if (x === '' || x === undefined) return 1; if (y === '' || y === undefined) return -1;
      return (x > y ? 1 : -1) * dir;
    });
    var th = function (k, label) { return '<th class="sortable" data-sort="' + k + '">' + h(label) + (key === k ? (dir > 0 ? ' ↑' : ' ↓') : '') + '</th>'; };
    var picked = TASK_UI.sel || (TASK_UI.sel = {});
    var nPick = rows.filter(function (t) { return picked[t.taskId]; }).length;
    out.innerHTML = rows.length ? '<div class="bulkbar" id="taskBulk"><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="tkAll"' + (nPick && nPick === rows.length ? ' checked' : '') + '>' +
      '<span class="small" id="tkCount">' + (nPick ? '<b>' + nPick + '</b> selected' : 'Tick tasks to put them into a campaign') + '</span></label>' +
      '<button class="btn sm primary" id="tkCamp"' + (nPick ? '' : ' disabled') + '>' + icon('board') + ' Add to campaign</button></div>' +
      '<div class="table-wrap"><table class="t"><thead><tr><th style="width:34px"></th>' + th('taskId', 'Task') + th('title', 'Title') + th('assigneeName', 'Designer') +
      th('priority', 'Priority') + th('dueDate', 'Due') + th('status', 'Status') + th('progress', 'Progress') + '<th>Creatives</th></tr></thead><tbody>' +
      rows.map(function (t) {
        return '<tr class="click" data-go="task/' + h(t.taskId) + '"><td data-nogo><input type="checkbox" class="tk-pick" data-tk="' + h(t.taskId) + '"' + (picked[t.taskId] ? ' checked' : '') + ' aria-label="Select ' + h(t.taskId) + '"></td>' +
          '<td class="mono">' + h(t.taskId) + '</td><td><div style="font-weight:500">' + h(t.title) + '</div><div class="faint small">' +
          h([t.campaign !== t.campaignName ? t.campaign : '', t.department].filter(Boolean).join(' · ')) +
          (t.campaignName ? ' <span class="cat-chip" style="font-size:11px;padding:1px 7px">' + icon('board') + ' ' + h(t.campaignName) + '</span>' : '') + '</div></td><td>' + (t.assigneeName ? h(t.assigneeName) : '<span class="faint">—</span>') + '</td>' +
          '<td>' + priorityBadge(t.priority) + '</td><td>' + dueLabel(t) + '</td><td>' + statusBadge(t.status) + holdChip(t) + '</td>' +
          '<td><div class="row">' + progressBar(t.progress, t.status === 'Completed') + '<span class="faint small">' + h(t.progress) + '%</span></div></td>' +
          '<td>' + h(t.deliverablesApproved) + '/' + h(t.deliverablesRequired) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : emptyState('No tasks match these filters.', 'Try clearing a filter.', 'tasks');
    $all('th[data-sort]', out).forEach(function (x) {
      x.onclick = function () { var k = x.getAttribute('data-sort'); if (TASK_UI.sort === k) TASK_UI.dir *= -1; else { TASK_UI.sort = k; TASK_UI.dir = 1; } drawTasks(); };
    });
    var syncBar = function () {
      var n = rows.filter(function (t) { return picked[t.taskId]; }).length;
      $('#tkCount').innerHTML = n ? '<b>' + n + '</b> selected' : 'Tick tasks to put them into a campaign';
      $('#tkCamp').disabled = !n; $('#tkAll').checked = n > 0 && n === rows.length;
    };
    $all('td[data-nogo]', out).forEach(function (td) { td.onclick = function (e) { e.stopPropagation(); }; });
    $all('.tk-pick', out).forEach(function (c) {
      c.onclick = function (e) { e.stopPropagation(); };
      c.onchange = function () { if (c.checked) picked[c.getAttribute('data-tk')] = 1; else delete picked[c.getAttribute('data-tk')]; syncBar(); };
    });
    if ($('#tkAll')) {
      $('#tkAll').onchange = function () {
        var on = this.checked;
        rows.forEach(function (t) { if (on) picked[t.taskId] = 1; else delete picked[t.taskId]; });
        $all('.tk-pick', out).forEach(function (c) { c.checked = on; }); syncBar();
      };
      $('#tkCamp').onclick = function () {
        var ids = rows.filter(function (t) { return picked[t.taskId]; }).map(function (t) { return t.taskId; });
        campaignPickModal(ids, function () { TASK_UI.sel = {}; render(APP.route, true); });
      };
    }
  }
  wireGo(out);
}

        return '<div class="ver" data-req="' + h(r.requestId) + '">' +
          (scope === 'open' && rows.length ? '<input type="checkbox" class="pick" data-pick="' + h(r.versionId) + '" aria-label="Select ' + h(r.deliverableTitle) + '">' : '') +
          '<div class="thumb" data-thumb="' + h(r.versionId) + '" data-name="' + h(r.deliverableTitle + ' · V' + r.versionNo) + '" data-sub="' + h(r.taskId + ' · ' + r.taskTitle + ' · by ' + r.uploadedByName) + '"' +
            ' data-status="' + h(r.status === 'Open' ? 'Awaiting approval' : r.decision ? (r.decision.decision === 'approved' ? 'Approved' : 'Changes requested') : '') + '">' + ext(r.fileName) + '</div>' +
          '<div class="grow"><div class="row wrap"><b>' + h(r.deliverableTitle) + '</b><span class="badge plain">V' + h(r.versionNo) + '</span>' +
          (r.status === 'Open' ? statusBadge('Awaiting Approval') : dec ? statusBadge(dec.decision === 'approved' ? 'Approved' : dec.decision === 'rejected' ? 'Rejected' : 'Changes Requested') : statusBadge(r.status)) + '</div>' +
          '<div class="faint small"><a href="#" data-go="task/' + h(r.taskId) + '">' + h(r.taskId) + '</a> · ' + h(r.taskTitle) + ' · by <b>' + h(r.uploadedByName) + '</b> · sent ' + fmtDateTime(r.createdAt) + '</div>' +
          (dec ? '<div class="feedback ' + (dec.decision === 'approved' ? 'approved' : 'changes') + '">' + (dec.decision === 'rejected' ? '<b>Rejected</b> · ' : '') + (dec.reviewerName ? h(dec.reviewerName) + (dec.reviewerEmail ? ' (' + h(dec.reviewerEmail) + ')' : '') : 'Anonymous reviewer') +
            ' · ' + fmtDateTime(dec.decidedAt) + (dec.channel === 'portal' ? ' · in portal' : '') + (dec.comment ? '<div class="pre">' + h(dec.comment) + '</div>' : '') + '</div>' : '') +
          '</div>' +
          (r.status === 'Open' ? '<div class="row wrap" style="flex:none"><button class="btn sm" data-link="' + h(r.versionId) + '">' + icon('link') + ' Link</button>' +
            '<button class="btn sm ghost" data-rej="' + h(r.versionId) + '">Reject</button><button class="btn sm danger" data-chg="' + h(r.versionId) + '">Changes</button><button class="btn sm ok" data-ok="' + h(r.versionId) + '">Approve</button></div>' : '') +
          '</div>';
      }).join('') : emptyState(scope === 'open' ? 'Nothing waiting for a decision.' : 'No decisions yet.', '', 'check')) + '</div>' +
      (scope === 'open' ? '<div id="sharedLinks"></div>' : '');
    wireGo(el);
    if ($('#sharedLinks')) loadSharedLinks($('#sharedLinks'));
    loadThumbs(el);
    $all('[data-ok]', el).forEach(function (b) { b.onclick = function () { leaderDecide(b.getAttribute('data-ok'), 'approved'); }; });
    $all('[data-chg]', el).forEach(function (b) { b.onclick = function () { leaderDecide(b.getAttribute('data-chg'), 'changes'); }; });
    $all('[data-rej]', el).forEach(function (b) { b.onclick = function () { leaderDecide(b.getAttribute('data-rej'), 'rejected'); }; });
    $all('[data-link]', el).forEach(function (b) { b.onclick = function () { newReviewLink(b.getAttribute('data-link')); }; });
    if ($('#selAll')) {
      var picks = $all('[data-pick]', el), sync = function () {
        var n = picks.filter(function (p) { return p.checked; }).length;
        $('#bulkOk').disabled = !n;
        $('#bulkOk').innerHTML = icon('check') + ' Approve selected' + (n ? ' (' + n + ')' : '');
        $('#shareSel').innerHTML = icon('link') + (n ? ' Share ' + n + ' for review' : ' Share all for review');
        $('#selAll').checked = n === picks.length; $('#selAll').indeterminate = n > 0 && n < picks.length;
      };
      picks.forEach(function (p) { p.onchange = sync; });
      $('#selAll').onchange = function () { var on = this.checked; picks.forEach(function (p) { p.checked = on; }); sync(); };
      $('#shareSel').onclick = function () {
        var sel = picks.filter(function (p) { return p.checked; });
        shareForReview((sel.length ? sel : picks).map(function (p) { return p.getAttribute('data-pick'); }));
      };
      sync();
      $('#bulkOk').onclick = function () {
        bulkApprove(picks.filter(function (p) { return p.checked; }).map(function (p) { return p.getAttribute('data-pick'); }));
      };
    }
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
};

function loadSharedLinks(box) {
  api('api_listBatchLinks').then(function (list) {
    var live = list.filter(function (b) { return !b.revoked && new Date(b.expiresAt) > new Date(); });
    if (!live.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="card" style="margin-top:18px"><div class="card-h"><h3>Shared review links</h3><span class="faint small">Active links people can open without login</span></div><div class="card-b tight">' +
      live.slice(0, 10).map(function (b) {
        return '<div class="list-item" style="cursor:default"><div class="li-main"><div class="li-title">' + h(b.title) + '</div><div class="li-sub">' + b.count + ' creative(s) · made ' + fmtDateTime(b.createdAt) +
          ' · ' + (b.lastOpenedAt ? 'opened ' + fmtDateTime(b.lastOpenedAt) : 'not opened yet') + ' · expires ' + fmtDate(b.expiresAt) + '</div></div>' +
          '<button class="btn sm ghost danger" data-unshare="' + h(b.batchId) + '">Withdraw</button></div>';
      }).join('') + '</div></div>';
    $all('[data-unshare]', box).forEach(function (btn) {
      btn.onclick = function () {
        confirmBox('Withdraw this link?', 'Anyone holding it will no longer be able to open it or approve from it.', 'Withdraw', true).then(function (y) {
          if (y) api('api_revokeBatchLink', btn.getAttribute('data-unshare')).then(function () { toast('Link withdrawn'); loadSharedLinks(box); }).catch(function (e) { toast(errMsg(e), true); });
        });
      };
    });
  }).catch(function () { box.innerHTML = ''; });
}

/** Leader: one no-login link (for the founder, a client…) to review these creatives, on phone or desktop. */
function shareForReview(versionIds, defaultTitle) {
  var n = versionIds.length;
  var m = modal({
    title: 'Share ' + n + ' creative' + (n > 1 ? 's' : '') + ' for review',
    body: '<p class="muted" style="margin-top:0">Anyone with the link can see these creatives and approve them or ask for changes — no login needed. Works on mobile.</p>' +
      '<div class="field"><label for="shT">Title they’ll see</label><input type="text" id="shT" maxlength="120" value="' + h(defaultTitle || '') + '" placeholder="e.g. Diwali sale — Meta creatives"></div>' +
      '<div id="shOut"></div><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Close' }, { label: 'Create link', cls: 'primary', onClick: function (close, el) {
      var b = $('.modal-f .btn.primary', el); if (b) b.disabled = true;
      return api('api_createBatchLink', versionIds, $('#shT', el).value.trim()).then(function (r) {
        if (b) b.classList.add('hidden');
        var msg = ($('#shT', el).value.trim() || 'Creatives for review') + ' — please review: ' + r.url;
        $('#shOut', el).innerHTML = '<div class="field"><label>Link (' + r.count + ' creative' + (r.count > 1 ? 's' : '') + ', valid ' + r.expiresInDays + ' days)</label>' +
          '<div class="row" style="gap:8px"><input type="text" readonly id="shUrl" value="' + h(r.url) + '"><button class="btn primary" id="shCopy">Copy</button></div></div>' +
          '<div class="row wrap" style="gap:8px"><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a>' +
          '<a class="btn" href="mailto:?subject=' + encodeURIComponent('Creatives for your review') + '&body=' + encodeURIComponent(msg) + '">Email</a></div>' +
          (r.skipped ? '<p class="faint small">' + r.skipped + ' creative(s) were left out because they’re no longer waiting.</p>' : '');
        $('#shCopy', el).onclick = function () { copyText(r.url); $('#shUrl', el).select(); };
      }).catch(function (e) { if (b) b.disabled = false; fieldErrors(el, errMsg(e)); });
    } }]
  });
  return m;
}

/** Leader: approve several creatives in one go (sent in batches of 25). */
function bulkApprove(versionIds, after) {
  var n = versionIds.length;
  modal({
    title: 'Approve ' + n + ' creative' + (n > 1 ? 's' : '') + '?',
    body: '<p class="muted">Each approval is recorded under your name, and open review links for these versions stop working. Designers get one notification per task.</p>' +
      '<div class="field"><label>Note for the designers (optional)</label><textarea id="bkc" rows="3" maxlength="4000" placeholder="e.g. Great set — all good to go"></textarea></div>' +
      '<div class="small faint" id="bkp"></div><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, { label: 'Approve all ' + n, cls: 'ok', onClick: function (close, m) {
      var c = $('#bkc', m).value.trim(), done = 0, skipped = [], i = 0;
      function next() {
        if (i >= versionIds.length) return Promise.resolve();
        var batch = versionIds.slice(i, i + 25); i += 25;
        $('#bkp', m).textContent = 'Approving… ' + done + ' of ' + n;
        return api('api_leaderApproveMany', batch, c).then(function (r) { done += r.approved; skipped = skipped.concat(r.skipped); return next(); });
      }
      return next().then(function () {
        close();
        toast('Approved ' + done + ' creative' + (done === 1 ? '' : 's') + (skipped.length ? ' · ' + skipped.length + ' skipped (already decided)' : ''));
        loadNotifications();
        if (after) after(); else render(APP.route);
      }).catch(function (e) { fieldErrors(m, errMsg(e) + (done ? ' (' + done + ' were approved)' : '')); });
    } }]
  });
}

/** Lazy-load small previews for [data-thumb] elements; click opens a larger one. */
var THUMB_MEMO = {};
function loadThumbs(root) {
  var nodes = $all('[data-thumb]', root), need = [];
  nodes.forEach(function (t) {
    var id = t.getAttribute('data-thumb'), kind = t.getAttribute('data-kind') || 'version', key = kind + ':' + id;
    t.onclick = function () { openGallery(root, t); };
    if (THUMB_MEMO[key] !== undefined) { if (THUMB_MEMO[key]) t.innerHTML = '<img src="' + h(THUMB_MEMO[key]) + '" alt="">'; }
    else if (!need.some(function (n) { return n.kind + ':' + n.id === key; })) need.push({ kind: kind, id: id });
  });
  for (var i = 0; i < need.length; i += 24) {
    api('api_getThumbs', need.slice(i, i + 24)).then(function (map) {
      Object.keys(map).forEach(function (k) { THUMB_MEMO[k] = map[k]; });
      nodes.forEach(function (t) {
        var k = (t.getAttribute('data-kind') || 'version') + ':' + t.getAttribute('data-thumb');
        if (map[k] && document.body.contains(t)) t.innerHTML = '<img src="' + h(map[k]) + '" alt="">';
      });
    }).catch(function () { /* keep the extension labels */ });
  }
}

/**
 * Opens every preview on this screen as one gallery, starting at the one clicked.
 * Leaders get Approve / Request changes for creatives that are waiting.
 */
function openGallery(root, start) {
  var kind = start.getAttribute('data-kind') || 'version', seen = {};
  var nodes = $all('[data-thumb]', root).filter(function (n) {
    var id = n.getAttribute('data-thumb');
    if ((n.getAttribute('data-kind') || 'version') !== kind || seen[id]) return false;
    seen[id] = true; return true;
  });
  var leader = APP.role === 'leader';
  var items = nodes.map(function (n) {
    var id = n.getAttribute('data-thumb');
    var waiting = kind === 'version' && !!$('[data-ok="' + id + '"]', root);
    return {
      id: id, title: n.getAttribute('data-name') || '', sub: n.getAttribute('data-sub') || '',
      status: n.getAttribute('data-status') || (waiting ? 'Awaiting approval' : ''),
      canDecide: leader && waiting,
      load: function () { return api('api_getAsset', kind, id, 'preview'); },
      download: function () { return api('api_getAsset', kind, id, 'original'); }
    };
  });
  gallery(items, {
    start: Math.max(0, nodes.indexOf(start)),
    decide: function (it, decision, comment) { return api('api_leaderDecision', it.id, decision, comment); },
    onClose: function (changed) {
      if (!changed) return;
      loadNotifications();
      if (APP.route.indexOf('task/') === 0 && typeof reloadTask === 'function') reloadTask(); else render(APP.route);
    }
  });
}

function openAsset(kind, id, name) {
  var lb = lightbox('', (name || '') + ' (loading…)', '<button class="btn sm" data-dl>' + icon('download') + ' Download</button>');
  $('[data-dl]', lb).onclick = function () {
    api('api_getAsset', kind, id, 'original').then(function (f) { downloadBase64(f.fileName, f.mimeType, f.base64); }).catch(function (e) { toast(errMsg(e), true); });
  };
  api('api_getAsset', kind, id, 'preview').then(function (p) {
    if (!document.body.contains(lb)) return;
    $('.lb-bar .ellipsis', lb).textContent = name || '';
    if (p.dataUrl) $('img', lb).src = p.dataUrl;
    else $('.lb-stage', lb).innerHTML = '<div class="empty" style="color:#ddd">' + h(p.message || 'No preview available. Use Download.') + '</div>';
  }).catch(function (e) { toast(errMsg(e), true); lb.remove(); });
}

function leaderDecide(versionId, decision, after) {
  var approve = decision === 'approved', reject = decision === 'rejected';
  modal({
    title: approve ? 'Approve this creative?' : reject ? 'Reject this creative?' : 'Request changes',
    body: (approve ? '<p class="muted">The approval is recorded under your name. Any open review links for this version will stop working.</p>' : '') +
      (reject ? '<p class="muted">A rejected creative won’t be used and doesn’t count toward the task. The designer is told why; if the task still needs creatives, they upload a new one.</p>' : '') +
      '<div class="field"><label class="' + (approve ? '' : 'req') + '">' + (reject ? 'Why is it rejected?' : 'Feedback for the designer') + '</label><textarea id="ldc" rows="4" maxlength="4000"></textarea></div><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, {
      label: approve ? 'Approve' : reject ? 'Reject' : 'Send feedback', cls: approve ? 'ok' : 'danger solid', onClick: function (close, m) {
        var c = $('#ldc', m).value.trim();
        if (!approve && c.length < 5) return fieldErrors(m, reject ? 'Say why it’s rejected.' : 'Tell the designer what to change.');
        return api('api_leaderDecision', versionId, decision, c).then(function () {
          close(); toast(approve ? 'Approved' : reject ? 'Rejected' : 'Feedback sent'); if (after) after(); else render(APP.route); loadNotifications();
        }).catch(function (e) { fieldErrors(m, errMsg(e)); });
      }
    }]
  });
}

function newReviewLink(versionId) {
  api('api_createReviewLink', versionId).then(function (r) {
    modal({
      title: 'New review link', body: '<p class="muted">Share this with the person who should approve the creative. It works without login and expires in ' + h(r.expiresInDays) + ' days. Older links keep working until a decision is made or you revoke them.</p>' +
        '<input type="text" readonly id="rlink" value="' + h(r.url) + '">',
      actions: [{ label: 'Close' }, { label: 'Copy link', cls: 'primary', onClick: function (close) { copyText(r.url); close(); } }]
    });
    setTimeout(function () { var i = $('#rlink'); if (i) i.select(); }, 60);
  }).catch(function (e) { toast(errMsg(e), true); });
}
</script>

<script>
/* AppTask.js — task detail page and its actions (assign, edit, status, progress, upload, submit, compare). */

var TASK = null;

VIEWS.task = function (taskId, el, token) {
  setCrumb(taskId);
  api('api_getTask', taskId).then(function (d) {
    if (stale(token)) return;
    TASK = d;
    drawTask(el);
  }).catch(function (e) {
    if (stale(token)) return;
    if (e.code === 'NOT_FOUND') {
      el.innerHTML = '<div class="card" style="max-width:520px;margin:40px auto"><div class="card-b">' + emptyState('Task not found', 'It may not exist, or it isn’t assigned to you.', 'alert') +
        '<div style="text-align:center"><button class="btn" onclick="go(\'overview\')">Back to dashboard</button></div></div></div>';
    } else viewError(el, e);
  });
};

function reloadTask() { return api('api_getTask', TASK.task.taskId).then(function (d) { TASK = d; drawTask($('#view')); }); }

function drawTask(el) {
  var d = TASK, t = d.task, r = d.requirement, p = d.permissions, leader = APP.role === 'leader';
  var drafts = [];
  d.deliverables.forEach(function (dv) { dv.versions.forEach(function (v) { if (v.status === 'Draft') drafts.push(v); }); });
  var approved = d.deliverables.filter(function (x) { return x.status === 'Approved'; }).length;
  setCrumb(t.taskId + ' · ' + t.title);

  var actions = '';
  if (p.canUpload) actions += '<button class="btn primary" id="aUpload">' + icon('upload') + ' Upload creative</button>';
  if (p.canUpload && drafts.length) actions += '<button class="btn ok" id="aSubmit">' + icon('send') + ' Submit for approval (' + drafts.length + ')</button>';
  if (p.canAssign) actions += '<button class="btn' + (t.assigneeEmail ? '' : ' primary') + '" id="aAssign">' + icon('users') + ' ' + (t.assigneeEmail ? 'Reassign' : 'Assign designer') + '</button>';
  if (p.canAssign && !d.deliverables.length && !(d.requestParts || []).length) actions += '<button class="btn" id="aDivide">' + icon('board') + ' Divide among team</button>';
  if (p.canEdit) actions += '<button class="btn" id="aEdit">Edit details</button>';
  if (p.canResume) actions += '<button class="btn primary" id="aResume">' + icon('refresh') + ' Resume task</button>';
  if (p.canHold) actions += '<button class="btn" id="aHold">' + icon('clock') + ' Put on hold</button>';
  if (p.canReopen) actions += '<button class="btn primary" id="aReopen">' + icon('refresh') + ' Reopen for changes</button>';
  if (p.canShare) actions += '<button class="btn" id="aShare">' + icon('link') + ' Share</button>';
  if (leader && (t.status === 'Completed' || t.status === 'Approved')) actions += '<button class="btn" id="aMore">' + icon('plus') + ' Add more creatives</button>';
  if (p.transitions.length || p.canOverrideComplete) actions += '<button class="btn" id="aStatus">Change status</button>';
  if (leader && t.assigneeEmail && t.assigneeEmail !== APP.boot.user.email) actions += '<button class="btn" id="aReward">' + icon('award') + ' Reward</button>';
  if (leader) actions += '<button class="btn ghost danger" id="aDelete" title="Delete task">' + icon('trash') + ' Delete</button>';

  var changes = [];
  d.deliverables.forEach(function (dv) {
    if (dv.status !== 'Changes Requested') return;
    var v = dv.versions.filter(function (x) { return x.decisions.some(function (y) { return y.decision === 'changes'; }); })[0];
    var dec = v && v.decisions.filter(function (y) { return y.decision === 'changes'; }).pop();
    if (dec) changes.push({ title: dv.title, v: v.versionNo, comment: dec.comment, at: dec.decidedAt });
  });

  el.innerHTML =
    '<div class="page-h"><div class="grow"><div class="row wrap" style="margin-bottom:6px"><span class="mono faint">' + h(t.taskId) + '</span>' + statusBadge(t.status) + priorityBadge(t.priority) +
    (t.overdue ? '<span class="badge s-changes-requested">Overdue</span>' : '') +
    (Number(t.bonusPoints) ? '<span class="badge bonus-badge" title="Extra points when this task is completed">' + icon('award') + ' +' + h(t.bonusPoints) + ' bonus pts</span>' : '') + '</div><h1>' + h(t.title) + '</h1>' +
    '<p>Due <b>' + dueLabel(t) + '</b> · ' + h(approved) + ' of ' + h(t.deliverablesRequired) + ' creative(s) approved' + (t.campaign ? ' · ' + h(t.campaign) : '') + '</p></div>' +
    '<div class="actionbar">' + actions + '</div></div>' +

    (changes.length ? '<div class="alert bad" style="margin-bottom:16px"><b>Changes requested</b>' + changes.map(function (c) {
      return '<div style="margin-top:6px"><b>' + h(c.title) + ' · V' + h(c.v) + '</b> <span class="small">(' + fmtDate(c.at) + ')</span><div class="pre">' + h(c.comment) + '</div></div>';
    }).join('') + '<div class="small" style="margin-top:8px">Upload a new version of each creative, then submit it for approval again.</div></div>' : '') +
    (t.hold ? '<div class="alert warn hold-banner" style="margin-bottom:16px"><b>On hold' + (t.hold.party !== 'internal' ? ' — waiting on ' + h(t.hold.dept || t.hold.partyLabel) : '') + '</b>' +
      '<span class="small"> · since ' + fmtDateTime(t.hold.since) + '</span><div class="pre" style="margin-top:4px">' + h(t.hold.reason) + '</div>' +
      '<div class="small" style="margin-top:6px">' + (t.hold.party !== 'internal' ? 'The deadline is paused and this time isn’t counted against the graphics team. ' : '') +
      'Files can still be viewed, uploaded and approved — once every creative is approved, the task completes automatically.</div></div>' :
      (t.status === 'On Hold' ? '<div class="alert warn" style="margin-bottom:16px">This task is on hold.</div>' : '')) +
    (leader && d.suggestedCampaign ? '<div class="alert info row between wrap" style="margin-bottom:16px;gap:10px"><span>The requester says this is for <b>' + h(d.suggestedCampaign) + '</b>. Put it in that campaign so all its creatives share one Drive folder?</span>' +
      '<button class="btn sm primary" id="mkCamp">' + icon('board') + ' Add to “' + h(d.suggestedCampaign) + '”</button></div>' : '') +
    (t.reopenedAt && t.status !== 'Completed' ? '<div class="alert info" style="margin-bottom:16px"><b>Reopened for changes</b> <span class="small">· ' + fmtDateTime(t.reopenedAt) +
      (t.reopenCount > 1 ? ' · reopened ' + t.reopenCount + ' times' : '') + '</span><div class="pre" style="margin-top:4px">' + h(t.reopenReason) + '</div>' +
      '<div class="small" style="margin-top:6px">The ★ Final approved files stay available until the new versions are approved.</div></div>' : '') +
    (t.status === 'Cancelled' ? '<div class="alert warn" style="margin-bottom:16px">This task was cancelled.</div>' : '') +

    '<div class="detail"><div class="stack">' +
    briefCard(d) + deliverablesCard(d) + activityTimeline(d) +
    '</div><div class="stack">' + requestCard(d) + finalFilesCard(d) + finalLinkCard(d) + sideCard(d) + (p.canProgress ? progressCard(t) : '') + (leader ? leaderSide(d) : '') + '</div></div>';

  wireGo(el);
  loadThumbs(el);
  if ($('#aUpload')) $('#aUpload').onclick = uploadModal;
  if ($('#aSubmit')) $('#aSubmit').onclick = function () { submitModal(drafts); };
  if ($('#aAssign')) $('#aAssign').onclick = assignModal;
  if ($('#aDivide')) $('#aDivide').onclick = divideModal;
  if ($('#aEdit')) $('#aEdit').onclick = editModal;
  if ($('#aResume')) $('#aResume').onclick = resumeModal;
  if ($('#aHold')) $('#aHold').onclick = holdModal;
  if ($('#aReopen')) $('#aReopen').onclick = reopenModal;
  if ($('#aShare')) $('#aShare').onclick = shareTaskModal;
  if ($('#aMore')) $('#aMore').onclick = function () { directTaskModal({ requirementId: t.requirementId, requirementTitle: r.title || t.title, campaignId: d.campaign ? d.campaign.campaignId : '', folderPath: t.folderPath || '' }); };
  if ($('#mkCamp')) $('#mkCamp').onclick = function () {
    this.disabled = true;
    api('api_campaignFromSuggestion', t.taskId).then(function (x) { toast('Added to campaign “' + x.name + '”'); reloadTask(); }).catch(function (e) { toast(errMsg(e), true); });
  };
  if ($('#zipTask')) $('#zipTask').onclick = function () { zipDownload(t.taskId, true, this); };
  if ($('#zipReq')) $('#zipReq').onclick = function () { zipDownload(t.requirementId, false, this); };
  if ($('#driveReq')) $('#driveReq').onclick = function () { driveFolderModal(t.requirementId); };
  if ($('#aStatus')) $('#aStatus').onclick = statusModal;
  if ($('#aReward')) $('#aReward').onclick = function () { rewardModal({ userEmail: t.assigneeEmail, taskId: t.taskId }, reloadTask); };
  if ($('#aDelete')) $('#aDelete').onclick = function () {
    confirmBox('Delete ' + t.taskId + ' permanently?',
      'The task, its creatives, versions, review links and history are removed. ' +
      (d.siblings ? '' : 'The request also disappears from the requester’s “My requests”. ') +
      'Files go to the Google Drive trash (recoverable for 30 days).', 'Delete task', true).then(function (y) {
      if (!y) return;
      api('api_deleteTask', t.taskId).then(function () { toast('Task deleted'); go('tasks'); }).catch(function (e) { toast(errMsg(e), true); });
    });
  };
  $all('[data-progress]', el).forEach(function (b) { b.onclick = function () { setProgress(Number(b.getAttribute('data-progress'))); }; });
  if ($('#cmtBtn')) $('#cmtBtn').onclick = addComment;
  if ($('#flSave')) $('#flSave').onclick = function () {
    var v = $('#flInput').value.trim(), b = this;
    if (v && !/^https:\/\/\S+$/i.test(v)) return toast('Paste a full link starting with https://', true);
    b.disabled = true;
    run(api('api_setFinalLink', t.taskId, v), v ? 'Final files link saved — the requester can download it now' : 'Link removed').then(function () { b.disabled = false; });
  };
  if ($('#notesSave')) $('#notesSave').onclick = function () { run(api('api_updateTask', t.taskId, { internalNotes: $('#notes').value }), 'Notes saved'); };
  if ($('#splitBtn')) $('#splitBtn').onclick = function () { directTaskModal({ requirementId: t.requirementId, requirementTitle: r.title || t.title, campaignId: d.campaign ? d.campaign.campaignId : '' }); };
  if ($('#campSel')) $('#campSel').onchange = function () {
    var v = this.value;
    if (v === '__new') {
      this.value = d.campaign ? d.campaign.campaignId : '';
      return campaignPickModalNew(t.taskId, reloadTask);
    }
    api('api_setRequestCampaign', t.requirementId, v).then(function () { toast(v ? 'Added to the campaign — its approved files moved to the campaign folder' : 'Removed from the campaign'); reloadTask(); })
      .catch(function (e) { toast(errMsg(e), true); reloadTask(); });
  };
  if ($('#refUpload')) $('#refUpload').onclick = function () { pickFiles(true, function (files) { uploadRefs(files); }); };
  $all('[data-cmp]', el).forEach(function (b) { b.onclick = function () { compareModal(b.getAttribute('data-cmp')); }; });
  $all('[data-ok]', el).forEach(function (b) { b.onclick = function () { leaderDecide(b.getAttribute('data-ok'), 'approved', reloadTask); }; });
  if ($('#shareAll')) $('#shareAll').onclick = function () { shareForReview(this.getAttribute('data-ids').split(','), t.title); };
  if ($('#approveAll')) $('#approveAll').onclick = function () { bulkApprove(this.getAttribute('data-ids').split(','), reloadTask); };
  $all('[data-chg]', el).forEach(function (b) { b.onclick = function () { leaderDecide(b.getAttribute('data-chg'), 'changes', reloadTask); }; });
  $all('[data-rej]', el).forEach(function (b) { b.onclick = function () { leaderDecide(b.getAttribute('data-rej'), 'rejected', reloadTask); }; });
  $all('[data-link]', el).forEach(function (b) { b.onclick = function () { newReviewLink(b.getAttribute('data-link')); }; });
  $all('[data-revoke]', el).forEach(function (b) {
    b.onclick = function () {
      confirmBox('Revoke review links?', 'Anyone holding a link for this version will no longer be able to open it or approve it.', 'Revoke', true).then(function (y) {
        if (y) run(api('api_revokeReviewLinks', b.getAttribute('data-revoke')), 'Links revoked');
      });
    };
  });
  $all('[data-revise]', el).forEach(function (b) { b.onclick = function () { uploadModal(b.getAttribute('data-revise')); }; });
}

/** Run an action promise, toast, reload the task. */
function run(promise, msg) {
  return promise.then(function () { toast(msg); loadNotifications(); return reloadTask(); }).catch(function (e) { toast(errMsg(e), true); });
}

              (leader ? ' by ' + h(x.reviewerName || 'anonymous reviewer') + (x.reviewerEmail ? ' (' + h(x.reviewerEmail) + ')' : '') + (x.channel === 'portal' ? ' in portal' : ' via review link') : '') +
              ' · ' + fmtDateTime(x.decidedAt) + (x.comment ? '<div class="pre">' + h(x.comment) + '</div>' : '') + '</div>';
          }).join('') +

            '<button class="btn sm ghost" data-rej="' + h(v.versionId) + '">Reject</button><button class="btn sm danger" data-chg="' + h(v.versionId) + '">Request changes</button><button class="btn sm ok" data-ok="' + h(v.versionId) + '">Approve</button></div>' : '') +

/** Whole-request progress when the request was divided between designers. */
function requestCard(d) {
  var ps = d.requestParts || [];
  if (ps.length < 2) return '';
  var req = 0, ok = 0;
  ps.forEach(function (p) { req += p.required; ok += p.approved; });
  var done = req && ok >= req;
  return '<div class="card"><div class="card-h"><h3>Whole request</h3>' + (APP.role === 'leader' ? '<button class="btn ghost sm" id="splitBtn">' + icon('plus') + ' Add task</button>' : '<span class="faint small">' + h(d.requirement.requirementId) + '</span>') + '</div><div class="card-b stack">' +
    '<div><div class="row between small"><span><b>' + ok + ' of ' + req + '</b> creatives approved</span><span class="faint">' + ps.length + ' designers</span></div>' +
    '<div style="margin-top:6px">' + progressBar(req ? ok / req * 100 : 0, done) + '</div></div>' +
    ps.map(function (p) {
      var inner = '<div class="li-main"><div class="li-title">' + h(p.assigneeName) + (p.mine ? ' <span class="faint small">(this is yours)</span>' : '') + '</div>' +
        '<div class="li-sub">' + p.approved + ' of ' + p.required + ' approved</div></div>' + statusBadge(p.status);
      return p.taskId && p.taskId !== d.task.taskId ? '<div class="list-item" data-go="task/' + h(p.taskId) + '">' + inner + '</div>' :
        '<div class="list-item" style="cursor:default' + (p.taskId === d.task.taskId ? ';background:var(--accent-soft);border-radius:8px' : '') + '">' + inner + '</div>';
    }).join('') + '</div></div>';
}

    $('.modal-b', m.el).innerHTML =

        '<b>' + r.total + '</b> approved creative(s)' + (r.kind === 'campaign' ? '' : ' for ' + h(r.requirementId)) + ', in these folders:</p>' +
      '<div class="row wrap" style="gap:6px;margin-bottom:12px">' + r.categories.map(function (c) { return '<span class="badge plain">' + icon('file') + ' ' + h(c.name) + ' · ' + c.count + '</span>'; }).join('') + '</div>' +
      (r.shared ? '<div class="alert ok" style="margin-bottom:10px">Anyone with the link can open and download — no login. New approvals are added automatically.</div>' +
        '<div class="field"><div class="row" style="gap:8px"><input type="text" readonly id="dfUrl" value="' + h(r.url) + '"><button class="btn primary" id="dfCopy">Copy</button></div></div>' +
        '<div class="row wrap" style="gap:8px"><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a>' +
        '<a class="btn" href="mailto:?subject=' + encodeURIComponent('Approved creatives — ' + (r.title || r.requirementId)) + '&body=' + encodeURIComponent(msg) + '">Email</a>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + h(r.url) + '">Open in Drive</a><button class="btn ghost danger" id="dfStop">Stop sharing</button></div>'
        : '<p class="small">The folder is private for now. Make a link anyone can open (no login)?</p><button class="btn primary" id="dfShare">' + icon('link') + ' Create public link</button>') +
      '<div class="alert bad hidden" data-form-error></div>';
    if ($('#dfCopy', m.el)) $('#dfCopy', m.el).onclick = function () { copyText(r.url); $('#dfUrl', m.el).select(); };

  load(false);
}

/** Optional bonus the designer earns when the task is completed. */

    '<span class="hint">For big or time-taking work. Added to the designer’s points when the task is completed.</span></div>';
}

      '<div class="field"><label class="req">Designer</label><select id="asg">' + '<option value="">Choose…</option>' + team.map(function (u) {

      '<div class="alert bad hidden" data-form-error></div>',

      label: t.assigneeEmail ? 'Reassign' : 'Assign task', cls: 'primary', onClick: function (close, m) {

        if (!input.assigneeEmail || !input.dueDate) return fieldErrors(m, 'Pick a designer and a due date.');
        return api('api_assignTask', t.taskId, input).then(function () { close(); toast('Assigned'); reloadTask(); }).catch(function (e) { fieldErrors(m, errMsg(e)); });

/** Split this task's creatives between several designers. */
function divideModal() {
  var t = TASK.task;
  var team = TASK.team.slice().sort(function (a, b) { return (a.role === 'designer' ? 0 : 1) - (b.role === 'designer' ? 0 : 1) || a.activeTasks - b.activeTasks; });
  var total = Math.max(2, Number(t.deliverablesRequired) || 2);
  var rows = [{ email: '', count: Math.ceil(total / 2) }, { email: '', count: Math.floor(total / 2) }];
  var thr = APP.boot.workloadThreshold;
  var m = modal({
    title: 'Divide among team', wide: true,
    body: '<p class="muted" style="margin:0">Give each designer their share of the <b>' + h(t.deliverablesRequired) + '</b> creative(s) — e.g. 20 Meta ads to one, 4 homepage banners to another. Each person gets their own task with the same brief; the category becomes their folder in the request’s Drive folder.</p>' +
      '<datalist id="dvCatL">' + (TASK.folderOptions || APP.boot.categories || []).map(function (c) { return '<option value="' + h(c) + '">'; }).join('') + '</datalist>' +
      '<p class="faint small" style="margin:0">Folders are inside <b>' + h(TASK.folderRoot || 'the request folder') + '</b> on Drive.</p>' +
      '<div id="dvRows" class="stack" style="gap:8px"></div>' +
      '<div class="row between"><button class="btn sm" id="dvAdd">' + icon('plus') + ' Add designer</button><span class="small" id="dvTotal"></span></div>' +
      '<div class="grid-3"><div class="field"><label class="req">Due date</label><input type="date" id="dvDate" value="' + h(t.dueDate) + '"></div>' +
      '<div class="field"><label>Due time</label><input type="time" id="dvTime" step="900" value="' + h(t.dueTime || '') + '"></div>' +
      '<div class="field"><label class="req">Priority</label><select id="dvPri">' + APP.boot.priorities.map(function (p) { return '<option' + (p === t.priority ? ' selected' : '') + '>' + h(p) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, {
      label: 'Divide & assign', cls: 'primary', onClick: function (close, el) {
        sync();
        var parts = rows.map(function (r) { var last = (r.category || '').split('/').pop().trim(); return { assigneeEmail: r.email, count: r.count, category: last, folderPath: r.category, bonusPoints: r.bonus }; });
        if (parts.some(function (p) { return !p.assigneeEmail || !(p.count >= 1); })) return fieldErrors(el, 'Pick a designer and at least 1 creative on every row.');
        var seen = {};
        if (parts.some(function (p) { if (seen[p.assigneeEmail]) return true; seen[p.assigneeEmail] = 1; return false; })) return fieldErrors(el, 'Each designer should appear only once.');
        if (!$('#dvDate', el).value) return fieldErrors(el, 'Pick a due date.');
        return api('api_divideTask', t.taskId, { parts: parts, dueDate: $('#dvDate', el).value, dueTime: $('#dvTime', el).value, priority: $('#dvPri', el).value })
          .then(function (r) { close(); toast('Divided into ' + r.taskIds.length + ' tasks and assigned'); loadNotifications(); reloadTask(); })
          .catch(function (e) { fieldErrors(el, errMsg(e)); });
      }
    }]
  });
  function draw() {
    $('#dvRows', m.el).innerHTML = rows.map(function (r, i) {
      return '<div class="row" data-i="' + i + '"><select class="grow" data-k="email"><option value="">Choose designer…</option>' + team.map(function (u) {
        return '<option value="' + h(u.email) + '"' + (u.email === r.email ? ' selected' : '') + '>' + h(u.name) + ' — ' + u.activeTasks + ' active' + (u.activeTasks >= thr ? ' ⚠ busy' : '') + '</option>';
      }).join('') + '</select><input type="text" data-k="category" list="dvCatL" placeholder="Folder, e.g. 20% off / Meta ads" value="' + h(r.category || '') + '" style="width:220px" aria-label="Save to folder">' +
        '<input type="number" min="1" max="50" data-k="count" value="' + h(r.count) + '" style="width:90px" aria-label="Creatives">' +
        '<input type="number" min="0" max="1000" step="5" data-k="bonus" value="' + h(r.bonus || '') + '" placeholder="Bonus" title="Bonus points on completion (optional)" style="width:84px" aria-label="Bonus points">' +
        '<span class="faint small" style="width:60px">creative(s)</span>' +
        (rows.length > 2 ? '<button class="btn ghost icon" data-rm="' + i + '" aria-label="Remove">' + icon('x') + '</button>' : '<span style="width:36px"></span>') + '</div>';
    }).join('');
    $all('[data-k]', m.el).forEach(function (inp) { inp.oninput = inp.onchange = function () { sync(); total_(); }; });
    $all('[data-rm]', m.el).forEach(function (b) { b.onclick = function () { sync(); rows.splice(Number(b.getAttribute('data-rm')), 1); draw(); }; });
    total_();
  }
  function sync() {
    $all('#dvRows [data-i]', m.el).forEach(function (row) {
      var r = rows[Number(row.getAttribute('data-i'))];
      r.email = $('[data-k="email"]', row).value; r.count = Number($('[data-k="count"]', row).value); r.category = $('[data-k="category"]', row).value.trim(); r.bonus = $('[data-k="bonus"]', row).value;
    });
  }
  function total_() {
    var sum = rows.reduce(function (s, r) { return s + (Number(r.count) || 0); }, 0), need = Number(t.deliverablesRequired) || 0;
    $('#dvTotal', m.el).innerHTML = 'Total <b>' + sum + '</b> of ' + need + ' creative(s)' + (sum !== need ? ' <span style="color:var(--warn)">— doesn’t match the request</span>' : ' ✓');
  }
  $('#dvAdd', m.el).onclick = function () { sync(); if (rows.length < 10) { rows.push({ email: '', count: 1 }); draw(); } };
  draw();
}

function statusModal() {
  var t = TASK.task, p = TASK.permissions;
  var opts = p.transitions.filter(function (x) { return x !== 'On Hold'; });   // hold has its own button (needs a reason)
  var canForce = p.canOverrideComplete && opts.indexOf('Completed') === -1;
  modal({
    title: 'Change status',
    body: '<p class="muted">Current status: ' + statusBadge(t.status) + '</p>' +
      '<div class="field"><label class="req">Move to</label><select id="sto"><option value="">Choose…</option>' + opts.map(function (s) { return '<option>' + h(s) + '</option>'; }).join('') +
      (canForce ? '<option value="__force">Completed (override — not all creatives approved)</option>' : '') + '</select></div>' +
      '<div class="field"><label id="streasonL">Reason</label><textarea id="streason" rows="2" maxlength="1000"></textarea><span class="hint">Recorded in the task history. Required for an override.</span></div>' +
      '<p class="faint small">Approval statuses (Submitted, Changes Requested, Approved) are set automatically by the review workflow.</p><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, {
      label: 'Update status', cls: 'primary', onClick: function (close, m) {
        var to = $('#sto', m).value, reason = $('#streason', m).value.trim();
        if (!to) return fieldErrors(m, 'Choose a status.');
        var force = to === '__force';
        if (force && !reason) return fieldErrors(m, 'Add a reason for completing without full approval.');
        return api('api_setTaskStatus', t.taskId, force ? 'Completed' : to, { override: force, reason: reason })
          .then(function () { close(); toast('Status updated'); reloadTask(); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
      }
    }]
  });
}

/* ---------- hold / resume / reopen / share ---------- */

function holdModal() {
  var t = TASK.task, r = TASK.requirement, depts = (APP.boot.departments || []);
  modal({
    title: 'Put on hold',
    body: '<div class="field"><label class="req" for="hdR">Why is it on hold?</label><textarea id="hdR" rows="3" maxlength="1000" placeholder="e.g. Design done. Waiting for NI table and barcode."></textarea></div>' +
      '<div class="field"><label class="req">Waiting on</label><div class="seg-choice">' +
      '<label><input type="radio" name="hdP" value="other" checked><span><b>Another department</b><small>Not counted against us</small></span></label>' +
      '<label><input type="radio" name="hdP" value="requester"><span><b>The requester</b><small>' + h(r.requesterName || 'who raised it') + ' · not counted against us</small></span></label>' +
      '<label><input type="radio" name="hdP" value="internal"><span><b>Our team</b><small>Internal hold</small></span></label></div></div>' +
      '<div class="field" id="hdDeptF"><label for="hdD">Which department?</label><input type="text" id="hdD" list="hdDL" maxlength="100" placeholder="e.g. Quality" value="' + h(r.department || '') + '">' +
      '<datalist id="hdDL">' + depts.map(function (d) { return '<option value="' + h(d) + '">'; }).join('') + '</datalist></div>' +
      (r.email ? '<label class="check" id="hdNF"><input type="checkbox" id="hdN" checked> Email ' + h(r.requesterName || 'the requester') + ' what we need</label>' : '') +
      '<p class="faint small">While on hold the deadline is paused. Files stay visible and downloadable; uploads and approvals continue. When every creative is approved, the task completes.</p>' +
      '<div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, { label: 'Put on hold', cls: 'primary', onClick: function (close, m) {
      var party = $('input[name=hdP]:checked', m).value, reason = $('#hdR', m).value.trim();
      if (reason.length < 4) return fieldErrors(m, 'Say why it’s on hold.');
      return api('api_holdTask', t.taskId, { reason: reason, party: party, dept: party === 'internal' ? '' : $('#hdD', m).value.trim(), notifyRequester: $('#hdN', m) ? $('#hdN', m).checked : false })

          '<div class="row wrap" style="gap:8px"><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a>' +

        $('#shCopy', el).onclick = function () { copyText(r.url); $('#shUrl', el).select(); };
        listShares();
      }).catch(function (e) { if (b) b.disabled = false; fieldErrors(el, errMsg(e)); });

  });
  function listShares() {

      var box = $('#shList', m.el); if (!box) return;
      box.innerHTML = list.length ? '<div class="section-title" style="margin-top:14px">Active links</div>' + list.map(function (x) {
        return '<div class="row between small" style="padding:6px 0;border-top:1px solid var(--line)"><span>' + h(x.note || 'Link') + ' · made ' + fmtDate(x.createdAt) + ' · ' + (x.lastOpenedAt ? 'opened ' + fmtDateTime(x.lastOpenedAt) : 'not opened yet') + '</span>' +
          '<button class="btn sm ghost danger" data-unshare="' + h(x.shareId) + '">Withdraw</button></div>';
      }).join('') : '';
      $all('[data-unshare]', box).forEach(function (b) { b.onclick = function () { api('api_revokeTaskShare', b.getAttribute('data-unshare')).then(function () { toast('Link withdrawn'); listShares(); }).catch(function (e) { toast(errMsg(e), true); }); }; });
    }).catch(function () {});
  }
  listShares();
}

function splitModal() {
  var t = TASK.task;
  modal({
    title: 'Add another task for ' + t.requirementId,
    body: '<p class="muted">Creates a new task from the same requirement, ready to assign.</p>' +
      '<div class="field"><label class="req">Title</label><input type="text" id="sp_t" maxlength="150" value="' + h(t.title) + ' (part 2)"></div>' +
      '<div class="grid-2"><div class="field"><label class="req">Creatives required</label><input type="number" id="sp_q" min="1" max="50" value="1"></div>' +
      '<div class="field"><label>Dimensions</label><input type="text" id="sp_d" value="' + h(t.dimensions) + '"></div></div>' +
      '<div class="field"><label>Brief (leave empty to copy the original)</label><textarea id="sp_b" rows="3"></textarea></div><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, {
      label: 'Create task', cls: 'primary', onClick: function (close, m) {
        return api('api_createTaskFromRequirement', t.requirementId, { title: $('#sp_t', m).value, deliverablesRequired: $('#sp_q', m).value, dimensions: $('#sp_d', m).value, brief: $('#sp_b', m).value })
          .then(function (r) { close(); toast('Task ' + r.taskId + ' created'); go('task/' + r.taskId); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
      }
    }]
  });
}

/* ---------- uploads ---------- */

function pickFiles(multiple, cb) {
  var i = document.createElement('input'); i.type = 'file'; i.multiple = !!multiple;
  i.onchange = function () { cb(Array.prototype.slice.call(i.files)); };
  i.click();
}

function checkFile(f) {
  var e = ext(f.name).toLowerCase();
  if (APP.boot.extensions.indexOf(e) === -1) return f.name + ': .' + e + ' files aren’t allowed.';
  if (f.size > APP.boot.maxUploadMB * 1048576) return f.name + ' is larger than ' + APP.boot.maxUploadMB + ' MB.';
  if (!f.size) return f.name + ' is empty.';
  return '';
}

function uploadRefs(files) {
  var bad = files.map(checkFile).filter(Boolean);
  if (bad.length) return toast(bad[0], true);
  toast('Uploading ' + files.length + ' file(s)…');
  var errs = [];
  var all = runPool(files, 3, function (f) {
    return uploadFile(f, { kind: 'taskref', taskId: TASK.task.taskId }).catch(function (e) { errs.push(e); throw e; });
  }).then(function () { if (errs.length) throw errs[0]; });
  run(all, 'Reference files added');
}

/** Upload modal. If deliverableId is given, it uploads a new version of that creative. */
function uploadModal(deliverableId) {
  var t = TASK.task;
  var dels = TASK.deliverables;
  var files = [];
  var pre = typeof deliverableId === 'string' ? deliverableId : '';
  if (!pre) { var needs = dels.filter(function (x) { return x.status === 'Changes Requested'; })[0]; if (needs) pre = needs.deliverableId; }
  var m = modal({
    title: 'Upload creative', wide: false, sticky: true,
    body:
      '<div class="grid-2"><div class="field"><label>Task</label><input type="text" readonly value="' + h(t.taskId) + '"></div>' +
      '<div class="field"><label>This upload is</label><select id="u_target"><option value="">A new creative</option>' + dels.map(function (x) {
        return '<option value="' + h(x.deliverableId) + '"' + (x.deliverableId === pre ? ' selected' : '') + '>New version of: ' + h(x.title) + ' (now V' + h(x.latestVersionNo) + ')</option>';
      }).join('') + '</select></div></div>' +
      '<div id="u_new" class="stack">' +
      '<div class="field"><label class="req">Creative title</label><input type="text" id="u_title" maxlength="150" placeholder="e.g. Homepage banner — desktop"></div>' +
      '<div class="field"><label>What the creative is for <span class="faint">(optional)</span></label><input type="text" id="u_purpose" maxlength="500" value="' + h(t.purpose ? t.purpose.slice(0, 500) : '') + '"></div>' +
      '<div class="field"><label>Category <span class="faint">(Drive folder)</span></label><input type="text" id="u_type" maxlength="80" list="u_typeL" value="' + h(t.creativeType) + '" placeholder="e.g. Meta ads">' +
        '<datalist id="u_typeL">' + (APP.boot.categories || []).map(function (c) { return '<option value="' + h(c) + '">'; }).join('') + '</datalist></div></div>' +
      '<div class="field"><label>Version</label><input type="text" id="u_ver" readonly></div>' +
      '<div class="field"><label class="req">File(s)</label><div class="drop" id="u_drop" tabindex="0" role="button">' + icon('upload') + '<div><b>Drop files</b> or click to choose</div>' +
      '<div class="faint small">Max ' + h(APP.boot.maxUploadMB) + ' MB · ' + h(APP.boot.extensions.join(', ')) + '</div></div><div id="u_files" class="stack" style="gap:6px;margin-top:8px"></div>' +
      '<span class="hint" id="u_multi">Several files = several creatives, numbered automatically.</span></div>' +
      '<div class="field"><label>Submission note</label><textarea id="u_note" rows="2" maxlength="1000" placeholder="Optional — what changed, anything the reviewer should know"></textarea></div>' +
      '<div class="field"><label>Google Drive link to final files <span class="faint">(optional)</span></label><input type="url" id="u_link" placeholder="https://drive.google.com/…" value="' + h(t.finalLink || '') + '">' +
      '<span class="hint">Share it as “Anyone with the link – Viewer”. The requester gets a download button.</span></div>' +
      '<label class="check"><input type="checkbox" id="u_submit" checked> Send for approval right after upload</label>' +
      '<div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, { label: 'Upload', cls: 'primary', onClick: function (close, el, btn) { return doUpload(close, el, btn); } }]
  });
  var el = m.el;
  function sync() {
    var target = $('#u_target', el).value;
    $('#u_new', el).classList.toggle('hidden', !!target);
    $('#u_multi', el).classList.toggle('hidden', !!target);
    var d = dels.filter(function (x) { return x.deliverableId === target; })[0];
    $('#u_ver', el).value = d ? 'V' + (Number(d.latestVersionNo) + 1) + ' (automatic)' : 'V1 (automatic)';
    if (target && files.length > 1) { files = files.slice(0, 1); drawFiles(); }
  }
  function drawFiles() {
    $('#u_files', el).innerHTML = files.map(function (x, i) {
      return '<div class="file-row"><span class="thumb" style="width:32px;height:32px">' + ext(x.file.name) + '</span><span class="grow ellipsis">' + h(x.file.name) + ' <span class="faint">· ' + fileSize(x.file.size) + '</span></span>' +
        (x.state === 'ready' ? '<button class="btn ghost sm" data-rm="' + i + '">Remove</button>' : x.state === 'done' ? '<span class="badge s-approved">Done</span>' : x.state === 'error' ? '<span class="badge s-changes-requested" title="' + h(x.error) + '">Failed</span>' : progressBar(x.progress * 100)) + '</div>';
    }).join('');
    $all('[data-rm]', el).forEach(function (b) { b.onclick = function () { files.splice(Number(b.getAttribute('data-rm')), 1); drawFiles(); }; });
  }
  function add(list) {
    var single = !!$('#u_target', el).value;
    list.forEach(function (f) {
      var err = checkFile(f); if (err) return toast(err, true);
      if (single) files = [];
      files.push({ file: f, state: 'ready', progress: 0 });
    });
    drawFiles();
  }
  var drop = $('#u_drop', el);
  drop.onclick = function () { pickFiles(!$('#u_target', el).value, add); };
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { add(Array.prototype.slice.call(e.dataTransfer.files)); });
  $('#u_target', el).onchange = sync;
  sync();

  function doUpload(close, el, btn) {
    fieldErrors(el, '');
    var target = $('#u_target', el).value;
    var title = $('#u_title', el).value.trim(), purpose = $('#u_purpose', el).value.trim();
    var pending = files.filter(function (x) { return x.state !== 'done'; });
    if (!pending.length) return fieldErrors(el, files.length ? 'Everything is uploaded.' : 'Choose a file to upload.');
    if (!target && !title) return fieldErrors(el, 'Give the creative a title, e.g. “Homepage banner – desktop”.');
    var note = $('#u_note', el).value.trim(), andSubmit = $('#u_submit', el).checked;
    var finalLink = $('#u_link', el).value.trim();
    if (finalLink && !/^https:\/\/\S+$/i.test(finalLink)) return fieldErrors(el, 'The Drive link should start with https://');
    var created = [], errs = [];
    // A new version of one creative is a single file; new creatives upload 3 at a time.
    var chain = runPool(pending, target ? 1 : 3, function (x) {
      x.state = 'uploading'; drawFiles();
      var ctx = { kind: 'version', taskId: t.taskId, deliverableId: target, note: note,
        title: target ? '' : (files.length > 1 ? title + ' — ' + (files.indexOf(x) + 1) : title), purpose: purpose, deliverableType: $('#u_type', el).value.trim() };
      return uploadFile(x.file, ctx, function (p) { x.progress = p; drawFiles(); })
        .then(function (res) { x.state = 'done'; created.push(res.versionId); drawFiles(); }, function (e) { x.state = 'error'; x.error = errMsg(e); drawFiles(); errs.push(e); });
    }).then(function () { if (errs.length) throw errs[0]; });
    return chain.then(function () {
      if (finalLink !== (t.finalLink || '')) return api('api_setFinalLink', t.taskId, finalLink);
    }).then(function () {
      if (andSubmit && created.length) return api('api_submitForApproval', t.taskId, created).then(function (r) { return r; });
    }).then(function (r) {
      close();
      toast(andSubmit ? 'Uploaded and sent for approval' : 'Uploaded — submit it when you’re ready');
      if (r && r.links && r.links.length) showLinks(r.links);
      loadNotifications();
      reloadTask();
    }).catch(function (e) {
      fieldErrors(el, errMsg(e) + (created.length ? ' (' + created.length + ' file(s) were uploaded and kept.)' : ''));
      if (created.length) reloadTask();
    });
  }
}

function submitModal(drafts) {
  var t = TASK.task;
  var names = {};
  TASK.deliverables.forEach(function (d) { d.versions.forEach(function (v) { names[v.versionId] = d.title + ' · V' + v.versionNo; }); });
  modal({
    title: 'Submit for approval',
    body: '<p class="muted">These creatives will get a secure review link. The team leader' + (APP.role === 'leader' ? '' : ' and the requester') + ' will be notified.</p>' +
      drafts.map(function (v) { return '<label class="check"><input type="checkbox" checked value="' + h(v.versionId) + '"> ' + h(names[v.versionId]) + '</label>'; }).join('') +
      '<div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, {
      label: 'Submit', cls: 'ok', onClick: function (close, m) {
        var ids = $all('input[type=checkbox]:checked', m).map(function (c) { return c.value; });
        if (!ids.length) return fieldErrors(m, 'Pick at least one creative.');
        return api('api_submitForApproval', t.taskId, ids).then(function (r) {
          close(); toast('Sent for approval'); if (r.links && r.links.length) showLinks(r.links); loadNotifications(); reloadTask();
        }).catch(function (e) { fieldErrors(m, errMsg(e)); });
      }
    }]
  });
}

function showLinks(links) {
  modal({
    title: 'Review links ready',
    body: '<p class="muted">They were also emailed to you' + '. Share each link with whoever approves it.</p>' + links.map(function (l, i) {
      return '<div class="field"><label>' + h(l.deliverable) + ' · V' + h(l.versionNo) + '</label><div class="row"><input type="text" readonly value="' + h(l.url) + '"><button class="btn" data-cp="' + i + '">Copy</button></div></div>';
    }).join(''),
    actions: [{ label: 'Done', cls: 'primary' }]
  });
  $all('[data-cp]').forEach(function (b) { b.onclick = function () { copyText(links[Number(b.getAttribute('data-cp'))].url); }; });
}

/* ---------- compare versions ---------- */

function compareModal(deliverableId) {
  var d = TASK.deliverables.filter(function (x) { return x.deliverableId === deliverableId; })[0];
  if (!d) return;
  var vs = d.versions;
  var opts = function (sel) { return vs.map(function (v) { return '<option value="' + h(v.versionId) + '"' + (v.versionId === sel ? ' selected' : '') + '>V' + h(v.versionNo) + ' · ' + h(v.status) + '</option>'; }).join(''); };
  var m = modal({
    title: 'Compare versions · ' + d.title, wide: true,
    body: '<div class="cmp"><div class="stack" style="gap:8px"><select id="cmpA">' + opts(vs[1].versionId) + '</select><div class="preview-box" id="pvA"></div><div id="mA" class="small faint"></div></div>' +
      '<div class="stack" style="gap:8px"><select id="cmpB">' + opts(vs[0].versionId) + '</select><div class="preview-box" id="pvB"></div><div id="mB" class="small faint"></div></div></div>',
    actions: [{ label: 'Close' }]
  });
  function load(side) {
    var id = $('#cmp' + side, m.el).value;
    var v = vs.filter(function (x) { return x.versionId === id; })[0];
    $('#pv' + side, m.el).innerHTML = '<span class="spinner"></span>';
    $('#m' + side, m.el).textContent = 'Uploaded by ' + (v.uploadedByName || v.uploadedBy) + ' · ' + fmtDateTime(v.uploadedAt) + ' · ' + fileSize(v.sizeBytes);
    api('api_getAsset', 'version', id, 'preview').then(function (p) { $('#pv' + side, m.el).innerHTML = previewHtml(p); })
      .catch(function (e) { $('#pv' + side, m.el).innerHTML = '<div class="empty">' + h(errMsg(e)) + '</div>'; });
  }
  $('#cmpA', m.el).onchange = function () { load('A'); };
  $('#cmpB', m.el).onchange = function () { load('B'); };
  load('A'); load('B');
}
</script>

<script>
/* AppAdmin.js — reports, team management, settings (team leader only; the server enforces this too). */

/* ================= REPORTS ================= */
var REPORT_RANGE = null;

VIEWS.reports = function (arg, el, token) {
  setCrumb('Reports');
  if (!REPORT_RANGE) {
    var to = new Date(), from = new Date(Date.now() - 89 * 864e5);
    var iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
    REPORT_RANGE = { from: iso(from), to: iso(to) };
  }
  api('api_getReports', REPORT_RANGE).then(function (r) {
    if (stale(token)) return;
    var s = r.summary;
    var maxDept = Math.max.apply(null, [1].concat(r.byDepartment.map(function (x) { return x.count; })));
    var maxType = Math.max.apply(null, [1].concat(r.byCreativeType.map(function (x) { return x.count; })));
    var bars = function (rows, max) {
      return rows.length ? rows.map(function (x) {
        return '<div class="bar-row"><span class="ellipsis" title="' + h(x.label) + '">' + h(x.label) + '</span><span class="bar"><i style="width:' + Math.round(x.count / max * 100) + '%"></i></span><span class="small" style="text-align:right">' + x.count + '</span></div>';
      }).join('') : emptyState('No tasks in this range.');
    };
    var trend = function (rows) {
      var max = Math.max.apply(null, [1].concat(rows.map(function (x) { return Math.max(x.requirements, x.completed); })));
      return rows.length ? '<div class="table-wrap"><table class="t"><thead><tr><th>Period</th><th>Requirements in</th><th>Tasks completed</th><th>Creatives approved</th></tr></thead><tbody>' + rows.map(function (x) {
        return '<tr><td class="mono">' + h(x.period) + '</td>' +
          '<td><div class="row"><div class="prog" style="width:90px"><i style="width:' + Math.round(x.requirements / max * 100) + '%;background:var(--info)"></i></div>' + x.requirements + '</div></td>' +
          '<td><div class="row"><div class="prog ok" style="width:90px"><i style="width:' + Math.round(x.completed / max * 100) + '%"></i></div>' + x.completed + '</div></td><td>' + x.approvals + '</td></tr>';
      }).join('') + '</tbody></table></div>' : emptyState('No activity in this range.');
    };
    el.innerHTML =
      '<div class="page-h"><div><h1>Team analytics</h1><p>Calculated from the live task, assignment and approval records.</p></div>' +
      '<div class="row wrap"><input type="date" id="rf" value="' + h(r.range.from) + '" style="width:auto"><span class="faint">to</span><input type="date" id="rt" value="' + h(r.range.to) + '" style="width:auto">' +
      '<button class="btn" id="rApply">Apply</button></div></div>' +
      '<div class="kpis">' +
      kpiCard('Requirements received', s.requirements) + kpiCard('Creatives done', s.creativesDone, null, { sub: 'approved in this period', color: 'var(--ok)' }) + kpiCard('Creatives rejected', s.creativesRejected || 0, null, { color: 'var(--bad)' }) + kpiCard('Tasks completed', s.tasksCompleted) + kpiCard('Overdue now', s.overdueNow, null, { alert: true }) +
      kpiCard('Avg. completion', s.avgCompletionDays === null ? '—' : s.avgCompletionDays + 'd', null, { sub: 'assignment → completion, hold time excluded' }) +
      kpiCard('Avg. approval time', s.avgApprovalHours === null ? '—' : (s.avgApprovalHours >= 48 ? Math.round(s.avgApprovalHours / 24 * 10) / 10 + 'd' : s.avgApprovalHours + 'h'), null, { sub: 'link sent → decision' }) +
      kpiCard('Revision cycles', s.revisionCycles, null, { sub: (s.avgRevisionsPerCompletedTask === null ? '—' : s.avgRevisionsPerCompletedTask) + ' per completed task' }) +
      kpiCard('Approval rate', s.approvalRate === null ? '—' : s.approvalRate + '%', null, { sub: s.decisions + ' decisions' }) +
      kpiCard('On hold now', (s.onHoldOthers || 0) + (s.onHoldInternal || 0), null, { sub: (s.onHoldOthers || 0) + ' waiting on other teams · not counted as late' }) +
      '</div>' +
      '<div class="card" style="margin-top:18px"><div class="card-h"><h3>Designers</h3><button class="btn sm" data-csv="designers">' + icon('download') + ' CSV</button></div><div class="table-wrap">' +
      (r.designers.length ? '<table class="t"><thead><tr><th>Designer</th><th title="Points earned in this period">Points</th><th title="Creatives approved in this period">Creatives done</th><th title="Creatives rejected in this period">Rejected</th><th title="Creatives uploaded in this period">Uploaded</th><th>Tasks assigned</th><th>Tasks completed</th><th>Avg. completion</th><th>Active now</th><th>Overdue now</th><th>Revision cycles</th><th>Approval rate</th></tr></thead><tbody>' +
        r.designers.map(function (d) {
          return '<tr><td><b>' + h(d.name) + '</b>' + (d.active ? '' : ' <span class="faint small">(inactive)</span>') + '<div class="faint small">' + h(d.designation || d.email) + '</div></td><td><b>' + d.points + '</b></td><td><b style="font-size:15px">' + d.creativesDone + '</b></td><td' + (d.creativesRejected ? ' style="color:var(--bad)"' : '') + '>' + d.creativesRejected + '</td><td>' + d.creativesUploaded + '</td><td>' + d.assigned + '</td><td>' + d.completed + '</td>' +
            '<td>' + (d.avgCompletionDays === null ? '—' : d.avgCompletionDays + ' d') + '</td><td>' + d.activeNow + '</td><td' + (d.overdueNow ? ' class="overdue-flag"' : '') + '>' + d.overdueNow + '</td>' +
            '<td>' + d.revisionCycles + '</td><td>' + (d.approvalRate === null ? '—' : d.approvalRate + '%') + '</td></tr>';
        }).join('') + '</tbody></table>' : emptyState('No designer data yet.', '', 'users')) + '</div></div>' +
      pointsSection(r.points) +
      '<div class="grid-2" style="margin-top:18px"><div class="card"><div class="card-h"><h3>Workload by department</h3></div><div class="card-b">' + bars(r.byDepartment, maxDept) + '</div></div>' +
      '<div class="card"><div class="card-h"><h3>Workload by creative type</h3></div><div class="card-b">' + bars(r.byCreativeType, maxType) + '</div></div></div>' +
      '<div class="card" style="margin-top:18px"><div class="card-h"><h3>Trends</h3><div class="seg" id="trSeg"><button data-t="weekly" class="on">Weekly</button><button data-t="monthly">Monthly</button></div></div><div id="trend">' + trend(r.weekly) + '</div></div>' +
      '<div class="card" style="margin-top:18px"><div class="card-b row wrap between"><div><b>Export</b><div class="faint small">CSV files for the selected date range.</div></div><div class="row wrap">' +
      '<button class="btn" data-csv="tasks">' + icon('download') + ' Tasks</button><button class="btn" data-csv="designers">' + icon('download') + ' Designers</button><button class="btn" data-csv="decisions">' + icon('download') + ' Approval decisions</button>' +
      '<button class="btn" data-csv="points">' + icon('download') + ' Points</button><button class="btn" data-csv="rewards">' + icon('download') + ' Rewards</button></div></div></div>';
    wireGo(el);
    $('#rApply').onclick = function () {
      REPORT_RANGE = { from: $('#rf').value, to: $('#rt').value };
      if (!REPORT_RANGE.from || !REPORT_RANGE.to) return toast('Pick both dates.', true);
      render('reports');
    };
    $all('#trSeg button').forEach(function (b) {
      b.onclick = function () { $all('#trSeg button').forEach(function (x) { x.classList.toggle('on', x === b); }); $('#trend').innerHTML = trend(r[b.getAttribute('data-t')]); };
    });
    $all('[data-csv]', el).forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        api('api_exportCsv', b.getAttribute('data-csv'), REPORT_RANGE).then(function (x) { downloadText(x.fileName, x.csv); })
          .catch(function (e) { toast(errMsg(e), true); }).then(function () { b.disabled = false; });
      };
    });
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
};

/* ================= TEAM ================= */
VIEWS.team = function (arg, el, token) {
  setCrumb('Team management');
  api('api_listTeam').then(function (d) {
    if (stale(token)) return;
    el.innerHTML = '<div class="page-h"><div><h1>Team</h1><p>People who can sign in to the portal. Designers only see their own tasks.</p></div>' +
      '<button class="btn primary" id="addUser">' + icon('plus') + ' Add team member</button></div>' +
      '<div class="card"><div class="table-wrap"><table class="t"><thead><tr><th>Name</th><th>Role</th><th>Active tasks</th><th>Completed</th><th>Status</th><th></th></tr></thead><tbody>' +
      d.users.map(function (u) {

var THEME_SEL = null;
/** Live preview: rewrites the theme <style> on this page only (Save makes it permanent for everyone). */
function previewTheme(accent, dark) {
  function rgb(x) { var n = parseInt(x.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(c, to, t) { return '#' + c.map(function (v, i) { return ('0' + Math.round(v + (to[i] - v) * t).toString(16)).slice(-2); }).join(''); }
  var a = rgb(accent), v = { '--accent': accent };
  if (dark) {
    Object.assign(v, { '--bg': '#131519', '--surface': '#1c1f25', '--surface-2': '#22262d', '--line': '#2f343c', '--line-strong': '#3c424c', '--text': '#eceae6', '--text-2': '#b7b2a9',
      '--text-3': '#8d887f', '--muted-soft': '#2a2e35', '--accent-ink': mix(a, [255, 255, 255], .25), '--accent-soft': mix(a, [28, 31, 37], .78) });
  } else {
    Object.assign(v, { '--bg': '#f6f5f2', '--surface': '#ffffff', '--surface-2': '#faf9f6', '--line': '#e7e4dd', '--line-strong': '#d6d1c6', '--text': '#1f1d1a', '--text-2': '#5c5750',
      '--text-3': '#8b857b', '--muted-soft': '#eeece7', '--accent-ink': mix(a, [0, 0, 0], .25), '--accent-soft': mix(a, [255, 255, 255], .88) });
  }
  var st = document.getElementById('theme');
  if (!st) { st = document.createElement('style'); st.id = 'theme'; document.head.appendChild(st); }
  st.textContent = ':root{' + Object.keys(v).map(function (k) { return k + ':' + v[k]; }).join(';') + '}';
}
