      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then echo "Missing CLASPRC_JSON or SCRIPT_ID secret"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          node -e "let c;try{c=JSON.parse(require('fs').readFileSync(require('os').homedir()+'/.clasprc.json','utf8'))}catch(e){console.log('CLASPRC_JSON is not valid JSON - paste the whole file again');process.exit(1)}if(!c.token||!c.token.refresh_token){console.log('CLASPRC_JSON has no token.refresh_token - wrong text pasted');process.exit(1)}console.log('Credentials look valid')"
          printf '{"scriptId":"%s","rootDir":"paste-kit"}' "$SCRIPT_ID" > .clasp.json
