<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include_('Styles') ?>
<?!= themeCss_() ?>
<style>
  body { background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  .intro { margin-bottom: 18px; }
  .intro h1 { font-size: 24px; margin-bottom: 4px; }
  .mail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .mail-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 600; }
  .mail-head .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .mrow { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .mrow > .mlabel { color: var(--text-3); font-size: 13px; }
  .mrow input, .mrow select { border-color: transparent; background: transparent; padding-left: 0; }
  .mrow input:focus, .mrow select:focus { box-shadow: none; border-color: transparent; }
  .mrow.split { grid-template-columns: 120px 1fr 1fr; }
  .mrow.bad { background: var(--bad-soft); }
  .mrow .err, .mbody .err { font-size: 12px; color: var(--bad); grid-column: 2 / -1; }
  .mbody { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .mbody textarea { border: 0; padding: 0; min-height: 180px; font-size: 15px; box-shadow: none !important; }
  .mbody.bad { background: var(--bad-soft); }
  .attach { padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
  .attach .links { min-height: 44px; font-size: 13px; }
  .attach-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rec-btn svg { color: #c0392b; }
  .rec-bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 99px; background: #fdecea; color: #7d1f16; font-variant-numeric: tabular-nums; }
  .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #e53935; animation: recblink 1s infinite; flex: none; }
  @keyframes recblink { 50% { opacity: .25; } }
  #liveCam { width: 100%; max-width: 360px; border-radius: 12px; background: #000; transform: scaleX(-1); }
  .note-row { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
  .note-top { display: flex; align-items: center; gap: 8px; }
  .note-top svg { width: 14px; height: 14px; vertical-align: -2px; color: #c0392b; }
  .note-row audio { width: 100%; height: 38px; }
  .note-row video { width: 100%; max-width: 320px; max-height: 220px; border-radius: 8px; background: #000; }
  .attach-bar .faint { font-size: 12px; }
  .send-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: var(--surface-2); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .hp { position: absolute; left: -5000px; }
  .drop-hint { border: 1.5px dashed transparent; border-radius: 8px; }
  .mail.dragging .drop-hint { border-color: var(--accent); background: var(--accent-soft); }
  .done { text-align: center; padding: 44px 24px; }
  .done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 14px; }
  .done .tick svg { width: 28px; height: 28px; }
  .ref-id { display: inline-block; font-size: 22px; font-weight: 600; padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
  .tabs-top { display: flex; gap: 4px; margin-bottom: 18px; background: var(--muted-soft); padding: 4px; border-radius: 10px; width: fit-content; }
  .tabs-top button { border: 0; background: none; padding: 8px 16px; border-radius: 7px; font: 500 13.5px var(--font); color: var(--text-2); cursor: pointer; }
  .tabs-top button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .req-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .req-card + .req-card { margin-top: 12px; }
  .req-card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .req-card h3 { font-size: 15.5px; margin: 0 0 2px; }
  .req-card .meta { font-size: 12.5px; color: var(--text-3); }
  .req-card .brief { font-size: 13px; color: var(--text-2); margin: 8px 0 0; white-space: pre-line; }
  .req-card .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .camp-strip { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; }
  .camp-strip svg { width: 14px; height: 14px; vertical-align: -2px; }
  .gal-h { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .cr { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; }
  .cr .ph { aspect-ratio: 1 / 1; display: grid; place-items: center; background: var(--surface-2) center / cover no-repeat; cursor: zoom-in; border: 0; padding: 0; width: 100%;
    font: 600 12px/1 inherit; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .cr .info { padding: 7px 9px 8px; background: var(--surface); }
  .cr .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr .s { font-size: 11px; color: var(--text-3); display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-top: 2px; }
  .cr .s.ok { color: var(--ok); }
  .cr .dl { border: 0; background: none; padding: 2px; color: var(--accent); cursor: pointer; display: inline-flex; }
  .cr .dl svg { width: 16px; height: 16px; }
  .st-received, .st-on-hold { background: var(--muted-soft); color: var(--text-2); }
  .st-waiting-for-your-input { background: var(--warn-soft); color: #7a4f00; }
  .st-in-progress { background: var(--accent-soft); color: var(--accent-ink); }
  .st-ready-for-your-review { background: var(--warn-soft); color: var(--warn); }
  .st-being-revised { background: var(--info-soft); color: var(--info); }
  .st-completed { background: var(--ok-soft); color: var(--ok); }
  .st-cancelled, .st-closed { background: var(--muted-soft); color: var(--text-3); }
  .ro-list { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .ro-item { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .ro-item:last-child { border-bottom: 0; }
  .ro-item input { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .ro-item .ellipsis { flex: 1; min-width: 0; }
  .owners { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .owner-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; background: var(--muted-soft); border-radius: 99px; padding: 2px 6px 2px 10px; }
  .owner-chip button { border: 0; background: none; cursor: pointer; padding: 2px; color: var(--text-3); display: inline-flex; }
  .owner-chip button svg { width: 12px; height: 12px; }
  @media (max-width: 600px) {
    .mrow, .mrow.split { grid-template-columns: 1fr; gap: 2px; }
    .mrow.split > .mlabel { margin-top: 4px; }
  }
</style>
</head>
<body>
<main>
  <div class="tabs-top" role="tablist"><button data-tab="new" class="on" role="tab">New request</button><button data-tab="my" role="tab">My requests</button></div>
  <div id="main"><div class="loading-page"><span class="spinner"></span> Loading…</div></div>
</main>

<?!= include_('Common.js') ?>
<script>
var BOOT = <?!= bootJson ?>;
var CFG = null, FILES = [];

/* ---- tracking link: from the URL, else remembered on this device ---- */
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
// Every request sent from this device is remembered (several, also without an email).
var TRACKS = [];
try { TRACKS = JSON.parse(store('gfxTracks') || '[]') || []; } catch (e) { TRACKS = []; }
if (store('gfxTrack') && TRACKS.indexOf(store('gfxTrack')) === -1) TRACKS.push(store('gfxTrack'));
if (BOOT.track && TRACKS.indexOf(BOOT.track) === -1) TRACKS.unshift(BOOT.track);
function saveTracks() { TRACKS = TRACKS.slice(0, 30); store('gfxTracks', JSON.stringify(TRACKS)); store('gfxTrack', null); }
function addTrack(t) { if (t && TRACKS.indexOf(t) === -1) { TRACKS.unshift(t); saveTracks(); } }
saveTracks();

$all('.tabs-top button').forEach(function (b) { b.onclick = function () { showTab(b.getAttribute('data-tab')); }; });
function showTab(tab) {
  $all('.tabs-top button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  if (tab === 'my') return renderMy();
  if (!CFG) return;
  renderForm();
}

api('api_getFormConfig').then(function (cfg) { CFG = cfg; showTab(BOOT.tab === 'my' ? 'my' : 'new'); })
  .catch(function (e) { $('#main').innerHTML = '<div class="alert bad">' + h(errMsg(e)) + '</div>'; });

/* ---- My requests ---- */
function renderMy() {
  var el = $('#main');
  if (!TRACKS.length) return renderAskEmail();
  el.innerHTML = '<div class="loading-page"><span class="spinner"></span> Loading your requests…</div>';
  api('api_getMyRequests', TRACKS).then(function (d) {
    var list = d.requests;
    el.innerHTML = '<div class="intro"><h1>My requests</h1><p class="muted">' +
      (d.email ? 'Requests from <b>' + h(d.email) + '</b>' : 'Requests sent from this device') + '. ' +
      '<a href="#" id="forget">Not you? Clear this device</a>' + (d.email ? '' : ' · <a href="#" id="byEmail">Find requests by email</a>') + '</p></div>' +
      (list.length ? list.map(reqCard).join('') :
        '<div class="card"><div class="empty">' + icon('inbox') + '<b>No requests yet</b><span>Anything you send will show up here.</span></div></div>');
    $('#forget').onclick = function (e) { e.preventDefault(); TRACKS = []; saveTracks(); renderMy(); };
    if ($('#byEmail')) $('#byEmail').onclick = function (e) { e.preventDefault(); renderAskEmail(); };
    $all('[data-review]', el).forEach(function (b) {
      b.onclick = function () {
        var w = null; try { w = window.open('', '_blank'); } catch (x) { w = null; }
        b.disabled = true;
        api('api_trackReview', TRACKS, b.getAttribute('data-review')).then(function (r) {
          if (w) w.location = r.url;
          else b.outerHTML = '<a class="btn primary sm" href="' + h(r.url) + '" target="_blank" rel="noopener">Open review ↗</a>';
          b.disabled = false;
        }).catch(function (e) { if (w) w.close(); toast(errMsg(e), true); b.disabled = false; renderMy(); });
      };
    });
    wireCreatives(el);
    $all('[data-campview]', el).forEach(function (b) { b.onclick = function () { campaignGallery(b.getAttribute('data-campview')); }; });
    $all('[data-sendinfo]', el).forEach(function (b) {
      b.onclick = function () {
        var w = null; try { w = window.open('', '_blank'); } catch (x) { w = null; }
        b.disabled = true;
        api('api_trackShareLink', TRACKS, b.getAttribute('data-sendinfo')).then(function (r) {
          if (w) w.location = r.url; else location.href = r.url;
          b.disabled = false;
        }).catch(function (e) { if (w) w.close(); toast(errMsg(e), true); b.disabled = false; });
      };
    });
    $all('[data-askchg]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-askchg');
        modal({ title: 'What needs to change?', body: '<p class="muted" style="margin-top:0">We’ll send this to the graphics team lead, who will reopen the request.</p><div class="field"><textarea id="akM" rows="4" maxlength="3000" placeholder="e.g. Change the MRP to ₹899"></textarea></div><div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Send', cls: 'primary', onClick: function (close, m) {
            var v = $('#akM', m).value.trim();
            if (v.length < 5) return fieldErrors(m, 'Describe what needs to change.');
            return api('api_trackAskChanges', TRACKS, id, v).then(function (r) { close(); toast(r.message); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
          } }] });
      };
    });
    $all('[data-zipall]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-zipall'), label = b.innerHTML;
        b.disabled = true; b.innerHTML = '<span class="spinner" style="width:13px;height:13px"></span> Preparing…';
        api('api_trackZip', TRACKS, id).then(function (z) { downloadBase64(z.fileName, z.mimeType, z.base64); toast(z.count + ' creatives downloaded'); })
          .catch(function (e) { toast(errMsg(e), true); }).then(function () { b.disabled = false; b.innerHTML = label; });
      };
    });
    $all('[data-drive]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-drive');
        b.disabled = true;
        api('api_trackDriveLink', TRACKS, id).then(function (x) {
          var who = x.shared === 'anyone' ? 'Anyone with this link can open and download the files — they can’t edit them.' :
            x.shared === 'domain' ? 'Anyone at the company with this link can open and download — they can’t edit.' : 'Only people with access can open this folder.';
          var m = modal({ title: x.campaign ? x.campaign + ' — all creatives' : 'Google Drive link',
            body: (x.campaign ? '<p class="muted" style="margin-top:0">This request is part of the <b>' + h(x.campaign) + '</b> campaign, so the link has every creative of the campaign, sorted into folders.</p>' : '') +
              '<div class="field"><input type="text" id="drvUrl" readonly value="' + h(x.url) + '"></div><p class="hint" style="margin:0">' + icon('users').replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"') + ' ' + h(who) + '</p>',
            actions: [{ label: 'Close' },
              { label: 'WhatsApp', onClick: function (close) { window.open('https://wa.me/?text=' + encodeURIComponent((x.campaign ? x.campaign + ' creatives: ' : 'Creatives: ') + x.url), '_blank', 'noopener'); close(); } },
              { label: 'Open', onClick: function (close) { window.open(x.url, '_blank', 'noopener'); close(); } },
              { label: 'Copy link', cls: 'primary', onClick: function (close) {
                var inp = $('#drvUrl', m.el); inp.select();
                var done = function () { toast('Link copied'); close(); };
                if (navigator.clipboard) return navigator.clipboard.writeText(x.url).then(done, function () { document.execCommand('copy'); done(); });
                document.execCommand('copy'); done();
              } }] });
        }).catch(function (e) { toast(errMsg(e), true); }).then(function () { b.disabled = false; });
      };
    });
    $all('[data-reopen]', el).forEach(function (b) {
      b.onclick = function () {
        var r = list.filter(function (x) { return x.requirementId === b.getAttribute('data-reopen'); })[0];
        if (!r) return;
        var cr = (r.creatives || []).filter(function (c) { return c.isFinal || c.state === 'Approved'; });
        var soon = new Date(Date.now() + 2 * 864e5), iso = soon.getFullYear() + '-' + ('0' + (soon.getMonth() + 1)).slice(-2) + '-' + ('0' + soon.getDate()).slice(-2);
        var m = modal({ title: 'Reopen ' + r.requirementId + ' for changes', wide: true,
          body: '<p class="muted" style="margin-top:0">It goes straight back to the designer. The approved files stay available until the new ones are approved.</p>' +
            '<div class="field"><label for="roR">What needs to change?</label><textarea id="roR" rows="4" maxlength="2000" placeholder="e.g. Change the MRP to ₹899 on all labels"></textarea></div>' +
            (cr.length ? '<div class="field"><div class="row between"><label>Which creatives?</label><label class="check small"><input type="checkbox" id="roAll" checked> All ' + cr.length + '</label></div>' +
              '<div class="ro-list">' + cr.map(function (c) {
                return '<label class="ro-item"><input type="checkbox" value="' + h(c.versionId) + '" checked><span class="ellipsis">' + h(c.title) + '</span><span class="faint small">' + h(c.version) + '</span></label>';
              }).join('') + '</div></div>' : '') +
            '<div class="row wrap" style="gap:12px"><div class="field"><label for="roD">Needed by</label><input type="date" id="roD" min="' + todayIso() + '" value="' + iso + '"></div>' +
            '<div class="field"><label for="roT">Time (optional)</label><input type="time" id="roT" step="900"></div></div>' +
            '<div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Reopen', cls: 'primary', onClick: function (close, mm) {
            var reason = $('#roR', mm).value.trim();
            if (reason.length < 5) return fieldErrors(mm, 'Describe what needs to change.');
            var ids = $all('.ro-item input:checked', mm).map(function (x) { return x.value; });
            if (cr.length && !ids.length) return fieldErrors(mm, 'Choose at least one creative.');
            if (!$('#roD', mm).value) return fieldErrors(mm, 'Pick a date.');
            return api('api_trackReopen', TRACKS, r.requirementId, { reason: reason, versionIds: ids.length === cr.length ? [] : ids, dueDate: $('#roD', mm).value, dueTime: $('#roT', mm).value })
              .then(function (x) { close(); toast(x.message); renderMy(); }).catch(function (e) { fieldErrors(mm, errMsg(e)); });
          } }] });
        if ($('#roAll', m.el)) {
          $('#roAll', m.el).onchange = function () { var on = this.checked; $all('.ro-item input', m.el).forEach(function (x) { x.checked = on; }); };
          $all('.ro-item input', m.el).forEach(function (x) { x.onchange = function () { $('#roAll', m.el).checked = $all('.ro-item input:not(:checked)', m.el).length === 0; }; });
        }
      };
    });
    $all('[data-addown]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-addown');
        modal({ title: 'Add someone to this request', body: '<p class="muted" style="margin-top:0">They’ll get an email with their own link. Then you both see this request in My requests, can edit it and approve the creatives.</p>' +
          '<div class="field"><label for="aoE">Their email</label><input type="email" id="aoE" maxlength="254" placeholder="colleague@company.com" autocomplete="off"></div><div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Add', cls: 'primary', onClick: function (close, m) {
            var v = $('#aoE', m).value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) return fieldErrors(m, 'Enter a valid email.');
            return api('api_trackAddOwner', TRACKS, id, v).then(function () { close(); toast('Added — we’ve emailed them their link'); renderMy(); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
          } }] });
      };
    });
    $all('[data-rmown]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-rmown'), em = b.getAttribute('data-em');
        confirmBox('Remove ' + em + '?', 'They won’t see this request any more.', 'Remove', true).then(function (y) {
          if (y) api('api_trackRemoveOwner', TRACKS, id, em).then(function () { toast('Removed'); renderMy(); }).catch(function (e) { toast(errMsg(e), true); });
        });
      };
    });
    $all('[data-edit]', el).forEach(function (b) {
      b.onclick = function () {
        var r = list.filter(function (x) { return x.requirementId === b.getAttribute('data-edit'); })[0];
        if (!r) return;
        var e = r.edit || {};
        modal({ title: 'Edit ' + r.requirementId, wide: true, body: '<p class="muted" style="margin-top:0">The graphics team is told what changed. To change how many creatives you need, write it in the brief.</p>' +
          '<div class="field"><label for="erT">Title</label><input id="erT" maxlength="150" value="' + h(e.title) + '"></div>' +
          '<div class="field"><label for="erB">What you need (brief)</label><textarea id="erB" rows="5" maxlength="8000">' + h(e.brief) + '</textarea></div>' +
          '<div class="field"><label for="erC">Copy / text on the creative</label><textarea id="erC" rows="3" maxlength="8000">' + h(e.copyText) + '</textarea></div>' +
          '<div class="field"><label for="erI">Anything else</label><textarea id="erI" rows="2" maxlength="8000">' + h(e.instructions) + '</textarea></div>' +
          '<div class="row wrap" style="gap:12px"><div class="field"><label for="erD">Needed by</label><input type="date" id="erD" min="' + todayIso() + '" value="' + h(e.preferredDate) + '"></div>' +
          '<div class="field"><label for="erTm">Time (optional)</label><input type="time" id="erTm" step="900" value="' + h(e.preferredTime) + '"></div></div>' +
          '<div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Save changes', cls: 'primary', onClick: function (close, m) {
            return api('api_trackEditRequest', TRACKS, r.requirementId, { title: $('#erT', m).value, brief: $('#erB', m).value, copyText: $('#erC', m).value, instructions: $('#erI', m).value,
              preferredDate: $('#erD', m).value, preferredTime: $('#erTm', m).value }).then(function (x) {
              close(); toast(x.changed.length ? 'Saved — the graphics team has been told' : 'Nothing changed'); renderMy();
            }).catch(function (er) { fieldErrors(m, errMsg(er)); });
          } }] });
      };
    });
    $all('[data-approveall]', el).forEach(function (b) {
      b.onclick = function () {
        var ids = b.getAttribute('data-approveall').split(',');
        modal({ title: 'Approve all ' + ids.length + ' creatives?', body: '<p class="muted">Only do this if you’ve looked at every one — tap the previews to check them. To ask for changes on any creative, use its own Review button instead.</p><div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Approve all ' + ids.length, cls: 'ok', onClick: function (close, m) {
            return api('api_trackApproveMany', TRACKS, ids).then(function (r) {
              close(); toast('Approved ' + r.approved + ' creative' + (r.approved === 1 ? '' : 's') + (r.skipped.length ? ' · ' + r.skipped.length + ' already decided' : '')); renderMy();
            }).catch(function (e) { fieldErrors(m, errMsg(e)); });
          } }] });
      };
    });
  }).catch(function (e) {
    if (e.code === 'LINK_INVALID' || e.code === 'LINK_EXPIRED') { TRACKS = []; saveTracks(); return renderAskEmail(errMsg(e)); }
    el.innerHTML = '<div class="alert bad">' + h(errMsg(e)) + '</div>';
  });
}

/** Every approved creative in the campaign (all departments + the team's own work), grouped by folder. */

/* ---------- voice / video notes (WhatsApp-style): tap, talk, Done ---------- */
var REC = null;
var REC_MAX = { audio: 300, video: 120 };   // seconds: 5 min voice, 2 min video (keeps the file small)

function mediaNoteCount() { return FILES.filter(function (x) { return x.note; }).length; }
function fmtSecs(n) { n = Math.max(0, Math.round(n || 0)); return Math.floor(n / 60) + ':' + ('0' + (n % 60)).slice(-2); }

function pickRecType(kind) {
  var list = kind === 'audio' ? ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
    : ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}

/**
 * Can this page use the mic / camera itself? The portal runs inside Google's frame, which
 * normally isn't allowed to — then we record in a small window of its own instead, where the
 * browser can ask "Allow microphone?" like any website. Either way: tap, talk, Done. No file picker.
 */
function recordInPage(kind) {
  if (window.FORCE_REC_POPUP) return false;
  var fp = document.permissionsPolicy || document.featurePolicy;
  if (fp && fp.allowsFeature) { try { return fp.allowsFeature(kind === 'audio' ? 'microphone' : 'camera'); } catch (e) { /* fall through */ } }
  try { return window.self === window.top; } catch (e) { return false; }
}

function canRecordHere() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }

function startRecording(kind) {
  if (REC) return;
  if (POPREC && !POPREC.win.closed) { try { POPREC.win.focus(); } catch (e) { } return; }
  if (FILES.length >= CFG.maxFiles) return toast('You can attach up to ' + CFG.maxFiles + ' files.', true);
  if (!window.MediaRecorder) return toast('This browser can’t record. Please open the form in Chrome, Edge or Safari (latest version).', true);
  if (!recordInPage(kind) || !canRecordHere()) return openRecorderWindow(kind);
  var cons = kind === 'audio' ? { audio: { echoCancellation: true, noiseSuppression: true } } :
    { audio: true, video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } };
  navigator.mediaDevices.getUserMedia(cons).then(function (stream) {
    var type = pickRecType(kind), chunks = [];
    var rec = new MediaRecorder(stream, Object.assign(type ? { mimeType: type } : {}, kind === 'audio' ? { audioBitsPerSecond: 48000 } : { videoBitsPerSecond: 800000, audioBitsPerSecond: 64000 }));
    REC = { kind: kind, rec: rec, stream: stream, chunks: chunks, started: Date.now(), keep: true };
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function () { finishRecording(); };
    rec.start(1000);
    $('#recLabel').textContent = kind === 'audio' ? 'Recording voice note… speak now' : 'Recording video…';
    $('#recBar').classList.remove('hidden');
    $('#micBtn').disabled = $('#camBtn').disabled = true;
    if (kind === 'video') showLivePreview(stream);
    REC.timer = setInterval(function () {
      var secs = (Date.now() - REC.started) / 1000;
      $('#recTime').textContent = fmtSecs(secs) + ' / ' + fmtSecs(REC_MAX[kind]);
      if (secs >= REC_MAX[kind]) { toast('That’s the maximum length — saved.'); stopRecording(true); }
    }, 250);
  }).catch(function (err) {
    if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) return openRecorderWindow(kind);
    toast('No ' + (kind === 'audio' ? 'microphone' : 'camera') + ' found on this device.', true);
  });
}

function stopRecording(keep) {
  if (!REC) return;
  REC.keep = keep;
  clearInterval(REC.timer);
  try { if (REC.rec.state !== 'inactive') REC.rec.stop(); else finishRecording(); } catch (e) { finishRecording(); }
}

function finishRecording() {
  var r = REC; if (!r) return;
  REC = null;
  r.stream.getTracks().forEach(function (t) { t.stop(); });
  $('#recBar').classList.add('hidden');
  $('#micBtn').disabled = $('#camBtn').disabled = false;
  var lv = $('#liveCam'); if (lv) lv.remove();
  if (!r.keep) return toast('Recording discarded');
  var type = (r.rec.mimeType || (r.chunks[0] && r.chunks[0].type) || (r.kind === 'audio' ? 'audio/webm' : 'video/webm'));
  addRecording(r.chunks, type, r.kind, (Date.now() - r.started) / 1000);
}

/** A finished recording (from this page or the recorder window) becomes an attachment. */
function addRecording(parts, type, kind, secs) {
  if (secs < 1 || !parts.length) return toast('That was too short — try again.', true);
  type = String(type || '').split(';')[0] || (kind === 'audio' ? 'audio/webm' : 'video/webm');
  var ex = /mp4/.test(type) ? (kind === 'audio' ? 'm4a' : 'mp4') : /ogg/.test(type) ? 'ogg' : 'webm';
  var n = FILES.filter(function (x) { return x.note === kind; }).length + 1;
  var file = new File(parts, (kind === 'audio' ? 'Voice note ' : 'Video note ') + n + '.' + ex, { type: type });
  if (file.size > CFG.maxFileMB * 1048576) return toast('That recording is over ' + CFG.maxFileMB + ' MB — please record a shorter one.', true);
  if (FILES.length >= CFG.maxFiles) return toast('You can attach up to ' + CFG.maxFiles + ' files.', true);
  FILES.push({ file: file, progress: 0, state: 'ready', note: kind, secs: secs, url: URL.createObjectURL(file) });
  renderFiles();
  toast((kind === 'audio' ? 'Voice note' : 'Video') + ' added — it’s sent with your request');
}

function showLivePreview(stream) {
  var v = document.createElement('video');
  v.id = 'liveCam'; v.muted = true; v.autoplay = true; v.setAttribute('playsinline', '');
  v.srcObject = stream;
  $('#recBar').insertAdjacentElement('afterend', v);
}

/* ---------- recorder window (used when the portal's frame can't use the mic) ---------- */
var POPREC = null;

function openRecorderWindow(kind) {
  var w = null;
  try { w = window.open('', 'rosierRecorder', 'popup=yes,width=420,height=' + (kind === 'video' ? 640 : 480)); } catch (e) { w = null; }
  if (!w) return toast('Your browser stopped the recorder from opening. Allow pop-ups for this page (icon at the right of the address bar), then tap ' + (kind === 'audio' ? 'Voice note' : 'Video') + ' again.', true);
  var cs = getComputedStyle(document.documentElement);
  var opts = {
    kind: kind, max: REC_MAX[kind], types: kind === 'audio' ? ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'] : ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'],
    accent: (cs.getPropertyValue('--accent') || '#a56312').trim(), bg: (cs.getPropertyValue('--bg') || '#f6f5f2').trim(), text: (cs.getPropertyValue('--text') || '#1f1d1a').trim()
  };
  POPREC = { kind: kind, win: w };
  window.__rosierRec = {
    done: function (buf, type, k, secs) {
      var bytes = new Uint8Array(buf).slice(0);   // copy now: the recorder window is about to close
      addRecording([bytes], type, k, secs);
      popClosed();
    },
    cancel: function () { toast('Recording discarded'); popClosed(); }
  };
  var d = w.document;
  d.open();
  d.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + (kind === 'audio' ? 'Voice note' : 'Video note') + ' — Rosier</title></head><body class="ask"></body>' +
    '<script>(' + recorderMain.toString() + ')(' + JSON.stringify(opts) + ');<\/script></html>');
  d.close();
  $('#micBtn').disabled = $('#camBtn').disabled = true;
  $('#recLabel').textContent = 'Recording in the small window — tap ✓ there when you finish';
  $('#recTime').textContent = '';
  $('#recStop').classList.add('hidden');
  $('#recBar').classList.remove('hidden');
  POPREC.watch = setInterval(function () { if (!POPREC || POPREC.win.closed) popClosed(); }, 500);
}

function popClosed() {
  if (!POPREC) return;
  clearInterval(POPREC.watch);
  try { if (!POPREC.win.closed) POPREC.win.close(); } catch (e) { }
  POPREC = null;
  $('#recBar').classList.add('hidden');
  $('#recStop').classList.remove('hidden');
  $('#micBtn').disabled = $('#camBtn').disabled = false;
}

/**
 * Runs inside the recorder window (its source is written into it). Asks for the mic/camera
 * straight away, records, and hands the recording back to the form on ✓.
 */
function recorderMain(o) {
  var audio = o.kind === 'audio', dev = audio ? 'microphone' : 'camera and microphone';
  var stream = null, rec = null, chunks = [], started = 0, timer = null, finishing = false;
  document.head.insertAdjacentHTML('beforeend', '<style>' +
    '*{box-sizing:border-box}html,body{height:100%;margin:0}' +
    'body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:' + o.bg + ';color:' + o.text + ';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;text-align:center}' +
    'h1{font-size:17px;margin:0;font-weight:600}' +
    '#msg{max-width:340px;color:#5d5850;font-size:14px;margin:0}' +
    '#big{width:116px;height:116px;border-radius:50%;background:#e53935;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(229,57,53,.45)}' +
    '#big svg{width:48px;height:48px;color:#fff}' +
    'body.rec #big{animation:pulse 1.4s infinite}body.ask #big,body.blocked #big{background:#c9c3b8}' +
    '@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,53,.45)}70%{box-shadow:0 0 0 26px rgba(229,57,53,0)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}' +
    '#time{font-size:30px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.5px}' +
    '#prev{width:100%;max-width:360px;border-radius:14px;background:#000;transform:scaleX(-1);display:none}body.rec #prev.on{display:block}' +
    '.row{display:flex;gap:14px;align-items:center}' +
    'button{font:inherit;border:0;border-radius:99px;cursor:pointer;padding:12px 20px;font-weight:600}' +
    '#cancel{background:#fff;border:1px solid #d6d1c6;color:' + o.text + '}' +
    '#done{background:' + o.accent + ';color:#fff;width:64px;height:64px;padding:0;font-size:28px}' +
    '#retry{background:' + o.accent + ';color:#fff}' +
    'body:not(.rec) #done,body:not(.rec) #time,body:not(.blocked) #retry,body:not(.blocked) #help{display:none}' +
    'body.rec #big.vid{display:none}' +
    '#help{max-width:340px;text-align:left;background:#fff;border:1px solid #e7e4dd;border-radius:12px;padding:12px 14px;font-size:13px;color:#3a3631}#help ol{margin:6px 0 0;padding-left:18px}' +
    '</style>');
  var micSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>';
  var camSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>';
  document.body.innerHTML =
    '<h1>' + (audio ? 'Voice note' : 'Video note') + '</h1>' +
    '<div id="big"' + (audio ? '' : ' class="vid"') + '>' + (audio ? micSvg : camSvg) + '</div>' +
    '<video id="prev" muted autoplay playsinline' + (audio ? '' : ' class="on"') + '></video>' +
    '<div id="time">0:00</div>' +
    '<p id="msg"></p>' +
    '<div id="help"><b>To allow it:</b><ol><li>Click the lock / tune icon at the left of the address bar (on a phone: ⋮ → Settings → Site settings).</li>' +
    '<li>Set <b>' + (audio ? 'Microphone' : 'Camera and Microphone') + '</b> to <b>Allow</b>.</li><li>Tap <b>Try again</b>.</li></ol></div>' +
    '<div class="row"><button id="cancel" type="button">✕ Cancel</button><button id="done" type="button" title="Done — add to my request">✓</button><button id="retry" type="button">Try again</button></div>';
  var $ = function (id) { return document.getElementById(id); };
  function state(s, msg) { document.body.className = s; $('msg').textContent = msg; }
  function fmt(n) { n = Math.max(0, Math.round(n)); return Math.floor(n / 60) + ':' + ('0' + (n % 60)).slice(-2); }
  function stopTracks() { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  function pick() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    for (var i = 0; i < o.types.length; i++) if (MediaRecorder.isTypeSupported(o.types[i])) return o.types[i];
    return '';
  }
  function start() {
    state('ask', 'Your browser will ask to use your ' + dev + ' — tap “Allow”. Recording starts straight away.');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      return state('blocked', 'This browser can’t record. Please use the latest Chrome, Edge or Safari.');
    }
    var cons = audio ? { audio: { echoCancellation: true, noiseSuppression: true } } :
      { audio: true, video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } };
    navigator.mediaDevices.getUserMedia(cons).then(function (s) {
      stream = s; chunks = [];
      var type = pick();
      rec = new MediaRecorder(s, Object.assign(type ? { mimeType: type } : {}, audio ? { audioBitsPerSecond: 48000 } : { videoBitsPerSecond: 800000, audioBitsPerSecond: 64000 }));
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.start(1000);
      started = Date.now();
      if (!audio) { $('prev').srcObject = s; }
      state('rec', audio ? 'Recording… speak now. Tap ✓ when you’re done.' : 'Recording… Tap ✓ when you’re done.');
      timer = setInterval(function () {
        var secs = (Date.now() - started) / 1000;
        $('time').textContent = fmt(secs) + ' / ' + fmt(o.max);
        if (secs >= o.max) finish();
      }, 250);
    }).catch(function (err) {
      var n = err && err.name;
      if (n === 'NotFoundError' || n === 'OverconstrainedError') return state('blocked', 'No ' + (audio ? 'microphone' : 'camera') + ' found on this device. Plug one in, then tap Try again.');
      if (n === 'NotReadableError') return state('blocked', 'Another app is using your ' + (audio ? 'microphone' : 'camera') + '. Close it, then tap Try again.');
      state('blocked', 'Your browser is blocking the ' + dev + '.');
    });
  }
  function finish() {
    if (finishing || !rec) return;
    finishing = true;
    clearInterval(timer);
    var secs = (Date.now() - started) / 1000;
    rec.onstop = function () {
      stopTracks();
      var type = rec.mimeType || (chunks[0] && chunks[0].type) || (audio ? 'audio/webm' : 'video/webm');
      var blob = new Blob(chunks, { type: type });
      state('ask', 'Adding it to your request…');
      var fr = new FileReader();
      fr.onload = function () {
        try { window.opener.__rosierRec.done(fr.result, type, o.kind, secs); }
        catch (e) { finishing = false; return state('blocked', 'The request form was closed, so the recording couldn’t be added. Open the form again and record there.'); }
        window.close();
      };
      fr.readAsArrayBuffer(blob);
    };
    try { rec.state !== 'inactive' ? rec.stop() : rec.onstop(); } catch (e) { rec.onstop(); }
  }
  function cancel() {
    clearInterval(timer);
    if (rec) { rec.onstop = null; try { if (rec.state !== 'inactive') rec.stop(); } catch (e) { } }
    stopTracks();
    try { window.opener.__rosierRec.cancel(); } catch (e) { }
    window.close();
  }
  $('done').onclick = finish;
  $('cancel').onclick = cancel;
  $('retry').onclick = start;
  window.addEventListener('pagehide', stopTracks);
  start();
}

function addFiles(list) {
  Array.prototype.forEach.call(list, function (f) {
    if (FILES.length >= CFG.maxFiles) return toast('You can attach up to ' + CFG.maxFiles + ' files.', true);
    var e = ext(f.name).toLowerCase();
    if (CFG.extensions.indexOf(e) === -1) return toast(f.name + ': this file type can’t be attached.', true);
    if (f.size > CFG.maxFileMB * 1048576) return toast(f.name + ' is larger than ' + CFG.maxFileMB + ' MB.', true);
    if (!f.size) return toast(f.name + ' is empty.', true);
    FILES.push({ file: f, progress: 0, state: 'ready' });
  });
  renderFiles();
}

function renderFiles() {
  $('#fileList').innerHTML = FILES.map(function (x, i) {
    if (x.note) return '<div class="note-row"><div class="note-top"><span class="grow small">' + (x.note === 'audio' ? icon('mic') + ' <b>Voice note</b>' : icon('video') + ' <b>Video</b>') +
        ' · ' + fmtSecs(x.secs) + ' <span class="faint">· ' + fileSize(x.file.size) + '</span></span>' +
      (x.state === 'ready' ? '<button type="button" class="btn ghost sm" data-rm="' + i + '">Delete</button>' :
        x.state === 'done' ? '<span class="badge s-approved">Sent</span>' :
        x.state === 'error' ? '<span class="badge s-changes-requested">Failed</span>' : '<span style="width:90px">' + progressBar(x.progress * 100) + '</span>') + '</div>' +
      (x.note === 'audio' ? '<audio controls preload="metadata" src="' + x.url + '"></audio>' : '<video controls playsinline preload="metadata" src="' + x.url + '"></video>') + '</div>';
    return '<div class="file-row"><span class="thumb" style="width:30px;height:30px">' + ext(x.file.name) + '</span>' +
      '<span class="grow ellipsis">' + h(x.file.name) + ' <span class="faint">· ' + fileSize(x.file.size) + '</span></span>' +
      (x.state === 'ready' ? '<button type="button" class="btn ghost sm" data-rm="' + i + '">Remove</button>' :
        x.state === 'done' ? '<span class="badge s-approved">Attached</span>' :
        x.state === 'error' ? '<span class="badge s-changes-requested">Failed</span>' : progressBar(x.progress * 100)) + '</div>';
  }).join('');
  $all('[data-rm]').forEach(function (b) { b.onclick = function () { FILES.splice(Number(b.getAttribute('data-rm')), 1); renderFiles(); }; });
}

function collect() {
  var d = {};
  $all('#f [name]').forEach(function (el) { d[el.name] = el.value.trim(); });
  if (d.campaignId === '__new') d.campaignId = ''; else d.campaign = '';
  d.mediaNotes = mediaNoteCount();
  return d;
}

function validate(d) {
  var ok = true;
  $all('[data-f]').forEach(function (x) { x.classList.remove('bad'); var e = $('.err', x); if (e) e.classList.add('hidden'); });
  function bad(key, msg) {
    ok = false;
    var x = $('[data-f="' + key + '"]'); if (!x) return;
    x.classList.add('bad'); var e = $('.err', x); e.textContent = msg; e.classList.remove('hidden');
  }
  if (!d.requesterName) bad('from', 'Add your name.');
  else if (!d.email && CFG.allowedDomain) bad('from', 'Add your @' + CFG.allowedDomain + ' email.');
  else if (d.email && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(d.email)) bad('from', 'That email doesn’t look right.');
  else if (CFG.allowedDomain && d.email && d.email.toLowerCase().split('@')[1] !== CFG.allowedDomain.toLowerCase() && !BOOT.email) bad('from', 'Please use your @' + CFG.allowedDomain + ' email.');
  if (!d.department) bad('department', 'Choose your department.');
  if (!d.preferredDate) bad('deadline', 'When do you need it?');
  else if (d.preferredDate < todayIso()) bad('deadline', 'Pick today or a later date.');
  else if (d.preferredTime && new Date(d.preferredDate + 'T' + d.preferredTime) < new Date()) bad('deadline', 'That time has already passed.');
  var q = Number(d.quantity);
  if (!q || q < 1 || q > 50 || Math.floor(q) !== q) bad('quantity', 'Between 1 and 50.');
  if (!d.brief && !mediaNoteCount()) bad('brief', 'Tell us what you need — type it, or record a voice note.');
  return ok;
}

function submit(e) {
  e.preventDefault();
  fieldErrors(document, '');
  var d = collect();
  if (!validate(d)) { var f = $('.bad'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  var btn = $('#submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:15px;height:15px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></span> Sending…';
  var result;
  api('api_submitRequirement', d).then(function (r) {
    result = r;
    // Up to 3 files upload at the same time.
    return runPool(FILES, 3, function (x) {
      x.state = 'uploading'; renderFiles();
      return uploadFile(x.file, { kind: 'reference', ticket: r.uploadTicket }, function (p) { x.progress = p; renderFiles(); })
        .then(function () { x.state = 'done'; renderFiles(); }, function (err) { x.state = 'error'; x.error = errMsg(err); renderFiles(); });
    }).then(function () { return api('api_finalizeRequirement', r.uploadTicket); });
  }).then(function () {
    addTrack(result.trackToken);
    showDone(result.requirementId, FILES.filter(function (x) { return x.state === 'error'; }));
  }).catch(function (err) {
    if (result) addTrack(result.trackToken);
    if (result) return showDone(result.requirementId, FILES.filter(function (x) { return x.state !== 'done'; }));
    btn.disabled = false; btn.innerHTML = icon('send') + ' Send request';
    fieldErrors(document, errMsg(err));
  });
}

function showDone(id, failed) {
  window.scrollTo(0, 0);
  $('#main').innerHTML = '<div class="card done"><div class="tick">' + icon('check') + '</div>' +
    '<h1>Request sent</h1><p class="muted">The graphics team has it. Your reference ID:</p>' +
    '<div class="ref-id">' + h(id) + '</div>' +
    '<p class="muted">You’ll get an email copy now, and a link to approve the creative when it’s ready.<br>Track it any time under <b>My requests</b>.</p>' +
    (failed.length ? '<div class="alert warn" style="text-align:left;margin-top:16px">These files didn’t attach: ' + failed.map(function (x) { return h(x.file.name); }).join(', ') +
      '. Your request is saved — reply to the confirmation email with them.</div>' : '') +
    '<div class="row wrap" style="justify-content:center;margin-top:20px"><button class="btn primary" id="toMy">See my requests</button><button class="btn" id="again">Send another request</button>' +
    (BOOT.backUrl ? '<a class="btn primary" href="' + h(BOOT.backUrl) + '" target="_top">Back to dashboard</a>' : '') + '</div></div>';
  $('#again').onclick = function () { FILES = []; renderForm(); window.scrollTo(0, 0); };
  $('#toMy').onclick = function () { showTab('my'); };
}
</script>
</body>
</html>
