<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include_('Styles') ?>
<style>
  body { background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  .intro { margin-bottom: 18px; }
  .intro h1 { font-size: 24px; margin-bottom: 4px; }
  .mail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .mail-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 600; }
  .mail-head .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .mrow { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .mrow > .mlabel { color: var(--text-3); font-size: 13px; }
  .mrow input, .mrow select { border-color: transparent; background: transparent; padding-left: 0; }
  .mrow input:focus, .mrow select:focus { box-shadow: none; border-color: transparent; }
  .mrow.split { grid-template-columns: 120px 1fr 1fr; }
  .mrow.bad { background: var(--bad-soft); }
  .mrow .err, .mbody .err { font-size: 12px; color: var(--bad); grid-column: 2 / -1; }
  .mbody { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .mbody textarea { border: 0; padding: 0; min-height: 180px; font-size: 15px; box-shadow: none !important; }
  .mbody.bad { background: var(--bad-soft); }
  .attach { padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
  .attach .links { min-height: 44px; font-size: 13px; }
  .attach-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .attach-bar .faint { font-size: 12px; }
  .send-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: var(--surface-2); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .hp { position: absolute; left: -5000px; }
  .drop-hint { border: 1.5px dashed transparent; border-radius: 8px; }
  .mail.dragging .drop-hint { border-color: var(--accent); background: var(--accent-soft); }
  .done { text-align: center; padding: 44px 24px; }
  .done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 14px; }
  .done .tick svg { width: 28px; height: 28px; }
  .ref-id { display: inline-block; font-size: 22px; font-weight: 600; padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
  .tabs-top { display: flex; gap: 4px; margin-bottom: 18px; background: var(--muted-soft); padding: 4px; border-radius: 10px; width: fit-content; }
  .tabs-top button { border: 0; background: none; padding: 8px 16px; border-radius: 7px; font: 500 13.5px var(--font); color: var(--text-2); cursor: pointer; }
  .tabs-top button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .req-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  .req-card + .req-card { margin-top: 12px; }
  .req-card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .req-card h3 { font-size: 15.5px; margin: 0 0 2px; }
  .req-card .meta { font-size: 12.5px; color: var(--text-3); }
  .req-card .brief { font-size: 13px; color: var(--text-2); margin: 8px 0 0; white-space: pre-line; }
  .req-card .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .gal-h { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .cr { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; }
  .cr .ph { aspect-ratio: 1 / 1; display: grid; place-items: center; background: var(--surface-2) center / cover no-repeat; cursor: zoom-in; border: 0; padding: 0; width: 100%;
    font: 600 12px/1 inherit; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .cr .info { padding: 7px 9px 8px; background: var(--surface); }
  .cr .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr .s { font-size: 11px; color: var(--text-3); display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-top: 2px; }
  .cr .s.ok { color: var(--ok); }
  .cr .dl { border: 0; background: none; padding: 2px; color: var(--accent); cursor: pointer; display: inline-flex; }
  .cr .dl svg { width: 16px; height: 16px; }
  .st-received, .st-on-hold { background: var(--muted-soft); color: var(--text-2); }
  .st-waiting-for-your-input { background: var(--warn-soft); color: #7a4f00; }
  .st-in-progress { background: var(--accent-soft); color: var(--accent-ink); }
  .st-ready-for-your-review { background: var(--warn-soft); color: var(--warn); }
  .st-being-revised { background: var(--info-soft); color: var(--info); }
  .st-completed { background: var(--ok-soft); color: var(--ok); }
  .st-cancelled { background: var(--muted-soft); color: var(--text-3); }
  @media (max-width: 600px) {
    .mrow, .mrow.split { grid-template-columns: 1fr; gap: 2px; }
    .mrow.split > .mlabel { margin-top: 4px; }
  }
</style>
</head>
<body>
<main>
  <div class="tabs-top" role="tablist"><button data-tab="new" class="on" role="tab">New request</button><button data-tab="my" role="tab">My requests</button></div>
  <div id="main"><div class="loading-page"><span class="spinner"></span> Loading…</div></div>
</main>

<?!= include_('Common.js') ?>
<script>
var BOOT = <?!= bootJson ?>;
var CFG = null, FILES = [];

/* ---- tracking link: from the URL, else remembered on this device ---- */
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
// Every request sent from this device is remembered (several, also without an email).
var TRACKS = [];
try { TRACKS = JSON.parse(store('gfxTracks') || '[]') || []; } catch (e) { TRACKS = []; }
if (store('gfxTrack') && TRACKS.indexOf(store('gfxTrack')) === -1) TRACKS.push(store('gfxTrack'));
if (BOOT.track && TRACKS.indexOf(BOOT.track) === -1) TRACKS.unshift(BOOT.track);
function saveTracks() { TRACKS = TRACKS.slice(0, 30); store('gfxTracks', JSON.stringify(TRACKS)); store('gfxTrack', null); }
function addTrack(t) { if (t && TRACKS.indexOf(t) === -1) { TRACKS.unshift(t); saveTracks(); } }
saveTracks();

$all('.tabs-top button').forEach(function (b) { b.onclick = function () { showTab(b.getAttribute('data-tab')); }; });
function showTab(tab) {
  $all('.tabs-top button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  if (tab === 'my') return renderMy();
  if (!CFG) return;
  renderForm();
}

api('api_getFormConfig').then(function (cfg) { CFG = cfg; showTab(BOOT.tab === 'my' ? 'my' : 'new'); })
  .catch(function (e) { $('#main').innerHTML = '<div class="alert bad">' + h(errMsg(e)) + '</div>'; });

/* ---- My requests ---- */
function renderMy() {
  var el = $('#main');
  if (!TRACKS.length) return renderAskEmail();
  el.innerHTML = '<div class="loading-page"><span class="spinner"></span> Loading your requests…</div>';
  api('api_getMyRequests', TRACKS).then(function (d) {
    var list = d.requests;
    el.innerHTML = '<div class="intro"><h1>My requests</h1><p class="muted">' +
      (d.email ? 'Requests from <b>' + h(d.email) + '</b>' : 'Requests sent from this device') + '. ' +
      '<a href="#" id="forget">Not you? Clear this device</a>' + (d.email ? '' : ' · <a href="#" id="byEmail">Find requests by email</a>') + '</p></div>' +
      (list.length ? list.map(reqCard).join('') :
        '<div class="card"><div class="empty">' + icon('inbox') + '<b>No requests yet</b><span>Anything you send will show up here.</span></div></div>');
    $('#forget').onclick = function (e) { e.preventDefault(); TRACKS = []; saveTracks(); renderMy(); };
    if ($('#byEmail')) $('#byEmail').onclick = function (e) { e.preventDefault(); renderAskEmail(); };
    $all('[data-review]', el).forEach(function (b) {
      b.onclick = function () {
        var w = null; try { w = window.open('', '_blank'); } catch (x) { w = null; }
        b.disabled = true;
        api('api_trackReview', TRACKS, b.getAttribute('data-review')).then(function (r) {
          if (w) w.location = r.url;
          else b.outerHTML = '<a class="btn primary sm" href="' + h(r.url) + '" target="_blank" rel="noopener">Open review ↗</a>';
          b.disabled = false;
        }).catch(function (e) { if (w) w.close(); toast(errMsg(e), true); b.disabled = false; renderMy(); });
      };
    });
    wireCreatives(el);
    $all('[data-sendinfo]', el).forEach(function (b) {
      b.onclick = function () {
        var w = null; try { w = window.open('', '_blank'); } catch (x) { w = null; }
        b.disabled = true;
        api('api_trackShareLink', TRACKS, b.getAttribute('data-sendinfo')).then(function (r) {
          if (w) w.location = r.url; else location.href = r.url;
          b.disabled = false;
        }).catch(function (e) { if (w) w.close(); toast(errMsg(e), true); b.disabled = false; });
      };
    });
    $all('[data-askchg]', el).forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-askchg');
        modal({ title: 'What needs to change?', body: '<p class="muted" style="margin-top:0">We’ll send this to the graphics team lead, who will reopen the request.</p><div class="field"><textarea id="akM" rows="4" maxlength="3000" placeholder="e.g. Change the MRP to ₹899"></textarea></div><div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Send', cls: 'primary', onClick: function (close, m) {
            var v = $('#akM', m).value.trim();
            if (v.length < 5) return fieldErrors(m, 'Describe what needs to change.');
            return api('api_trackAskChanges', TRACKS, id, v).then(function (r) { close(); toast(r.message); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
          } }] });
      };
    });
    $all('[data-approveall]', el).forEach(function (b) {
      b.onclick = function () {
        var ids = b.getAttribute('data-approveall').split(',');
        modal({ title: 'Approve all ' + ids.length + ' creatives?', body: '<p class="muted">Only do this if you’ve looked at every one — tap the previews to check them. To ask for changes on any creative, use its own Review button instead.</p><div class="alert bad hidden" data-form-error></div>',
          actions: [{ label: 'Cancel' }, { label: 'Approve all ' + ids.length, cls: 'ok', onClick: function (close, m) {
            return api('api_trackApproveMany', TRACKS, ids).then(function (r) {
              close(); toast('Approved ' + r.approved + ' creative' + (r.approved === 1 ? '' : 's') + (r.skipped.length ? ' · ' + r.skipped.length + ' already decided' : '')); renderMy();
            }).catch(function (e) { fieldErrors(m, errMsg(e)); });
          } }] });
      };
    });
  }).catch(function (e) {
    if (e.code === 'LINK_INVALID' || e.code === 'LINK_EXPIRED') { TRACKS = []; saveTracks(); return renderAskEmail(errMsg(e)); }
    el.innerHTML = '<div class="alert bad">' + h(errMsg(e)) + '</div>';
  });
}

/** Thumbnails, full-size view and download for the requester's creatives. */
function wireCreatives(el) {
  var ids = $all('[data-view]', el).map(function (b) { return b.getAttribute('data-view'); });
  for (var i = 0; i < ids.length; i += 24) {
    (function (batch) {
      api('api_trackThumbs', TRACKS, batch).then(function (m) {
        batch.forEach(function (id) {
          var b = $('[data-view="' + id + '"]', el);
          if (b && m[id]) { b.style.backgroundImage = 'url("' + m[id] + '")'; b.textContent = ''; }
        });
      }).catch(function () { /* thumbnails are optional */ });
    })(ids.slice(i, i + 24));
  }
  // Tap any creative: a gallery of all of them (arrows / swipe), with Approve / Request changes below the image.
  var views = $all('[data-view]', el);
  views.forEach(function (b, idx) {
    b.onclick = function () {
      var items = views.map(function (v) {
        var id = v.getAttribute('data-view'), st = v.getAttribute('data-state');
        return {
          id: id, title: v.getAttribute('data-title'), sub: v.getAttribute('data-sub'), status: st,
          canDecide: st === 'Waiting for your review',
          load: function () { return api('api_trackFile', TRACKS, id, 'preview'); },
          download: $('[data-dl="' + id + '"]', el) ? function () { return api('api_trackFile', TRACKS, id, 'original'); } : null
        };
      });
      gallery(items, {
        start: idx,
        decide: function (it, decision, comment) { return api('api_trackDecide', TRACKS, it.id, decision, comment); },
        onClose: function (changed) { if (changed) renderMy(); }
      });
    };
  });
  $all('[data-dl]', el).forEach(function (b) {
    b.onclick = function () {
      b.disabled = true; toast('Preparing download…');
      api('api_trackFile', TRACKS, b.getAttribute('data-dl'), 'original').then(function (f) {
        downloadBase64(f.fileName, f.mimeType, f.base64);
      }).catch(function (e) { toast(errMsg(e), true); }).then(function () { b.disabled = false; });
    };
  });
}

function reqCard(r) {
  var st = '<span class="badge st-' + slug(r.status) + '">' + h(r.status) + '</span>';
  var progress = r.required ? '<div class="row" style="margin-top:10px"><div class="grow">' + progressBar(r.approved / r.required * 100, r.status === 'Completed') +
    '</div><span class="faint small">' + r.approved + ' of ' + r.required + ' approved</span></div>' : '';
  var all = r.awaiting.length > 1 ? '<button class="btn ok sm" data-approveall="' + h(r.awaiting.map(function (a) { return a.versionId; }).join(',')) + '">' + icon('check') + ' Approve all ' + r.awaiting.length + '</button>' : '';
  var acts = r.awaiting.map(function (a) {
    return '<button class="btn primary sm" data-review="' + h(a.versionId) + '">' + icon('check') + ' Review ' + h(a.title) + ' ' + h(a.version) + '</button>';
  }).concat(r.finalLinks.map(function (u, i) {
    return '<a class="btn ok sm" href="' + h(u) + '" target="_blank" rel="noopener">' + icon('download') + ' Download final files' + (r.finalLinks.length > 1 ? ' ' + (i + 1) : '') + '</a>';
  })).join('');
  acts = (r.hold ? '<button class="btn primary sm" data-sendinfo="' + h(r.requirementId) + '">' + icon('send') + ' Send the details</button>' : '') + all + acts +
    (r.status === 'Completed' ? '<button class="btn sm" data-askchg="' + h(r.requirementId) + '">Need changes?</button>' : '');
  var cr = r.creatives || [];
  var galleryHtml = cr.length ? '<div class="gal-h"><span>Creatives (' + cr.length + ')</span><span class="faint small">Tap to view' + (cr.some(function (c) { return c.canDownload; }) ? ' · download approved ones' : '') + '</span></div>' +
    '<div class="gallery">' + cr.map(function (c) {
      return '<div class="cr"><button class="ph" data-view="' + h(c.versionId) + '" data-title="' + h(c.title + ' · ' + c.version) + '" data-state="' + h(c.state) + '" data-sub="' + h(r.title + ' · ' + r.requirementId) + '" data-img="' + (c.isImage ? '1' : '') + '" aria-label="View ' + h(c.title) + '">' + h(c.ext || 'file') + '</button>' +
        '<div class="info"><div class="t" title="' + h(c.title) + '">' + (c.isFinal ? '★ ' : '') + h(c.title) + '</div><div class="s' + (c.state === 'Approved' ? ' ok' : '') + '"><span>' + h(c.version) + ' · ' + h(c.state) + '</span>' +
        (c.canDownload ? '<button class="dl" data-dl="' + h(c.versionId) + '" title="Download" aria-label="Download ' + h(c.title) + '">' + icon('download') + '</button>' : '') + '</div></div></div>';
    }).join('') + '</div>' : '';
  return '<div class="req-card"><div class="top"><div><h3>' + h(r.title) + '</h3><div class="meta">' + h(r.requirementId) + ' · sent ' + fmtDate(r.submittedAt) +
    ' · needed by ' + fmtDue(r.deadlineDate, r.deadlineTime) + ' · ' + h(r.quantity) + ' creative(s)</div></div>' + st + '</div>' +
    (r.hold ? '<div class="alert warn" style="margin-top:12px"><b>We need something from you' + (r.hold.dept ? ' (' + h(r.hold.dept) + ')' : '') + '</b><div class="pre" style="margin-top:4px">' + h(r.hold.reason) +
      '</div><div class="small" style="margin-top:6px">The design is ready to see below. The work is paused until we get this.</div></div>' : '') +
    (r.reopened ? '<div class="alert info" style="margin-top:12px">Reopened for changes — the ★ final files stay available until the new ones are approved.</div>' : '') +
    progress + galleryHtml + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
}

function renderAskEmail(msg) {
  $('#main').innerHTML = '<div class="intro"><h1>My requests</h1><p class="muted">We’ll email you a private link to see all your requests and their status.</p></div>' +
    (msg ? '<div class="alert warn" style="margin-bottom:12px">' + h(msg) + '</div>' : '') +
    '<form class="card" id="askF"><div class="card-b stack"><div class="field"><label for="askE">Your email</label>' +
    '<input type="email" id="askE" placeholder="you@email.com" autocomplete="email" value="' + h(BOOT.email || '') + '"></div>' +
    '<div><button class="btn primary" id="askB">' + icon('send') + ' Email me my link</button></div><div id="askOut"></div></div></form>';
  $('#askF').onsubmit = function (e) {
    e.preventDefault();
    var v = $('#askE').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) return toast('Enter a valid email.', true);
    $('#askB').disabled = true;
    api('api_sendTrackLink', v).then(function (r) { $('#askOut').innerHTML = '<div class="alert ok">' + h(r.message) + '</div>'; })
      .catch(function (err) { toast(errMsg(err), true); }).then(function () { $('#askB').disabled = false; });
  };
}

var FORM_OPENED = Date.now();
function renderForm() {
  FORM_OPENED = Date.now();
  var minDate = todayIso();
  $('#main').innerHTML =
    '<div class="intro"><h1>Request a creative</h1><p class="muted">Write to the graphics team like you’d write an email. We’ll confirm with a reference ID.' +
    (BOOT.backUrl ? ' <a href="' + h(BOOT.backUrl) + '" target="_top">Back to dashboard</a>' : '') + '</p></div>' +
    '<form id="f" novalidate autocomplete="on"><div class="mail" id="mail">' +
    '<div class="hp" aria-hidden="true"><input type="text" name="gfx_trap_9" tabindex="-1" autocomplete="off" data-lpignore="true" data-1p-ignore></div>' +
    '<div class="mail-head"><span class="mark">' + h((CFG.companyName || 'G').charAt(0)) + '</span>To: ' + h(CFG.companyName) + ' Graphics Team</div>' +

    '<div class="mrow split" data-f="from"><span class="mlabel">From</span>' +
    '<input type="text" id="requesterName" name="requesterName" maxlength="100" placeholder="Your name" autocomplete="name" aria-label="Your name">' +
    '<input type="email" id="email" name="email" maxlength="254" placeholder="' + (CFG.allowedDomain ? 'you@' + h(CFG.allowedDomain) : 'Email (optional, for updates)') + '" autocomplete="email" aria-label="Your email">' +
    '<span class="err hidden"></span></div>' +

    '<div class="mrow" data-f="department"><label class="mlabel" for="department">Department</label>' +
    '<select id="department" name="department"><option value="">Choose your team…</option>' +
    CFG.departments.map(function (d) { return '<option>' + h(d) + '</option>'; }).join('') + '</select><span class="err hidden"></span></div>' +

    '<div class="mrow split" data-f="deadline"><span class="mlabel">Needed by</span>' +
    '<input type="date" id="preferredDate" name="preferredDate" min="' + minDate + '" aria-label="Deadline date">' +
    '<input type="time" id="preferredTime" name="preferredTime" step="900" aria-label="Deadline time (optional)" title="Optional time">' +
    '<span class="err hidden"></span></div>' +

    '<div class="mrow" data-f="quantity"><label class="mlabel" for="quantity">No. of creatives</label>' +
    '<input type="number" id="quantity" name="quantity" min="1" max="50" value="1" style="max-width:120px"><span class="err hidden"></span></div>' +

    '<div class="mbody" data-f="brief"><label class="sr-only" for="brief">Requirement</label>' +
    '<textarea id="brief" name="brief" maxlength="8000" placeholder="What do you need?\n\nFor example:\nDiwali sale banner for the website homepage, size 1600 × 1200.\nText: “Flat 20% off on A2 Ghee — this week only”"></textarea>' +
    '<span class="err hidden"></span></div>' +

    '<div class="attach drop-hint" id="drop">' +
    '<textarea class="links" id="referenceUrls" name="referenceUrls" rows="2" placeholder="Reference links (optional) — one per line"></textarea>' +
    '<div class="attach-bar"><button type="button" class="btn sm" id="attachBtn">' + icon('upload') + ' Attach files</button>' +
    '<span class="faint">Optional · up to ' + CFG.maxFiles + ' files, ' + CFG.maxFileMB + ' MB each · or drop them here</span></div>' +
    '<input type="file" id="fileIn" multiple class="hidden"><div id="fileList" class="stack" style="gap:6px"></div></div>' +

    '<div class="send-bar"><span class="faint small">Leave the time empty if any time that day works. Add your email to get the review link by mail.</span>' +
    '<button type="submit" class="btn primary lg" id="submitBtn">' + icon('send') + ' Send request</button></div>' +
    '</div><div class="alert bad hidden" data-form-error style="margin-top:12px"></div></form>';

  if (BOOT.email) { $('#requesterName').value = BOOT.name || ''; $('#email').value = BOOT.email; }
  var inp = $('#fileIn'), mail = $('#mail');
  $('#attachBtn').onclick = function () { inp.click(); };
  inp.onchange = function () { addFiles(inp.files); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(function (ev) { mail.addEventListener(ev, function (e) { e.preventDefault(); mail.classList.add('dragging'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { mail.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || !mail.contains(e.relatedTarget)) mail.classList.remove('dragging'); }); });
  mail.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  $('#f').onsubmit = submit;
}

function addFiles(list) {
  Array.prototype.forEach.call(list, function (f) {
    if (FILES.length >= CFG.maxFiles) return toast('You can attach up to ' + CFG.maxFiles + ' files.', true);
    var e = ext(f.name).toLowerCase();
    if (CFG.extensions.indexOf(e) === -1) return toast(f.name + ': this file type can’t be attached.', true);
    if (f.size > CFG.maxFileMB * 1048576) return toast(f.name + ' is larger than ' + CFG.maxFileMB + ' MB.', true);
    if (!f.size) return toast(f.name + ' is empty.', true);
    FILES.push({ file: f, progress: 0, state: 'ready' });
  });
  renderFiles();
}

function renderFiles() {
  $('#fileList').innerHTML = FILES.map(function (x, i) {
    return '<div class="file-row"><span class="thumb" style="width:30px;height:30px">' + ext(x.file.name) + '</span>' +
      '<span class="grow ellipsis">' + h(x.file.name) + ' <span class="faint">· ' + fileSize(x.file.size) + '</span></span>' +
      (x.state === 'ready' ? '<button type="button" class="btn ghost sm" data-rm="' + i + '">Remove</button>' :
        x.state === 'done' ? '<span class="badge s-approved">Attached</span>' :
        x.state === 'error' ? '<span class="badge s-changes-requested">Failed</span>' : progressBar(x.progress * 100)) + '</div>';
  }).join('');
  $all('[data-rm]').forEach(function (b) { b.onclick = function () { FILES.splice(Number(b.getAttribute('data-rm')), 1); renderFiles(); }; });
}

function collect() {
  var d = {};
  $all('#f [name]').forEach(function (el) { d[el.name] = el.value.trim(); });
  return d;
}

function validate(d) {
  var ok = true;
  $all('[data-f]').forEach(function (x) { x.classList.remove('bad'); var e = $('.err', x); if (e) e.classList.add('hidden'); });
  function bad(key, msg) {
    ok = false;
    var x = $('[data-f="' + key + '"]'); if (!x) return;
    x.classList.add('bad'); var e = $('.err', x); e.textContent = msg; e.classList.remove('hidden');
  }
  if (!d.requesterName) bad('from', 'Add your name.');
  else if (!d.email && CFG.allowedDomain) bad('from', 'Add your @' + CFG.allowedDomain + ' email.');
  else if (d.email && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(d.email)) bad('from', 'That email doesn’t look right.');
  else if (CFG.allowedDomain && d.email && d.email.toLowerCase().split('@')[1] !== CFG.allowedDomain.toLowerCase() && !BOOT.email) bad('from', 'Please use your @' + CFG.allowedDomain + ' email.');
  if (!d.department) bad('department', 'Choose your department.');
  if (!d.preferredDate) bad('deadline', 'When do you need it?');
  else if (d.preferredDate < todayIso()) bad('deadline', 'Pick today or a later date.');
  else if (d.preferredTime && new Date(d.preferredDate + 'T' + d.preferredTime) < new Date()) bad('deadline', 'That time has already passed.');
  var q = Number(d.quantity);
  if (!q || q < 1 || q > 50 || Math.floor(q) !== q) bad('quantity', 'Between 1 and 50.');
  if (!d.brief) bad('brief', 'Tell us what you need.');
  return ok;
}

function submit(e) {
  e.preventDefault();
  fieldErrors(document, '');
  var d = collect();
  if (!validate(d)) { var f = $('.bad'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  var btn = $('#submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:15px;height:15px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></span> Sending…';
  var result;
  api('api_submitRequirement', d).then(function (r) {
    result = r;
    // Up to 3 files upload at the same time.
    return runPool(FILES, 3, function (x) {
      x.state = 'uploading'; renderFiles();
      return uploadFile(x.file, { kind: 'reference', ticket: r.uploadTicket }, function (p) { x.progress = p; renderFiles(); })
        .then(function () { x.state = 'done'; renderFiles(); }, function (err) { x.state = 'error'; x.error = errMsg(err); renderFiles(); });
    }).then(function () { return api('api_finalizeRequirement', r.uploadTicket); });
  }).then(function () {
    addTrack(result.trackToken);
    showDone(result.requirementId, FILES.filter(function (x) { return x.state === 'error'; }));
  }).catch(function (err) {
    if (result) addTrack(result.trackToken);
    if (result) return showDone(result.requirementId, FILES.filter(function (x) { return x.state !== 'done'; }));
    btn.disabled = false; btn.innerHTML = icon('send') + ' Send request';
    fieldErrors(document, errMsg(err));
  });
}

function showDone(id, failed) {
  window.scrollTo(0, 0);
  $('#main').innerHTML = '<div class="card done"><div class="tick">' + icon('check') + '</div>' +
    '<h1>Request sent</h1><p class="muted">The graphics team has it. Your reference ID:</p>' +
    '<div class="ref-id">' + h(id) + '</div>' +
    '<p class="muted">You’ll get an email copy now, and a link to approve the creative when it’s ready.<br>Track it any time under <b>My requests</b>.</p>' +
    (failed.length ? '<div class="alert warn" style="text-align:left;margin-top:16px">These files didn’t attach: ' + failed.map(function (x) { return h(x.file.name); }).join(', ') +
      '. Your request is saved — reply to the confirmation email with them.</div>' : '') +
    '<div class="row wrap" style="justify-content:center;margin-top:20px"><button class="btn primary" id="toMy">See my requests</button><button class="btn" id="again">Send another request</button>' +
    (BOOT.backUrl ? '<a class="btn primary" href="' + h(BOOT.backUrl) + '" target="_top">Back to dashboard</a>' : '') + '</div></div>';
  $('#again').onclick = function () { FILES = []; renderForm(); window.scrollTo(0, 0); };
  $('#toMy').onclick = function () { showTab('my'); };
}
</script>
</body>
</html>
