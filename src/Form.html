<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include_('Styles') ?>
<style>
  body { background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  .intro { margin-bottom: 18px; }
  .intro h1 { font-size: 24px; margin-bottom: 4px; }
  .mail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .mail-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-weight: 600; }
  .mail-head .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .mrow { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .mrow > .mlabel { color: var(--text-3); font-size: 13px; }
  .mrow input, .mrow select { border-color: transparent; background: transparent; padding-left: 0; }
  .mrow input:focus, .mrow select:focus { box-shadow: none; border-color: transparent; }
  .mrow.split { grid-template-columns: 120px 1fr 1fr; }
  .mrow.bad { background: var(--bad-soft); }
  .mrow .err, .mbody .err { font-size: 12px; color: var(--bad); grid-column: 2 / -1; }
  .mbody { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .mbody textarea { border: 0; padding: 0; min-height: 180px; font-size: 15px; box-shadow: none !important; }
  .mbody.bad { background: var(--bad-soft); }
  .attach { padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
  .attach .links { min-height: 44px; font-size: 13px; }
  .attach-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .attach-bar .faint { font-size: 12px; }
  .send-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: var(--surface-2); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .hp { position: absolute; left: -5000px; }
  .drop-hint { border: 1.5px dashed transparent; border-radius: 8px; }
  .mail.dragging .drop-hint { border-color: var(--accent); background: var(--accent-soft); }
  .done { text-align: center; padding: 44px 24px; }
  .done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 14px; }
  .done .tick svg { width: 28px; height: 28px; }
  .ref-id { display: inline-block; font-size: 22px; font-weight: 600; padding: 8px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; margin: 12px 0; }
  @media (max-width: 600px) {
    .mrow, .mrow.split { grid-template-columns: 1fr; gap: 2px; }
    .mrow.split > .mlabel { margin-top: 4px; }
  }
</style>
</head>
<body>
<main id="main"><div class="loading-page"><span class="spinner"></span> Loading…</div></main>

<?!= include_('Common.js') ?>
<script>
var BOOT = <?!= bootJson ?>;
var CFG = null, FILES = [];

api('api_getFormConfig').then(function (cfg) { CFG = cfg; renderForm(); })
  .catch(function (e) { $('#main').innerHTML = '<div class="alert bad">' + h(errMsg(e)) + '</div>'; });

function renderForm() {
  var minDate = todayIso();
  $('#main').innerHTML =
    '<div class="intro"><h1>Request a creative</h1><p class="muted">Write to the graphics team like you’d write an email. We’ll confirm with a reference ID.' +
    (BOOT.backUrl ? ' <a href="' + h(BOOT.backUrl) + '" target="_top">Back to dashboard</a>' : '') + '</p></div>' +
    '<form id="f" novalidate autocomplete="on"><div class="mail" id="mail">' +
    '<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<div class="mail-head"><span class="mark">' + h((CFG.companyName || 'G').charAt(0)) + '</span>To: ' + h(CFG.companyName) + ' Graphics Team</div>' +

    '<div class="mrow split" data-f="from"><span class="mlabel">From</span>' +
    '<input type="text" id="requesterName" name="requesterName" maxlength="100" placeholder="Your name" autocomplete="name" aria-label="Your name">' +
    '<input type="email" id="email" name="email" maxlength="254" placeholder="your@email.com" autocomplete="email" aria-label="Your email">' +
    '<span class="err hidden"></span></div>' +

    '<div class="mrow" data-f="department"><label class="mlabel" for="department">Department</label>' +
    '<select id="department" name="department"><option value="">Choose your team…</option>' +
    CFG.departments.map(function (d) { return '<option>' + h(d) + '</option>'; }).join('') + '</select><span class="err hidden"></span></div>' +

    '<div class="mrow split" data-f="deadline"><span class="mlabel">Needed by</span>' +
    '<input type="date" id="preferredDate" name="preferredDate" min="' + minDate + '" aria-label="Deadline date">' +
    '<input type="time" id="preferredTime" name="preferredTime" step="900" aria-label="Deadline time (optional)" title="Optional time">' +
    '<span class="err hidden"></span></div>' +

    '<div class="mrow" data-f="quantity"><label class="mlabel" for="quantity">No. of creatives</label>' +
    '<input type="number" id="quantity" name="quantity" min="1" max="50" value="1" style="max-width:120px"><span class="err hidden"></span></div>' +

    '<div class="mbody" data-f="brief"><label class="sr-only" for="brief">Requirement</label>' +
    '<textarea id="brief" name="brief" maxlength="8000" placeholder="What do you need?\n\nFor example:\nDiwali sale banner for the website homepage, size 1600 × 1200.\nText: “Flat 20% off on A2 Ghee — this week only”"></textarea>' +
    '<span class="err hidden"></span></div>' +

    '<div class="attach drop-hint" id="drop">' +
    '<textarea class="links" id="referenceUrls" name="referenceUrls" rows="2" placeholder="Reference links (optional) — one per line"></textarea>' +
    '<div class="attach-bar"><button type="button" class="btn sm" id="attachBtn">' + icon('upload') + ' Attach files</button>' +
    '<span class="faint">Optional · up to ' + CFG.maxFiles + ' files, ' + CFG.maxFileMB + ' MB each · or drop them here</span></div>' +
    '<input type="file" id="fileIn" multiple class="hidden"><div id="fileList" class="stack" style="gap:6px"></div></div>' +

    '<div class="send-bar"><span class="faint small">Leave the time empty if any time that day works.</span>' +
    '<button type="submit" class="btn primary lg" id="submitBtn">' + icon('send') + ' Send request</button></div>' +
    '</div><div class="alert bad hidden" data-form-error style="margin-top:12px"></div></form>';

  if (BOOT.email) { $('#requesterName').value = BOOT.name || ''; $('#email').value = BOOT.email; }
  var inp = $('#fileIn'), mail = $('#mail');
  $('#attachBtn').onclick = function () { inp.click(); };
  inp.onchange = function () { addFiles(inp.files); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(function (ev) { mail.addEventListener(ev, function (e) { e.preventDefault(); mail.classList.add('dragging'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { mail.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || !mail.contains(e.relatedTarget)) mail.classList.remove('dragging'); }); });
  mail.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  $('#f').onsubmit = submit;
}

function addFiles(list) {
  Array.prototype.forEach.call(list, function (f) {
    if (FILES.length >= CFG.maxFiles) return toast('You can attach up to ' + CFG.maxFiles + ' files.', true);
    var e = ext(f.name).toLowerCase();
    if (CFG.extensions.indexOf(e) === -1) return toast(f.name + ': this file type can’t be attached.', true);
    if (f.size > CFG.maxFileMB * 1048576) return toast(f.name + ' is larger than ' + CFG.maxFileMB + ' MB.', true);
    if (!f.size) return toast(f.name + ' is empty.', true);
    FILES.push({ file: f, progress: 0, state: 'ready' });
  });
  renderFiles();
}

function renderFiles() {
  $('#fileList').innerHTML = FILES.map(function (x, i) {
    return '<div class="file-row"><span class="thumb" style="width:30px;height:30px">' + ext(x.file.name) + '</span>' +
      '<span class="grow ellipsis">' + h(x.file.name) + ' <span class="faint">· ' + fileSize(x.file.size) + '</span></span>' +
      (x.state === 'ready' ? '<button type="button" class="btn ghost sm" data-rm="' + i + '">Remove</button>' :
        x.state === 'done' ? '<span class="badge s-approved">Attached</span>' :
        x.state === 'error' ? '<span class="badge s-changes-requested">Failed</span>' : progressBar(x.progress * 100)) + '</div>';
  }).join('');
  $all('[data-rm]').forEach(function (b) { b.onclick = function () { FILES.splice(Number(b.getAttribute('data-rm')), 1); renderFiles(); }; });
}

function collect() {
  var d = {};
  $all('#f [name]').forEach(function (el) { d[el.name] = el.value.trim(); });
  return d;
}

function validate(d) {
  var ok = true;
  $all('[data-f]').forEach(function (x) { x.classList.remove('bad'); var e = $('.err', x); if (e) e.classList.add('hidden'); });
  function bad(key, msg) {
    ok = false;
    var x = $('[data-f="' + key + '"]'); if (!x) return;
    x.classList.add('bad'); var e = $('.err', x); e.textContent = msg; e.classList.remove('hidden');
  }
  if (!d.requesterName || !d.email) bad('from', 'Add your name and email.');
  else if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(d.email)) bad('from', 'That email doesn’t look right.');
  else if (CFG.allowedDomain && d.email.toLowerCase().split('@')[1] !== CFG.allowedDomain.toLowerCase() && !BOOT.email) bad('from', 'Please use your @' + CFG.allowedDomain + ' email.');
  if (!d.department) bad('department', 'Choose your department.');
  if (!d.preferredDate) bad('deadline', 'When do you need it?');
  else if (d.preferredDate < todayIso()) bad('deadline', 'Pick today or a later date.');
  else if (d.preferredTime && new Date(d.preferredDate + 'T' + d.preferredTime) < new Date()) bad('deadline', 'That time has already passed.');
  var q = Number(d.quantity);
  if (!q || q < 1 || q > 50 || Math.floor(q) !== q) bad('quantity', 'Between 1 and 50.');
  if (!d.brief) bad('brief', 'Tell us what you need.');
  return ok;
}

function submit(e) {
  e.preventDefault();
  fieldErrors(document, '');
  var d = collect();
  if (!validate(d)) { var f = $('.bad'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  var btn = $('#submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:15px;height:15px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></span> Sending…';
  var result;
  api('api_submitRequirement', d).then(function (r) {
    result = r;
    var chain = Promise.resolve();
    FILES.forEach(function (x) {
      chain = chain.then(function () {
        x.state = 'uploading'; renderFiles();
        return uploadFile(x.file, { kind: 'reference', ticket: r.uploadTicket }, function (p) { x.progress = p; renderFiles(); })
          .then(function () { x.state = 'done'; renderFiles(); }, function (err) { x.state = 'error'; x.error = errMsg(err); renderFiles(); });
      });
    });
    return chain.then(function () { return api('api_finalizeRequirement', r.uploadTicket); });
  }).then(function () {
    showDone(result.requirementId, FILES.filter(function (x) { return x.state === 'error'; }));
  }).catch(function (err) {
    if (result) return showDone(result.requirementId, FILES.filter(function (x) { return x.state !== 'done'; }));
    btn.disabled = false; btn.innerHTML = icon('send') + ' Send request';
    fieldErrors(document, errMsg(err));
  });
}

function showDone(id, failed) {
  window.scrollTo(0, 0);
  $('#main').innerHTML = '<div class="card done"><div class="tick">' + icon('check') + '</div>' +
    '<h1>Request sent</h1><p class="muted">The graphics team has it. Your reference ID:</p>' +
    '<div class="ref-id">' + h(id) + '</div>' +
    '<p class="muted">You’ll get an email copy now, and a link to approve the creative when it’s ready.</p>' +
    (failed.length ? '<div class="alert warn" style="text-align:left;margin-top:16px">These files didn’t attach: ' + failed.map(function (x) { return h(x.file.name); }).join(', ') +
      '. Your request is saved — reply to the confirmation email with them.</div>' : '') +
    '<div class="row" style="justify-content:center;margin-top:20px"><button class="btn" id="again">Send another request</button>' +
    (BOOT.backUrl ? '<a class="btn primary" href="' + h(BOOT.backUrl) + '" target="_top">Back to dashboard</a>' : '') + '</div></div>';
  $('#again').onclick = function () { FILES = []; renderForm(); window.scrollTo(0, 0); };
}
</script>
</body>
</html>
