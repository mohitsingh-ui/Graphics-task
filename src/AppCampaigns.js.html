<script>
/* AppCampaigns.js — campaigns (e.g. "Diwali Sale"): many requests + leader tasks, one Drive folder. */

VIEWS.campaigns = function (arg, el, token) {
  if (arg) return campaignDetail(arg, el, token);
  setCrumb('Campaigns');
  api('api_listCampaigns').then(function (list) {
    if (stale(token)) return;
    el.innerHTML = '<div class="page-h"><div><h1>Campaigns</h1><p>Group requests from every department and your own tasks under one name — all approved creatives land in one Drive folder, sorted by category.</p></div>' +
      '<button class="btn primary" id="newCamp">' + icon('plus') + ' New campaign</button></div>' +
      (list.length ? '<div class="camp-grid">' + list.map(function (c) {
        var pct = c.required ? Math.min(100, Math.round(c.approved / c.required * 100)) : 0;
        return '<div class="card camp-card' + (c.active ? '' : ' archived') + '" data-go="campaigns/' + h(c.campaignId) + '"><div class="card-b stack" style="gap:10px">' +
          '<div class="row between"><h3>' + h(c.name) + '</h3>' + (c.active ? '' : '<span class="badge plain">Archived</span>') + (c.shared ? '<span class="badge s-approved">' + icon('link') + ' Shared</span>' : '') + '</div>' +
          '<div class="small muted">' + c.requests + ' request(s)' + (c.departments.length ? ' · ' + h(c.departments.join(', ')) : '') + ' · ' + c.tasks + ' task(s)</div>' +
          '<div><div class="row between small"><span><b>' + c.approved + '</b> of ' + c.required + ' creatives approved</span><span class="faint">' + pct + '%</span></div>' +
          '<div style="margin-top:6px">' + progressBar(pct, pct >= 100) + '</div></div>' +
          '<div class="row wrap" style="gap:4px">' + c.categories.map(function (x) { return '<span class="badge plain" style="font-size:11px">' + h(x.name) + ' · ' + x.count + '</span>'; }).join('') + '</div>' +
          '</div></div>';
      }).join('') + '</div>' : '<div class="card">' + emptyState('No campaigns yet.', 'Create one for a sale or launch, e.g. “Diwali Sale”, then add requests and tasks to it.', 'board') + '</div>');
    wireGo(el);
    $('#newCamp').onclick = function () { campaignModal(null); };
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
};

function campaignModal(c) {
  modal({
    title: c ? 'Rename campaign' : 'New campaign',
    body: '<div class="field"><label class="req" for="cmN">Name</label><input type="text" id="cmN" maxlength="80" value="' + h(c ? c.name : '') + '" placeholder="e.g. Diwali Sale 2026"></div>' +
      (c ? '<label class="check"><input type="checkbox" id="cmA"' + (c.active ? ' checked' : '') + '> Active (shown on the request form and when assigning)</label>' : '') +
      '<div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, { label: c ? 'Save' : 'Create', cls: 'primary', onClick: function (close, m) {
      return api('api_saveCampaign', { campaignId: c ? c.campaignId : '', name: $('#cmN', m).value.trim(), active: c ? $('#cmA', m).checked : true })
        .then(function (r) { close(); toast(c ? 'Saved' : 'Campaign created'); go('campaigns/' + r.campaignId); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
    } }]
  });
}

function campaignDetail(id, el, token) {
  api('api_getCampaign', id).then(function (c) {
    if (stale(token)) return;
    setCrumb('Campaign · ' + c.name);
    var pct = c.required ? Math.min(100, Math.round(c.approved / c.required * 100)) : 0;
    el.innerHTML = '<div class="page-h"><div class="grow"><div class="faint small"><a href="#" data-go="campaigns">Campaigns</a> /</div><h1>' + h(c.name) + '</h1>' +
      '<p>' + c.requests + ' request(s) · ' + c.tasks + ' task(s) · <b>' + c.approved + '</b> of ' + c.required + ' creatives approved</p></div>' +
      '<div class="actionbar"><button class="btn primary" id="cpDrive">' + icon('external') + (c.shared ? ' Drive link' : ' Get Drive link') + '</button>' +
      '<button class="btn" id="cpZip"' + (c.approved ? '' : ' disabled') + '>' + icon('download') + ' Download all (.zip)</button>' +
      '<button class="btn" id="cpTask">' + icon('plus') + ' Assign a task</button><button class="btn" id="cpAddT">' + icon('list') + ' Add existing tasks</button>' +
      '<button class="btn ghost" id="cpAdd">' + icon('inbox') + ' Add a request</button>' +
      '<button class="btn ghost" id="cpEdit">Rename</button></div></div>' +
      '<div style="margin-bottom:16px">' + progressBar(pct, pct >= 100) + '</div>' +
      '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>In the Drive folder</h3><span class="faint small">One folder per category — everyone with the link sees all of them</span></div><div class="card-b row wrap" style="gap:8px">' +
      (c.categories.length ? c.categories.map(function (x) { return '<span class="cat-chip">' + icon('file') + ' <b>' + h(x.name) + '</b> ' + x.count + '</span>'; }).join('') : '<span class="faint small">Nothing approved yet.</span>') + '</div></div>' +
      '<div class="detail"><div class="stack">' +
      '<div class="card"><div class="card-h"><h3>Tasks</h3><span class="faint small">' + c.taskList.length + '</span></div><div class="table-wrap">' +
      (c.taskList.length ? '<table class="t"><thead><tr><th>Task</th><th>Category</th><th>Designer</th><th>Approved</th><th>Due</th><th>Status</th></tr></thead><tbody>' + c.taskList.map(function (t) {
        return '<tr class="click" data-go="task/' + h(t.taskId) + '"><td><div style="font-weight:500">' + h(t.title) + '</div><div class="faint small">' + h(t.taskId) + ' · ' + h(t.requirementId) + '</div></td>' +
          '<td class="small">' + h(t.category || '—') + '</td><td class="small">' + h(t.assigneeName || 'Not assigned') + '</td><td>' + t.approved + '/' + t.required + '</td>' +
          '<td class="small">' + (t.hold ? '<span class="faint">Paused</span>' : dueLabel(t)) + '</td><td>' + statusBadge(t.status) + '</td></tr>';
      }).join('') + '</tbody></table>' : emptyState('No tasks yet.', 'Use “Assign a task” or add a request.')) + '</div></div></div>' +
      '<div class="stack"><div class="card"><div class="card-h"><h3>Requests</h3></div><div class="card-b tight">' +
      (c.requestList.length ? c.requestList.map(function (r) {
        return '<div class="list-item" data-go="task/' + h(r.firstTaskId) + '"><div class="li-main"><div class="li-title">' + h(r.title) + '</div><div class="li-sub">' + h(r.requirementId) + ' · ' +
          h(r.internal ? 'Your task' : r.department + ' · ' + r.requesterName) + ' · ' + r.approved + '/' + r.required + '</div></div>' +
          '<button class="btn ghost sm" data-unlink="' + h(r.requirementId) + '" title="Remove from campaign">' + icon('x') + '</button></div>';
      }).join('') : '<p class="faint small" style="padding:8px 16px">No requests yet.</p>') + '</div></div></div></div>';
    wireGo(el);
    $('#cpDrive').onclick = function () { driveFolderModal(c.campaignId); };
    $('#cpZip').onclick = function () { zipDownload(c.campaignId, false, this); };
    $('#cpTask').onclick = function () { directTaskModal({ campaignId: c.campaignId, campaignName: c.name }); };
    $('#cpEdit').onclick = function () { campaignModal(c); };
    $('#cpAdd').onclick = function () {
      if (!c.addable.length) return toast('All requests are already in a campaign.', true);
      modal({ title: 'Add a request to ' + c.name, body: '<p class="muted" style="margin-top:0">Its approved creatives move into the campaign’s Drive folder.</p><div class="field"><select id="cpR">' +
        c.addable.map(function (r) { return '<option value="' + h(r.requirementId) + '">' + h(r.requirementId + ' · ' + r.title + (r.department ? ' · ' + r.department : '')) + '</option>'; }).join('') + '</select></div><div class="alert bad hidden" data-form-error></div>',
        actions: [{ label: 'Cancel' }, { label: 'Add', cls: 'primary', onClick: function (close, m) {
          return api('api_setRequestCampaign', $('#cpR', m).value, c.campaignId).then(function () { close(); toast('Added'); render(APP.route); }).catch(function (e) { fieldErrors(m, errMsg(e)); });
        } }] });
    };
    $('#cpAddT').onclick = function () { addTasksModal(c); };
    $all('[data-unlink]', el).forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        confirmBox('Remove from campaign?', 'The request stays as it is; its approved files move back to its own folder.', 'Remove', true).then(function (y) {
          if (y) api('api_setRequestCampaign', b.getAttribute('data-unlink'), '').then(function () { toast('Removed'); render(APP.route); }).catch(function (er) { toast(errMsg(er), true); });
        });
      };
    });
  }).catch(function (e) { if (!stale(token)) viewError(el, e); });
}
/** Leader: tick already-assigned tasks and pull them into this campaign. */
function addTasksModal(c) {
  var list = c.addableTasks || [];
  if (!list.length) return toast('Every task is already in this campaign.', true);
  var m = modal({ title: 'Add tasks to ' + c.name, wide: true,
    body: '<p class="muted" style="margin-top:0">Pick tasks that are already assigned. Their approved creatives move into the campaign’s Drive folder, and new ones go straight there.</p>' +
      '<input type="search" id="atQ" placeholder="Search task, title, designer, department…" style="width:100%;margin-bottom:8px">' +
      '<div class="pick-list" id="atList">' + list.map(function (t) {
        return '<label class="pick-row" data-hay="' + h([t.taskId, t.requirementId, t.title, t.assigneeName, t.department, t.inCampaign, t.status].join(' ').toLowerCase()) + '">' +
          '<input type="checkbox" value="' + h(t.taskId) + '" data-same="' + t.sameRequest + '" data-req="' + h(t.requirementId) + '">' +
          '<span class="grow"><b>' + h(t.title) + '</b><span class="faint small"> · ' + h(t.taskId) + ' · ' + h(t.assigneeName || 'Not assigned') + (t.department ? ' · ' + h(t.department) : '') + '</span>' +
          (t.inCampaign ? '<br><span class="small" style="color:var(--warn)">Now in “' + h(t.inCampaign) + '” — will move here</span>' : '') + '</span>' + statusBadge(t.status) + '</label>';
      }).join('') + '</div><p class="hint" id="atHint" style="margin-bottom:0"></p><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, { label: 'Add to campaign', cls: 'primary', onClick: function (close, mm) {
      var ids = $all('#atList input:checked', mm).map(function (x) { return x.value; });
      if (!ids.length) { fieldErrors(mm, 'Tick at least one task.'); return Promise.resolve(); }
      return api('api_setTasksCampaign', ids, c.campaignId, '').then(function (res) { close(); toast(movedMsg(res)); render(APP.route); }).catch(function (e) { fieldErrors(mm, errMsg(e)); });
    } }] });
  var root = m.el;
  $('#atQ', root).oninput = function () {
    var q = this.value.toLowerCase().trim();
    $all('#atList .pick-row', root).forEach(function (r) { r.style.display = !q || r.getAttribute('data-hay').indexOf(q) !== -1 ? '' : 'none'; });
  };
  $all('#atList input', root).forEach(function (x) { x.onchange = function () { $('#atHint', root).textContent = siblingHint($all('#atList input:checked', root)); }; });
}

/** "2 more tasks of REQ-… move with them" — campaigns hold whole requests. */
function siblingHint(checked) {
  var picked = {}, same = {}, extra = 0;
  checked.forEach(function (x) { var r = x.getAttribute('data-req'); picked[r] = (picked[r] || 0) + 1; same[r] = Number(x.getAttribute('data-same')) || 0; });
  Object.keys(picked).forEach(function (r) { extra += Math.max(0, same[r] + 1 - picked[r]); });
  return extra ? extra + ' other task(s) from the same request(s) will come along, so the whole request stays in one folder.' : '';
}

function movedMsg(res) {
  if (!res || !res.tasks) return 'Already in that campaign';
  return res.tasks + ' task(s) now in “' + res.campaignName + '” — files go to its Drive folder';
}

/** Leader: choose a campaign (or type a new one) for the given tasks. */
function campaignPickModal(taskIds, done) {
  api('api_listCampaigns').then(function (list) {
    var act = list.filter(function (x) { return x.active; });
    var m = modal({ title: 'Add ' + taskIds.length + ' task(s) to a campaign',
      body: '<p class="muted" style="margin-top:0">Everything approved goes into one Drive folder. Tasks from the same request move together.</p>' +
        '<div class="field"><label>Campaign</label><select id="cpkSel">' + act.map(function (x) { return '<option value="' + h(x.campaignId) + '">' + h(x.name) + '</option>'; }).join('') +
        '<option value="__new"' + (act.length ? '' : ' selected') + '>+ New campaign…</option></select></div>' +
        '<div class="field' + (act.length ? ' hidden' : '') + '" id="cpkNewF"><label>New campaign name</label><input id="cpkNew" maxlength="80" placeholder="e.g. Diwali Sale 2026"></div>' +
        '<div class="alert bad hidden" data-form-error></div>',
      actions: [{ label: 'Cancel' }, { label: 'Add', cls: 'primary', onClick: function (close, mm) {
        var v = $('#cpkSel', mm).value, nm = v === '__new' ? $('#cpkNew', mm).value.trim() : '';
        if (v === '__new' && !nm) { fieldErrors(mm, 'Type a name for the new campaign.'); return Promise.resolve(); }
        return api('api_setTasksCampaign', taskIds, v === '__new' ? '' : v, nm).then(function (res) { close(); toast(movedMsg(res)); if (done) done(res); }).catch(function (e) { fieldErrors(mm, errMsg(e)); });
      } }] });
    var root = m.el;
    $('#cpkSel', root).onchange = function () { $('#cpkNewF', root).classList.toggle('hidden', this.value !== '__new'); if (this.value === '__new') $('#cpkNew', root).focus(); };
  }).catch(function (e) { toast(errMsg(e), true); });
}
/** Leader: create a campaign and put this task's request into it in one step. */
function campaignPickModalNew(taskId, done) {
  modal({ title: 'New campaign', body: '<div class="field"><label>Campaign name</label><input id="cpnName" maxlength="80" placeholder="e.g. Diwali Sale 2026"></div>' +
    '<p class="hint" style="margin:0">This task (and the rest of its request) goes into it; approved files move to its Drive folder.</p><div class="alert bad hidden" data-form-error></div>',
    actions: [{ label: 'Cancel' }, { label: 'Create & add', cls: 'primary', onClick: function (close, mm) {
      var nm = $('#cpnName', mm).value.trim();
      if (!nm) { fieldErrors(mm, 'Type a name.'); return Promise.resolve(); }
      return api('api_setTasksCampaign', [taskId], '', nm).then(function (res) { close(); toast(movedMsg(res)); if (done) done(res); }).catch(function (e) { fieldErrors(mm, errMsg(e)); });
    } }] });
}
</script>
