<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= include_('Styles') ?>
<style>
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; z-index: 40; }
  .side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-weight: 600; font-size: 14px; }
  .side .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
  .side .brand small { display: block; font-weight: 400; color: var(--text-3); font-size: 11.5px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--text-2); font-weight: 500; font-size: 13.5px; text-decoration: none; }
  .nav a svg { width: 18px; height: 18px; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.on { background: var(--accent-soft); color: var(--accent-ink); }
  .nav a .cnt { margin-left: auto; font-size: 11px; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 6px; min-width: 18px; text-align: center; }
  .side .me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 8px 0; font-size: 12.5px; }
  .side .me b { display: block; font-weight: 500; }
  .top { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 30; }
  .top .crumb { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; }
  .content { padding: 24px; max-width: 1360px; width: 100%; margin: 0 auto; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-h p { margin: 4px 0 0; color: var(--text-2); }
  .two-col { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .notif-pop { position: absolute; right: 16px; top: 54px; width: 380px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 50; }
  .notif { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .notif.unread { background: #fffaf2; }
  .notif:hover { background: var(--surface-2); }
  .bell { position: relative; }
  .bell .dotc { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
  .menu-btn { display: none; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .filters select, .filters input { height: 34px; font-size: 13px; width: auto; }
  .filters input[type=search] { min-width: 200px; flex: 1; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--muted-soft); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 140px; }
  .col-h { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 2px 4px 4px; }
  .tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 7px; }
  .tcard:hover { border-color: var(--line-strong); }
  .tcard .tc-title { font-weight: 500; font-size: 13.5px; line-height: 1.35; }
  .tcard .tc-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--text-3); }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 14px; }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
  .actionbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .deliv { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .deliv + .deliv { margin-top: 12px; }
  .deliv-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ver { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .ver:last-child { border-bottom: 0; }
  .ver .thumb { cursor: zoom-in; width: 72px; height: 72px; }
  .feedback { margin-top: 6px; padding: 8px 10px; border-radius: 7px; font-size: 13px; }
  .feedback.changes { background: var(--bad-soft); color: #7d241c; }
  .feedback.approved { background: var(--ok-soft); color: #22603c; }
  .brief-block + .brief-block { margin-top: 16px; }
  .ref-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .ref-grid .thumb { width: 84px; height: 84px; cursor: pointer; }
  .prog-steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .prog-steps button { flex: 1; min-width: 52px; }
  .prog-steps button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cmp .preview-box { min-height: 300px; }
  .scrim { display: none; }
  @media (max-width: 1100px) { .detail, .two-col { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
    .side.open { transform: none; }
    .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 35; }
    .menu-btn { display: inline-flex; }
    .top { padding: 0 12px; }
    .content { padding: 16px 12px; }
    .cmp { grid-template-columns: 1fr; }
    .filters input[type=search] { min-width: 100%; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><div class="mark" id="brandMark">G</div><div><span id="brandName">Graphics</span><small id="brandSub">Team portal</small></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div style="min-width:0">
    <header class="top">
      <button class="btn ghost icon menu-btn" id="menuBtn" aria-label="Menu"></button>
      <div class="crumb ellipsis" id="crumb"></div>
      <button class="btn ghost icon" id="refreshBtn" aria-label="Refresh" title="Refresh"></button>
      <button class="btn ghost icon bell" id="bellBtn" aria-label="Notifications"></button>
    </header>
    <div class="notif-pop hidden" id="notifPop"></div>
    <main class="content" id="view"><div class="loading-page"><span class="spinner"></span> Loading your dashboard…</div></main>
  </div>
</div>

<?!= include_('AppCore.js') ?>
<?!= include_('AppViews.js') ?>
<?!= include_('AppTask.js') ?>
<?!= include_('AppAdmin.js') ?>

var BOOT = <?!= bootJson ?>;
startApp(BOOT.route || 'overview');
</script>
</body>
</html>
